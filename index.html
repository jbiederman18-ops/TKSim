const HOWTO=`<p><b>📱 On a phone:</b> Go live stays pinned above the tabs on Book. Swipe a sheet down by its handle to close it. The back button closes the open sheet, then goes back to the screen you were on — it does nothing mid-show or with someone at your office door.</p><p><b>🖥️ On a computer:</b> 1–5 switch tabs and 0 opens Settings; A–E answer a lettered choice; Space or Enter advances live scenes and the reveal; Esc closes a sheet. Right-click a wrestler card for their details. On a wide screen the booking pick sheet docks to the right so the card table stays in view.</p><p><b>📅 The calendar:</b> the strip on the Home screen (or <b>WK</b> in the header) opens the whole year — where you are, every PPV and what's special about it (the Rumbles, Money in the Bank, the supershows, the crossover), TV specials, tournament rounds, crossover season, matches you've promised and the week each of your contracts runs out.</p><p><b>Offers &amp; contracts:</b> free agents with 55+ popularity want an offer, not just a fee: a signing bonus, a weekly salary and promises — creative control, main event spots, a title shot, a place on every PPV. Each wrestler wants different things, so the biggest number doesn't always win. Offers are sealed: the rival (or, in a league, every other GM) can send one too, and the wrestler picks the best package. Re-signing is a negotiation: agree to their demands, or counter on money and refuse some — they take it, counter back or walk away depending on morale, how hot your show is and whether you've kept your word. Refuse a demand and you can offer more than they asked to buy it out. A lowball can insult anyone, even a happy wrestler (the read of the room warns you), and when they counter they dig in on the demand they care about most. Promises are contract terms you'll see on the Book screen. Break one and morale drops; break three and they may walk out. Creative control means they won't agree to lose. Booked to lose, they show up on your checklist with <b>Talk to them</b> (and again when you go live): offer to <b>protect them in the finish</b> (they lose to a cheat, an upset roll-up or a count-out — no clean pin), <b>a big win down the line</b> (a main-event or PPV win within 4 weeks) or <b>their win back</b> (beat the same opponent by the next PPV). Each is easier to sell than the last, and morale, broken promises, how hot your show is and who they're losing to all count. Say no or turn them all down and go live anyway, and they fight the finish: half the time they go over (−¼★), otherwise they do the job under protest (morale −18). A promised win shows on your checklist until it happens; miss the deadline and it's a broken promise.</p><p><b>The countdown:</b> now and then a countdown clock appears on the big screen during a solo promo. It hits zero 3 weeks later, and a free agent from the other side of the face/heel line debuts and goes after the wrestler who had the mic — instant heat. You get first dibs on signing them that week at a discount (more if the promo hyped the clock). If you or the rival sign them early, they debut for whoever did.</p><p><b>🩸 Blood &amp; Guts:</b> once a year, like the real thing. Week ${BNG_WEEK} is the Blood &amp; Guts TV special, and it's the only night the Blood &amp; Guts stipulation can be booked — one trios or 8-man war per card, two rings inside a double cage. The <b>Backstage this week</b> panel on Home gives you a heads-up three weeks out so you can build a faction war with real heat, and the calendar marks the night. On the night, the Book screen leads with it: the poster carries the special's name, a Blood &amp; Guts card shows whether the war is booked, and <b>Book the war</b> sets one up in the main event. The rival books one too when it can.</p><p><b>The card table:</b> every wrestler is a card. On the Book screen, tap an empty slot and the sheet first asks what kind of segment it is — Singles, Tag, Trios, 8-man tag, Triple threat, Four-way, Squash or Open challenge for a match; the promo types for a promo. Then a sheet of cards slides up for it (drag it up to fill the screen and scroll the cards; drag it down to lower it) — promises, requests and title defenses first under <b>Needs you tonight</b>, then your whole roster, best fit first, each with a tab saying why — rivals of anyone already across the ring lead it, hottest first, in tag, trios and multi-way matches too (anyone already in a match waits under <b>Already booked tonight</b> at the bottom of a match's sheet, and anyone already cutting a promo at the bottom of a promo's). Tap one to put them in and the sheet moves on to their opponent; <b>Champions</b>, <b>Faces</b> and <b>Heels</b>, <b>Men</b> and <b>Women</b>, and the crowd symbols narrow the list without changing the order. The match or promo type stays at the top of the sheet; tap it to change it. In a bigger match the table lays out every space and the sheet fills one whole team, then the next (picking a smaller match sends the extras back). Once both sides are set, the sheet's tabs set the rest: <b>Stipulation</b> (gold ones suit who's in there), <b>Title</b> (non-title, or which belt is on the line — gold when it pays off a title shot someone in the match is owed), <b>Finish</b> (clean, or a screwy one that builds heat and protects the loser — plus <b>Make it the blow-off</b> for a hot feud on TV and any Money in the Bank cash-in) and <b>Run-in</b> (pick how, who they go after, then tap the card of who runs in, with the turn option when it applies). The tags under a booked match open those tabs directly. A champion in a match with no title on the line gets a <b>Non-title</b> tag — tap it to put their belt up (or see why it can't be). Hold a slot's number and drag it to change the running order, or tap <b>Running order</b> for up/down arrows — whichever match sits in the last match slot is your main event. Tap <b>👑 Win</b> under a side to make it the winner, and <b>Pin</b> under whoever takes the fall in tag and multi-person matches. Tap a wrestler already on the card to swap them out, send them back or see their details; hold one to pick it up and drop it on another slot to move it or on another wrestler to trade places. Special matches are booked on the table too. <b>Squash</b> and <b>Open challenge</b> are match types in the first step (a squash can use local enhancement talent; an open challenge shows a face-down card until someone answers live). Tournament matches are locked to the bracket: tap <b>👑 Win</b> under a side to pick who advances, and the sheet's tabs set the stipulation, finish and run-in. In a Royal Rumble, Money in the Bank or the Casino Gauntlet, tap an entrant to swap them out, and the sheet's <b>Result</b> tab picks the winner and who takes the fall. The dream match picks one of yours, then one of the rival's. On the roster, sorting by anything but Overall puts that number on each card.</p><p><b>Squash matches:</b> a quick, one-sided win that builds a wrestler up. It's short, so it never rates highly (about 2½★ at most) — momentum at the cost of show quality, so save it for someone who needs the win. Against <b>local enhancement talent</b> (an unsigned nobody from free agency) it costs nothing. Against someone on your roster, the winner gets more out of beating a name, but the loser pays: the more popular they are, the more popularity and morale it costs them (a burial). Squash the same wrestler too often and each one does less (full, then 60%, then 30%, then nothing within six weeks), and squashing someone more popular than the winner backfires.</p><p><b>Open challenges:</b> book one wrestler and see who answers — someone from your roster or the free agents, usually at the challenger's level. The crowd builds up a favourite beforehand: deliver them (or someone bigger) for a huge pop, or fall flat with someone they didn't want. The answer is revealed live and you call the finish. A champion can put their title on the line. A free agent who impresses can be signed at a discount for one week.</p><p><b>Pitches:</b> every couple of weeks a wrestler brings you an idea — a turn, a new skill, a wild new character, a feud, a tag partner, or a problem they need fixed. <i>Go for it</i> commits to it (some start a short trial with a clear goal — hit it and it sticks); <i>Sorry, not right now</i> costs a little morale. They line up outside your office at the start of the week, and you answer before you book. Trials and promises you make are tracked on the Book screen's checklist.</p><p><b>🗣️ Requests at your door:</b> a wrestler holding you to a <b>title shot in their contract</b> comes to your office and asks for it: <i>tonight</i> (it goes to the top of Needs your attention — book it for a morale boost, leave it off and they lose more than if you'd said no), <i>at the next PPV</i> (it goes on that card and the calendar, and they won't ask again before then), or <i>not this week</i> (a little morale; they ask again in a few weeks, or right away when the deadline arrives). Everything else a wrestler is owed — an earned title shot, a main-event or PPV clause, a win you promised for doing the job — is on the Book screen's checklist and tagged on the card. A feud going stale shows up in This week.</p><p><b>Past 5★:</b> a match can only show 5★, but a hot feud on the big stage can rate well past it. The extra becomes an instant-classic bonus — popularity, title prestige, more PPV buys (or merch on TV) and a few extra fans (capped per show, since the show rating already counts those stars). That's also why a gimmick match or a gutsy producer call still pays off on a match that was already headed for 5★.</p><p><b>🎧 Live calls:</b> a real disaster brewing can stop any show: a wrestler badly worn down and injury-prone, running on fumes, or miserable enough to cause trouble, or real backstage heat between two people in the ring. That always comes to you live. Real-life grudges you told them to settle in the ring and whispers you approved always get their call. Every segment plays out and you see how it went in the star reveal. A promo rates from who's out there, the kind of promo and the feud. When an arc ends in a decision (sign or refuse, ceasefire or total war, and so on), you make it right before the payoff. In The Gauntlet\'s true-father story, you name the father right after the title match.</p><p><b>👥 The crowd</b> builds or cools across the night with every segment, shown at the top of every live screen (Cold, Warm, Hot, Electric). A hot crowd pushes wrestlers to reach: risky calls swing further both ways, and risky or reckless spots can get someone hurt (more so in hardcore stipulations and when they're tired). A cold crowd shrinks the swings. Tired wrestlers miss more, and every match is only as good as its weakest worker — a great hand can't carry someone who's out of their depth.</p><p><b>💬 Locker room whispers:</b> now and then someone booked on your card pitches a specific spot for their match — a dive off the cage, a new submission, a buddy distracting the referee — based on how they wrestle, the stipulation and whether they're a face or a heel. It shows on their match on the Book screen. Go for it and that match is guaranteed a call in gorilla built around their idea (the full spot, a toned-down version, or waving it off); pass and they're a little let down. At most one a week.</p><p><b>Challenge scenarios:</b> from the new-game screen, <b>🎯 Challenge scenarios</b> starts a solo season with a twist and one goal against a deadline — make a 50-popularity wrestler a 75 by All In, dig out of a $500K hole, win 6 straight weeks of TV, put on 12 five-star matches, beat a stacked Hard rival, crown a homegrown champion, or keep a whole locker room happy. A card on Home tracks your progress. Win or lose, the save carries on as a normal game, and your best results are kept on this device.</p><p><b>Morale:</b> it moves every week, and tapping a wrestler shows their <b>Mood</b> with the reasons from the last four weeks. TV time, wins, main events, kept promises and answered pitches lift it. Sitting at home wears on people (stars after 2 weeks off TV, everyone else after 3), clean losses sting (more for stars, and most when they lose to someone less popular), and being worn down (75+ fatigue) or underpaid grinds on them. Very high morale settles back toward the mid-80s.  <b>Keeping your word pays:</b> a wrestler getting what they were owed — a pitch you said yes to, a title shot or main event in their contract, their every-PPV spot, or a champion finally defending — goes out hungry that night (<b>Getting what they were owed</b> in Why that rating?), and the payoff brings in fans (up to 3 a show, more for a smaller company). Break your word to one and the whole locker room hears about it (−1 morale to everyone else), and a broken contract term pays out 6 weeks of their salary to their agent. <b>Mood shows in their work:</b> below 50 morale a wrestler phones it in — the lower, the worse their matches and promos — and above 75 they go the extra mile; it's the <b>Morale</b> line in Why that rating?. Unhappy wrestlers escalate: under 55 they may demand a raise, under 45 they threaten to walk out, under 35 they may cut a <b>shoot promo</b> on live TV or air grievances at the <b>media scrum</b>, and under 25 — or after you call their bluff — they can actually <b>walk out</b> for a few weeks. Each one is a front-office decision you make before the next show. Pitches come about every two weeks (more often when people are unhappy): main events, title shots, mic time, a feud, a <b>spot on the next PPV</b>, a <b>dream match</b> with a bigger star, rest, a raise and more.</p>
<p><b>🤝 Backstage friends:</b> after the draft your locker room is quietly split into friend groups of up to five, each built around one of your top stars, with a few people who keep to themselves. You aren't told who's in which. Friends feel what happens to each other: when something big happens to a wrestler (a promise or contract term kept or broken, a pitch trial that worked or failed, a win or loss in a title match, the main event or on a PPV), each of their friends gets about a third of that morale swing, shown in their Mood as "Happy for…" or "Upset about how… was treated". Everyday things like TV time stay personal. So keeping your word to a midcarder can lift a main eventer, and breaking it can sour one. Their Mood always says why, even before you know who: "Upset about how a friend was treated". Who's friends with whom comes out over the season: a shared moment (a promise kept or broken, a pitch trial, a new champion) can bring it out, and by the third one it always does. You'll see "Word backstage" in This week, the friend's name replaces "a friend" in their Mood, and the pair appears on both profiles as <b>Backstage friends</b>. Friendships shift too: now and then someone falls out with their group (likelier when two of them have real backstage heat), keeps to themselves for a few weeks, then finds a new crowd. When it happens they come to your office to tell you: offer condolences if you knew they were friends, or find out the hard way ("Wait, you were friends?"). Now and then a top star comes to your office about a friend: angry about a broken promise (pay a bonus to make it right, or call it business and let it linger), or thankful for a kept one or a title win (take them both to dinner, or just say thanks). If the line outside your office is full that week, they wait a few weeks for a turn, and if they never get one the split still makes the news. Groups are dealt fresh every game, and newcomers find a group after a few weeks, or don't.</p>
<p><b>🌧️ Locker-room mood:</b> the whole roster's average morale matters too. Under 66, every match and promo on your show loses a little for each point below (a "Locker room mood" line in Why that rating?), and Backstage this week on Home tells you the locker room is down. Keep the average up and it costs you nothing. <b>📣 The crowd chant</b> pays its way: book the wrestler the crowd is chanting for and that segment gets +½★, +2 popularity and 5K fans.</p>
<p><b>🏟️ Your buildings:</b> every TV show happens in a building you pick on the Book screen. The <b>Piddly-Ass Auditorium</b> is free and always fills, but its box office tops out fast. The <b>Good Building</b> unlocks once for $400K and then costs $55K for each TV show you book it: tickets ×1.45, a box office that can grow 1.6× further, +15% fans from good shows. The <b>Actual Arena</b> unlocks for $1M (after the Good Building) and costs $130K a show: tickets ×1.9, a box office 2.2× bigger, +30% fans. Unlock buildings in the Front office. A big room has to be filled: <b>crowd pull</b> is your buzz from the last 3 shows plus tonight's show, nudged up by a happy locker room and down by an unhappy one. Fall short and the seats are empty: tickets ×0.6, merch down, a flat crowd (−0.1★) and −2K fans. The Book screen shows, for each building you own, whether tonight's card will fill it. Your pick stays until you change it, and PPVs keep their own venues with no building fee. <b>Big audience, small room:</b> once you pass 700K fans your top stars (85+) expect the Good Building, and past 1.4M the Arena, whenever you can afford it. Three TV shows in a row below that and they lose a little morale every show, and the biggest of them comes to your office: promise the bigger room next week and keep it, and the top of the card perks up; break it and they sour.</p>
<p><b>😤 Prove them wrong:</b> everyone still on the board when the draft ends was passed over, and they know it. Sign one of them in season 1 and they arrive with a chip on their shoulder: +10 morale, a little extra in their matches and promos for their first 4 weeks (a "Prove them wrong" line in Why that rating?) and +1 popularity for each of those weeks they get on TV. Draft light and you'll have more money to sign them.</p>
<p><b>🌟 Star egos:</b> stars (80+ popularity) want the spotlight. One who isn't a champion and hasn't been featured for 2 weeks (a main event, a 3½★+ match or promo, or a PPV win) loses morale every week ("Wants the spotlight"), and the more stars you carry, the more it stings — about a point a week with 10 stars on your roster, half that with 5. Past 10 it reads "Lost in a crowded locker room": more egos than spotlights. A stacked roster can still work if you rotate who gets featured; a lighter one is easier to keep happy.</p><p><b>🕵️ Tampering:</b> when an unhappy or underpaid wrestler's deal has 8 weeks or less left, the rival office (in a league, "another company") may call them. The line outside your office brings the rumor with their offer: <b>match &amp; extend</b> (26 more weeks at the rival's number), <b>negotiate</b>, <b>sit down with them</b> (it may calm things down), or let them go. If the deal runs out with the rival in their ear, they sign with the rival on the spot instead of reaching free agency (in a league, they hit free agency).</p><p><b>🚑 Injury decisions:</b> when one of your wrestlers is hurt for a few weeks, the trainer comes to your office door at the start of the week to ask how to handle it: <b>let it heal</b>; <b>rush them back</b> in about half the time, but they're fragile for 6 weeks after they return (lower durability, much higher re-injury risk); or, for longer injuries, <b>surgery</b> — more time out and a fee, but they come back fresh, happy and tougher (+5 durability).</p><p><b>📖 History book</b> (Titles screen or the Office): every title's lineage — each reign, how long it lasted, defenses and how it ended — plus career records (most wins, title reigns, five-star matches, main events, PPV wins, biggest legacies, greatest matches), year-end awards season by season, and the <b>Hall of Fame</b>. At each year-end, retiring wrestlers with a big enough legacy are inducted automatically, and you get one pick of your own for the class. Tap any wrestler for their career line and head-to-head records.</p><p><b>🔁 Trades</b> (Office, or 🔁 Trade on another brand's wrestler): up to two wrestlers each way, with cash either way. Champions can't be traded and nobody can go over 30. Solo, the rival answers on the spot — accept, counter (they want more cash) or decline — judging overall, upside and contract length, and harder on Hard; every few weeks it may also call with an offer of its own, which waits outside your office for a week. In a league, offers wait outside the other GM's office until they accept or decline. Traded wrestlers keep their contracts; unhappy ones welcome the fresh start.</p><p><b>🎟️ The road to the PPV:</b> every PPV has a hype meter (shown on Home and the Book screen) that builds over the weeks before it. Good TV shows add hype and flat ones cost some, keeping hot feuds (35+) going adds a little, and <b>announcing PPV matches</b> — a Contract Signing, or a callout booked for the PPV — adds a lot (up to 4). The <b>go-home show</b>, the TV show right before the PPV, matters most: a strong one adds a lot, a flat one costs you. On the night, hype moves ticket sales (−15% to +15%) and brings extra fans to a hot build (or costs some after a cold one). Then it resets for the next PPV.</p><p><b>Contract countdown:</b> whenever a deal has 5 weeks or less left (9 for stars at 70+ popularity), a ✍️ card on Home lists every name (as their wrestler card) with their weeks remaining — amber at 3, red on their last show — and tapping a name opens the negotiation. The Book screen repeats it, and if you go live on someone's last show you're asked to re-sign them or let them go first.</p><p><b>📰 This week:</b> the week's news, on Home — read it when you like. Three places, three jobs: anyone who needs an <b>answer</b> comes to your office door; anything about <b>tonight's card</b> is on the Book screen's checklist (the panel just links to it with a count); and the panel is <b>news only</b> — how last week's calls turned out, ROH, who's unhappy, hurt or worn down, real backstage heat, feuds going stale, the free-agent market, sealed offers and trades waiting on an answer, and the calendar. Names open the wrestler; nothing in it needs a decision. Anything that changed since last week is tagged NEW and sorted first; the first few rows show and the rest fold away (the choice sticks).</p><p><b>🚪 The line outside your office:</b> anything that needs your answer away from the card — a wrestler's pitch or demand, a front-office situation, an injury call, a tampering rumor, a trade offer, a signing offer, a prospect's tape or email, an agent whose client's contract is down to its last two shows (its last show for anyone under 55 popularity who isn't a champion) — lines up outside your office at the start of the week — the line opens by itself whenever Home or Book is on screen. You see who's waiting and call them in one at a time ("2 of ${typeof DESK_MAX!=="undefined"?DESK_MAX:4}"), each in their own words with the answers right there; answer one to call in the next. Only <b>${typeof DESK_MAX!=="undefined"?DESK_MAX:4} get in each week</b>, the most urgent first — a front-office situation, a pitch, a contract on its last show and the trainer always get in — and everyone else waits for a later week, still in line. Nothing goes live with one still waiting, and Home shows a strip if any are.</p><p><b>Needs your attention:</b> the Book screen's checklist of everything that matters for this show, checked live against your card. What still blocks a clean go-live sits on top; the rest is under Everything else — <b>Before you go live</b> (slots still to book, requests, promised matches, promises, contracts ending tonight), <b>Chances tonight</b> (weekly goal, crowd chant, the rival's main event), <b>Keep in mind</b> (titles that need defending, backstage heat, tired or unhappy wrestlers, creative control) and <b>Front office</b> (a roster running thin, contracts ending soon, free agents' last week). Most items have a button straight to the fix, and going live with something in the first group still open asks you first.</p><p><b>Crowds served:</b> above tonight's card, the five crowd symbols light up as you book: every crowd is measured the same way, as if each match lands right at what that crowd expects: <b>lit</b> means it should grow tonight, <b>half-lit</b> means it should hold steady, <b>dim</b> means it's slipping. A hardcore crowd needs a real match of its own to hold (Technical fans also hate screwy finishes and run-ins that cost someone a match), though Chaos fiends get a taste of what they want from a promo with a Chaos fiend on the mic; casuals are hooked by the card as a whole: big stars, their own favourites, titles, spectacle and hot feuds. How well the matches actually go still decides the night. Each booked match shows the symbols of the crowds it reaches. Tap <b>Details</b> on a slot for what makes the match: Talent, Chemistry, Story and Extras.</p><p><b>Match ratings</b> blend in-ring skill (the best worker in the match helps carry the rest), popularity, chemistry (styles that mesh — high-flyers vs powerhouses, technicians vs technicians — plus face vs heel and history together), feud heat, stipulation fit, title prestige and stamina.</p><p><b>Booking by feel:</b> each booked match shows a thin line of Talent, Chemistry, Story and Extras pips (a stipulation's price, tiredness and injury risk sit beside it), the crowds it reaches, and ▲/▼ tells on each stipulation, title and finish. Some booking widens the range a match can land in, both ways: a first meeting, a stipulation, a screwy finish, a run-in or a green rookie. <b>Details</b> shows each match's <b>Swing</b> (Safe, Risky or Playing with fire) and what's causing it, and a match between two people who've never shared a ring carries a <b>❓ First meeting</b> tag — a gamble, but their chemistry is found for good. After a solo show the results play out as a tug of war you advance with a tap: each round, your segment comes up first with the wrestlers' photo cards — the winner gets a WIN tag and its stars fill in — then the rival's segment in the same slot flips over on the other side, and the rope swings toward the better one. Tap again for the next round (a tap mid-round jumps ahead). The main event holds on a drumroll and runs straight into the final ratings; Skip jumps to the end. Then open <b>Full results</b> and tap <b>Why that rating?</b> under any of your matches to see exactly what each part was worth, including the luck of the night.</p><p><b>Discovered chemistry:</b> two wrestlers who have never shared a ring show their chemistry "on paper" only (styles, face vs heel, traits) with a ❓. The full style chart is on any wrestler's page under <b>How chemistry works</b>. Their first match together finds out whether they really click — and that spark stays with them as history from then on.</p><p><b>Building stars:</b> popularity from a match is judged against what's expected at each wrestler's level, so a midcarder in a good-for-them match grows while a main eventer still needs a real performance. The fastest way to make someone is to put them next to a top star: tag them together, put them in a multi-person match with the star (winning it helps most), or have them beat the star once — the bigger the name you beat, and the better the match, the bigger the rub. Losing to a top star in a good match costs very little; losing every week to midcarders does.</p><p><b>The top of the card:</b> popularity gets much harder to gain past 80, and harder again past 90, so a 100 is rare. Stars at 85+ also need upkeep: in any week they don't main event, win on PPV or have a 3½★+ match, they slip a little (half as much if they carried a lower name in a decent tag or multi-person match). At 90+ the bar is higher: only a main event, a PPV win or a 4★+ match holds their spot. Keep your top stars featured — and pay them back with a big win after they've spent a few weeks making someone else.</p><p><b>Multi-person matches:</b> in triple threats, 4-ways, tags and trios the top two names carry the crowd and the hottest rivalry in the ring sets the heat. Triple threats and 4-ways love high-flyers and showmen, tag matches lean on partners who click, and a good mix of styles (plus someone to boo) helps. They pay off later too: only one loser takes the fall, lower names gain popularity from working with the top star, and the top star does less of the work (less stamina).</p>
<p><b>Shows</b>: ${cardMatches(false)} matches and 2 promos on weekly TV, plus an optional <b>bonus promo</b> — run it when you have something worth saying; it counts toward the show rating like any segment; PPVs are ${cardMatches(true)} matches. The last match is your main event and counts the most.</p>
<p><b>Stamina</b> (the green-to-red STA bar on each card): a match costs about ${FAT_MT.singles} in singles, less in tag and multi-person matches, ${FAT_PPV} more on PPV and a lot more with a rough or big stipulation. Wrestlers who worked a match get only ${REC_WORK} back that week; anyone who gets the week off — or only cuts a promo — gets ${REC_REST} back. A star who wrestles every week runs down in about a month, so plan their weeks off. Promos never cost stamina, so a wrestler can cut a promo and wrestle on the same show — and a promo can <b>hype a match</b>: when wrestlers from two different sides of a match share a promo earlier that night, building it for later, the match gets a little lift (about ¼★, once per match). Below ${100-FAT_OK} stamina matches start to suffer, and below ${100-FAT_RISK} the injury risk climbs. Rotate your roster and rest your stars before PPVs. <b>Double duty:</b> a wrestler can work up to ${DD_MAX} matches on the same show — each match after their first costs ${DD_FAT}× the stamina, and they go into it carrying the first one's wear. If they get hurt in the first, the second is scrapped. AEW rotates a big roster, so a week off is fine — but stars start to mind after 2 weeks off TV and everyone else after 3 (see Morale).</p>
<p><b>Turning heel or face:</b> book a <b>Heel / Face Turn</b> promo — the turn is guaranteed when it airs. Add a second wrestler and a face can turn on them (big heat) or a heel can make the save (chemistry). Or use <b>Turn off-screen</b> on a wrestler's profile for an instant switch that costs a little popularity. You can also turn someone with a <b>run-in</b>: a face who costs another face the match or beats them down after the bell turns heel, and a heel who runs off another heel to save the day turns face — tap the turn option in the match's Run-in tab. Turning the same wrestler again within 8 weeks gives fans whiplash.</p>
<p><b>Tag teams &amp; factions:</b> make them in the Front office — teammates get a chemistry boost in tag and trios matches. Keep pairing the same wrestlers without naming them (three matches together), or have an unnamed pairing win tag or trios gold, and the game suggests making it official with a name ready to edit. They come to your office door, and it's on the Front office too; <b>Not a team</b> drops it.</p><p><b>Intergender booking</b> is fully open: anyone can wrestle anyone, form teams and cut promos together. Titles stay in their division, so intergender matches are non-title.</p>
<p><b>Calls that stick:</b> what happens in a match doesn't stay there. Risky spots and brutal moments can hurt someone: most injuries are a week or two out, some turn out to be a false alarm, and now and then it's serious (low durability makes that likelier, Iron Man less so). Get caught cheating under normal rules and it's a DQ loss; go too far and it's a fine or a suspension. A tag partner walking out ends the team, a no-contest has fans demanding the rematch next week, and a chair stashed under the ring comes back out in that wrestler's next match. In the weeks before Forbidden Door, rival stars can invade your matches — whoever they go after gets that dream match penciled onto the Forbidden Door card.</p>
<p><b>Durability</b> (on each wrestler's profile) reflects how well their real-life body holds up, based on their actual injury history. Iron-bodied workers like Darby Allin lose up to ~18% less stamina per match and get hurt far less often; fragile ones like Wardlow drain faster, get injured up to 3.5× as often and stay out longer. Sort your roster by Durability to see who can carry a heavy schedule.</p>
<p><b>Matchups:</b> a wrestler's crowd decides who they click with. Bloodhounds and Chaos fiends tear the house down together, and so do Technical and Flippy wrestlers; Technical vs Technical and Bloodhound vs Bloodhound are dream pairings too. Casuals vs Bloodhounds and Technical vs Chaos clash, and it shows in the rating. Face vs heel, past matches and traits add on top. Tap <b>How chemistry works</b> on a profile for the full chart.</p><p><b>Traits</b> (the round badges on each card): every wrestler starts with one that fits who they are. A second opens once a wrestler holds 70 popularity for ${typeof TR_HOLD!=="undefined"?TR_HOLD:4} shows and a third once they hold 85 (a dip of a few points starts the count over), and on your roster they come to your office door with three to choose from: one for their own crowd, one that reaches another crowd, and an all-rounder skill. The options are dealt fresh every game. A trait that reaches another crowd bridges a bad pairing halfway — a Casual with Ring General works better with Technical wrestlers than a plain Casual, though never as well as a real Technical. Traits also decide which stipulations suit someone (a Submission Specialist in a Submission match, a Bleeder in a deathmatch), and some do more: a Monster vs an Underdog is a big boost, a Showstopper shines in the main event, a Storyteller helps with anyone. A locked slot on a profile shows the popularity it needs and how many more shows they have to hold it; once a wrestler is close, a specialist coach can open it early. Open any wrestler to see their best opponents and tag partners on your roster with the reasons, or tap <b>Why?</b> under a match's projected rating.</p>
<p><b>Front office situations</b> pop up now and then after a show — backstage fights, viral videos, social media trouble, contract demands, travel mishaps, and the occasional viral opportunity. When two people on your roster have real backstage heat, it can boil over as a <b>😤 backstage confrontation</b>: separate them (a four-week truce you break by booking them together), let it simmer (more real heat, more storyline heat), or book them against each other that week, where the bad blood is guaranteed to come out. Pick how to handle each one; every option has tradeoffs. These are randomly generated fictional events. When you answer an opportunity with something that happens on TV (recreate the viral moment, put the hero on the show, book the celebrity segment), it becomes a promo you owe on that week's show: it goes on Needs your attention with a <b>Book it</b> button, and the outcome plays out when the promo airs — a strong promo makes it land, a weak one makes it flop. Leave it off the show and the moment passes, and whoever you promised it to is let down.</p>
<p><b>Ending feuds:</b> book a hot feud (35+ heat) against each other on a PPV with a clean finish to <b>blow it off</b> (or on TV with <b>Make it the blow-off</b>) — the feud is over, both wrestlers get a morale boost and the winner gets the last word (a no-contest leaves it unsettled). A feud that isn't working can be dropped early: tap it and choose <b>Cut your losses</b>. It ends at once, but you lose fans (fewer if it had already gone stale), both wrestlers lose a little morale and popularity, and any match you promised between them is cancelled.</p>
<p><b>Building feuds inside matches:</b> everyone on opposite sides of a match builds heat with each other, so tag and multi-person matches grow several feuds at once (each match's Details show exactly how much). Put two feuding wrestlers on the <b>same side</b> and the tension builds — lose, and one may betray the other. Book a <b>run-in</b> to involve someone who isn't in the match: cost them the match (the most heat, and the loser is protected, with no hit to popularity, morale or momentum; but it's a screwy finish in a normal-rules match unless the feud is already hot, and Technical fans hate it), attack them after the bell, or make the save. Doing the same run-in two weeks running builds half heat.</p>
<p><b>Stipulations</b> are modelled on real AEW match types — from Submission and 2 Out of 3 Falls to Lights Out, Texas Death, Anarchy in the Arena and Blood &amp; Guts. Each suits certain crowds and traits (Barbed Wire, Texas Death and Lights Out draw Bloodhounds harder than most, and Blood &amp; Guts feeds them fully with any lineup), costs money, and wears wrestlers out — the picker shows each one's rough upside (📈) next to the extra wear (🔋) and injury risk (🩹) it brings, and warns you if it'll leave someone gassed. The brutal ones pay off big when the feud is red-hot (heat 50+); without a real feud behind them they add no bonus. Some are PPV only, and the faction wars need Trios or 8-Man Tag. A stipulation's bonus counts toward each wrestler's own ring work, and singles matches lean on the weaker worker, so the match type that suits the weaker wrestler lifts the match most. 🎯 Every wrestler has a hidden specialty: one stipulation that doesn't fit their style but that they shine in. You find it the first time they work it, and it shows on their profile from then on. A found specialty also opens a second crowd: in that match they reach the crowd the stipulation speaks to (a flyer who's a natural in a cage brings in the Bloodhounds), and count as one of theirs for a pure match.</p>
<p><b>Fan groups</b> — the symbol on every wrestler's card shows which crowd loves them: a crowd for <b>Casuals</b> (big stars), a gear for <b>Technical</b> (pure wrestling), a drop of blood for <b>Bloodhounds</b> (blood and brawls), a feather for <b>Flippy</b> (high-flyers) or a bomb for <b>Chaos fiends</b> (run-ins and mayhem). A few versatile stars have two symbols. The bottom of the roster is <b>Undiscovered</b>, shown as a ?: they haven't found their crowd yet. The same symbols mark the crowds in the booking sheet's tags, the crowd reveal and X Redditino's posts. Tap a symbol chip on the draft board, roster, free agents or in the booking sheet to see only that crowd's wrestlers. Groups are set from each wrestler's real-life style. Undiscovered wrestlers find their crowd through who they work with: every match leans them toward their opponents' and partners' crowds and the stipulation's, their profile shows the lean, and after a few matches with a clear lean they lock in. A breakout (popularity past 50) locks their current lean, and you get a warning first. A wrestler who has been off TV for weeks or is miserable may come to your office asking whether changing themselves fundamentally would get them booked. Pick a new crowd and they're away for 4 weeks relearning how to work, then return in it. They won't ask mid-arc, mid-feud, as champion or near the end of a contract.</p>
<p><b>🎆 Production:</b> right above <b>Go live</b> on the Book screen, pick Standard, Pyro &amp; video or Full spectacle — it lifts the whole show's rating, and costs more at PPVs and as your company grows. <b>📌 Use for every TV show</b> (or every PPV) books it automatically each week when the bank can cover it.</p><p><b>Money:</b> the draft has a <b>salary cap</b>: stars cost far more than the midcard, so you can't draft an all-star roster (anything left under the cap goes into your bank, ×4). On the draft board, a price marked <span class="gold">▲</span> is above your average left per pick (taking them makes your later picks cheaper), and <span class="bad">🚫</span> doesn't fit under your cap at all. You start with ${typeof money==='function'&&typeof START_BANK!=='undefined'?money(START_BANK):'$350K'}: draft to the cap for a stronger roster now, or leave room and bank money for free agents, a bigger building and production later. Drafted contracts run 16–52 weeks, so about two-thirds of your roster comes up for renewal in season 1. Every wrestler's salary is locked in on their contract until they re-sign — and a wrestler who got more popular asks for a raise. Money comes from four places: a <b>TV deal</b> signed for a season at a time (your TV audience at the start of the season sets it — mostly your casuals, with hardcore fans counting less — renegotiated each new season: a new company's first deal is small (season 1 adds a weekly new-company bonus on top) and a bigger audience earns a better one, about +40% at 1M fans; as your audience grows during the season, the network adds a <b>viewership bonus</b>: it builds up every week, and the network's executive brings you the check at your office the week after each PPV), <b>tickets</b> that follow your live audience (hardcore fans count double) and your buzz — how well you've been serving your crowds lately — <b>merch</b> that follows your stars, the show and how hardcore your audience is, and <b>ads</b> that follow the rating and your TV audience. PPVs add buys (hardcore fans buy more) and a bigger gate. So a casual-heavy company earns more from TV, and a hardcore-heavy one more at the box office. A bigger company also costs more to run: arena &amp; crew costs and PPV venue bills grow with your fanbase, <b>wages rise</b> (wrestlers ask for more when they sign or re-sign with a bigger promotion — about 25% more at 1M fans, 45% at 2M), <b>production and stipulations</b> cost more as your company grows, and one show can only take in so much: past a big night's box office, the extra comes in at half. <b>Great shows pay</b>: a 3½★ week roughly covers a full payroll, 4★+ weeks make real money and bad shows lose it. Need cash fast? <b>Sell out</b> — sponsored segments, pricier tickets, merch blitzes, extra ad breaks or a sportsbook sponsor — but each one costs fans, and doing it often makes fans angrier. Sponsor money and the fan cost both grow with your company. You can spend on <b>production</b> (a small bump to the show rating) and <b>stipulations</b>, and every PPV has a venue bill. <b>Your budget:</b> stipulations, production, your building and office choices that cost money come out of what's in the bank, after setting aside what this week's payroll needs beyond the TV deal and your usual takings. Anything you can't afford is greyed out, so save up for the big nights. <b>Commitments</b> always go ahead: Blood & Guts on its night, Money in the Bank and the stipulation a running arc needs. If the bank can't cover one, the network fronts the rest and takes it back out of your TV deal (up to 35% of it a week, never into the red); what you owe shows in your finances. The rival books by the same budget. Injured wrestlers run up <b>rehab bills</b> on top of their salary (shown in your finances). Miss payroll and you're in the red: morale drops, and after 3 weeks wrestlers start walking out.</p>
<p><b>Developing talent:</b> the draft is real wrestlers only. During the season, open <b>Roster → Free agents</b> and scroll to <b>Scouting</b>: the Indies board has rookies to hand-pick — Prospect, Blue-Chip or Generational (the tier sets how polished they start, not how far they can go) — on a cheap 52-week developmental deal. The board refreshes every few weeks, and the rival scouts too (more often, and better, on Hard). You can also design your own prospect or star; they wait in free agency until you sign them.</p>
<p><b>Free agency</b> rotates: after the draft only about 8 unsigned wrestlers are on the market at once, each for a few weeks, with new names arriving every week (and anyone released or out of contract going straight onto it). The rival signs from the same market.</p>
<p><b>Created wrestlers</b> go into the free-agent pool and are always available to you. Draft them or sign them any week from Free Agents; the rival never signs them. Rookies carry a one-time development fee when signed (free if drafted).</p>
<p><b>The story so far:</b> tap ⋯ on any feud to see how it was built — every match, promo, run-in and wild moment that added heat, the head-to-head record, and the biggest moment. Finished feuds (blown off, dropped or faded) live on under <b>📚 Past feuds</b>.</p>
<p><b>Stories carry matches.</b> Two people with no history put on a lesser match than the same two in a rivalry, and face vs heel only counts in full once they have some history. Heat is worth the most once a rivalry gets going (10 to 40), and a blood feud keeps climbing from there. <b>Feuds</b> start and grow from matches and promos: great matches, face vs heel, title matches and messy finishes build the most heat, and the results call it out when a rivalry is brewing (20), becomes a full-blown feud (45) or a blood feud (75). <b>🔁 One repetition rule:</b> doing the same thing with the same two people two weeks in a row — the same match pairing, the same promo segment or the same run-in — builds half heat. If either week's meeting was a tag or multi-person match, it's a lighter repeat (75% heat). It never costs stars, and PPVs are exempt. <b>💥 Boiling over:</b> when two wrestlers have only been talking, the first time they get physical (a match, run-in or sneak attack) gets a bigger reaction and +50% heat. A feud that goes 8 weeks without a PPV chapter goes stale and cools off fast (it still rates the same — the crowd just loses interest quicker). A PPV match that doesn't end the feud starts a new chapter and resets the clock, so big stories can run across several PPVs. A big TV moment resets it too: a gimmick match between them (cage, street fight, ladder…), or taking the feud to a new level (🔥45 or 🔥75) for the first time. Feuds also cool off when ignored. PPVs weigh heat much more heavily, so build rivalries on TV and pay them off on PPV. A hot feud (35+) settled on PPV is over; a cooler one continues into a new chapter. <b>💥 TV blow-offs:</b> a feud at 35+ — or any stale feud, however cool — can also end on weekly TV — in the match's <b>Finish</b> tab, tap <b>Make it the blow-off</b>. A clean win (or an upset) ends it; a gimmick stipulation (cage, street fight, ladder…) makes it a fitting end with a bigger morale and popularity boost. A dirty finish or no contest leaves it unsettled. It's always a smaller payoff than a PPV, so save your biggest feuds for the big shows. Rivals thrown together in a Royal Rumble, Money in the Bank or the Casino Gauntlet only build heat there — none of those settles a feud, even on a PPV, so it still needs its own match.</p>
<p><b>🎟️ The title picture:</b> the top of the Titles screen lists every title shot you owe — Rumble, tournament and Casino Gauntlet winners, title-shot pitches you agree to (a "win two and you're next" pitch makes them the #1 contender), and contract clauses — with when it's due and how hot the feud with the champion is. Earning a shot starts the rivalry: the contender and champion get 🔥15 heat the first time they're paired. Build it to 🔥35 (the gold line) before the night. Once a shot is 4 weeks out, the Book screen checklist reminds you to put them together and <b>🎤 Build it</b> books a face-to-face promo. If the belt changes hands first, the shot follows it to the new champion. Money in the Bank winners are listed too, but they need no build — they can cash in any time.</p>
<p><b>Promos</b> play out live as a face-off: the camera cuts to whoever is talking (their card photo on the stage), each line appears in the dialogue box, and you tap to keep it moving. Actions show in (parentheses), the crowd and the room in gold, and big moments get a shout across the stage — TAKE THAT!, HOLD IT!, LISTEN UP!, MIC DROP!. Every call is stamped It lands or Not quite. Each choice tests mic skill, in-ring ability, popularity or luck. What gets said sounds like the person saying it: a great talker (mic 80+) lands specific, cutting lines; an average talker gets the job done; a weak talker (under 60) keeps it short and can tangle their words when a call misses. In a two-person Callout, Champion's Address, Contract Signing or Sit-Down Interview, the promo becomes a <b>back-and-forth exchange</b>. The other wrestler answers your opening — what they say depends on what you just did and whether it landed, whether they're a face or a heel, how good they are on the mic (a weak talker stumbles), titles, feud heat and a PPV coming up — and then you <b>direct</b> your wrestler like a producer in their ear: 🗡️ go personal, 😤 get in their face, 📣 play to (or turn on) the crowd, 😏 stay cool, 🎯 make it about the match or 🤝 show respect. Your wrestler finds the words, written for what was just said and in their own voice. It's one exchange call, then the closer, so a promo is three decisions; a hot feud between two great talkers gets a second exchange call (or you can skip straight to the closer). Now and then a good talker winds up a big line instead of answering — ✋ cut them off or 🤫 let them finish and hope it flops. How the exchange went decides the <b>closer</b>: land your calls (long shots count most) and you're way ahead — 🎤 drop the mic or twist the knife; dead even — let it boil over, stare them down or make it official; behind — they get the last word and you choose how to answer it. Every so often something else happens instead of the closer (a run-in, the mic cutting out, a chant). If someone walks off — your wrestler storms out, or the other one leaves and you don't stop them — or a call leaves them flat on the mat, the exchange ends right there: nobody answers a wrestler who isn't there. Longer exchanges swing more, but don't rate higher on average. Rarely, in a live promo, the crowd <b>hijacks</b> it, chanting for someone on your roster who's more over than anyone in the ring — fight it, bring them out (a rub, a rivalry or a brand-new star) or cut to commercial. When a promo ends you see the crowd's reaction (🥶 flat to 🔥🔥🔥 unglued); its exact stars come out with the rest of the show after it airs. Promos between two wrestlers build feud heat. Every kind of promo has its own job: a <b>Callout</b> can get a match made, a <b>Sneak Attack</b> builds the most heat and counts as physical contact, a <b>Sit-Down Interview</b> lifts morale the most and sharpens mic skills fastest, a <b>Faction Rally</b> lets the bigger star (put them first) rub off on a less popular partner — or lifts the whole group's spirits if they rally alone, a <b>Backstage Vignette</b> is low risk (missed choices barely hurt) and grows lesser-known wrestlers (popularity 60 or below) faster, and a <b>Champion's Address</b> that lands raises the title's prestige. The promo picker outlines a kind in gold, with the reason, when it suits who you've chosen. A <b>Contract Signing</b> books that match on your next PPV card (with a stipulation if you add one); a callout where you <b>lay down a challenge</b> promises the match for next week or the next PPV — your pick. While a match is promised, booking either wrestler against the other's stablemates or tag partners (🔗 proxy war) and trading promos where they take turns leading (↔️ back-and-forth) builds the feud with bonus heat. Running the promised singles match early gives it away and halves the payoff. Deliver and it pays off; skip it and you lose fans and morale. Trading promos week after week on the road to a PPV is how feuds are built: a steady weekly build earns up to +30% heat, and alternating who leads adds +15%. The only thing fans tire of is the exact same segment two weeks running (half heat). A pair can only share one promo per show. Match events work the same way — faces fly and rally the crowd, heels rake eyes and put their feet on the ropes, and some events only happen in face vs heel, face vs face or heel vs heel matches. A surprise run-in or interruption starts in <b>🎧 gorilla</b>: the wrestler brings you the idea first. Send them out and the scene plays out (and may start a new rivalry), or say not tonight and the segment goes on as booked — it barely moves their morale either way. Each promo deals fresh options: faces get crowd-pleasing moves and heels get dirty tricks (😇/😈 — playing to character gives slightly better odds), and the scene changes depending on whether it's face vs heel, heel vs heel or face vs face.</p>
<p><b>Wrestler profiles:</b> tap any wrestler for their profile: Ring, Mic and Pop up top, then <b>Needs you</b> (anything owed, and a new-deal button in a contract's last weeks), <b>Right now</b> (stamina, morale and what will cost morale next, friends, durability, training), <b>their crowd</b> and what it wants, <b>feuds</b> by tier, <b>best matchups</b>, traits, contract and career.</p>
<p><b>Development:</b> everyone grows on the same curve by working matches (faster against better opponents and in better matches) and through arcs: raw talent improves fast, gains slow past 80 and crawl past 90, so anyone can be built into a megastar with enough time. Mic grows the same way, a little more slowly at the top. In-ring of ${SKILL_AT}+ is hard to hold: it slips a little in any week without a strong enough match or an In-ring arc running: ${skillNeed(90)}★ through the low 90s, rising to about ${skillNeed(95)}★ at 95 and ${skillNeed(99)}★ at 99. Everyone also has a hidden learning speed, different every new game: some pick it up fast, some slowly. Work with someone for a while and their profile tells you if they're a 📈 Quick study or a 🐢 Slow learner. A wrestler's profile says where they are on the curve. Overworked talent gets hurt.</p><p><b>Scouting &amp; ROH:</b> Roster → Free agents → Scouting has three boards that refresh every few weeks: the <b>Indies</b> (raw prospects and gimmick acts — cheapest, longest build), <b>ROH</b> (polished regulars and the real ROH roster — Jay Lethal, Matt Sydal, Top Flight and more, who aren't in the AEW draft — ready sooner; real teams reunite when you call both partners up) and <b>Overseas</b> (skilled imports from Japan, Mexico and the UK who are still learning promos). The Indies and Overseas boards also carry one or two known names from outside AEW and WWE — PWI 500-ranked men and top independent and joshi women — who cost more but arrive closer to ready. Sign them straight to AEW, or to your <b>🏟️ ROH</b> roster (Roster → ROH, up to 8): they don't take an AEW roster spot and earn half salary. <b>ROH books itself every week</b>: everyone on your ROH roster works a match (against ROH regulars or other GMs' prospects), builds an ROH record and grows, and ROH's four titles (World, Women's World, TV and Pure) are defended every other week by the best records. Wins, good matches and ROH gold build <b>call-up buzz</b> (🧊 cold → 🔥 hot), which fades if they cool off; when someone turns <b>hot</b> (9+ buzz — in practice an ROH title run, or winning nearly every week for a couple of months) they come to your office door asking for the call-up (call them up, or not yet — they'll ask again in 4 weeks if they're still hot), and the hotter they are the bigger their AEW debut. You can call anyone up from the ROH screen at any time. <b>Rebrands:</b> calling someone up, or signing a prospect to ROH, opens a quick fresh-start sheet first — keep them as they are, or give them a new ring name (type one or tap an idea) and start them as a face or a heel. <b>Tapes &amp; emails:</b> prospects send you their tape or an email, and it lands outside your office — pass, <b>keep following</b> them (your scout's updates show in This week as they improve; sign them, keep following or stop from the ROH screen's watchlist — they get a little pricier and may sign elsewhere), or sign them straight to ROH. <b>Feature</b> one to grow faster and build popularity, send one on a 10-week <b>excursion</b> to NJPW, CMLL or RevPro to come back better, and <b>call up</b> anyone whenever you need them. Rookies and anyone at 45 popularity or lower can be <b>sent down</b> to develop.</p>
<p><b>League weeks:</b> everyone books the same week at the same time, on their own phone, whenever suits them. Make your calls, lock in, and the week airs the moment the last GM locks in — cards stay secret until then. With 3 or 4 GMs, every show competes every week and the night is ranked 1st to last; 1st takes the ratings win. While anyone is still booking, even smaller free agents take sealed offers instead of going to whoever taps first: if two GMs want the same wrestler, they usually pick the hotter show.</p><p><b>League drafts:</b> everyone creates wrestlers at the same time, and the draft starts once the last GM is ready. Picks still go in order — but you can line up to 10 picks in <b>Your queue</b> (open a wrestler and tap <b>Add to my queue</b>). When you're on the clock, the first one still available and under your cap is picked for you, even with the app closed.</p>
<p><b>Draft board:</b> during the draft, tap <b>Draft board</b> to see every GM's roster as it fills up — round by round, newest pick on top, with payroll, cap room and how many of each crowd they've drafted.</p><p><b>Your roster strip:</b> under the round counter, a row of tiles counts your men (M), women (W) and wrestlers for each crowd (a two-crowd wrestler counts for both). A tile lit red is a crowd you're behind on for this point in the draft (or women, if they're under about a third of your roster). Casuals tune in for their own big Casual stars — up to three in matches a show — so plan on about six of them across your roster, and about four for each other crowd. <b>Auto-pick</b>, <b>Sim rest</b> and <b>Auto-draft me</b> draft for the crowds you're short on and for wrestlers who click with your roster, alongside talent and price.</p>
<p><b>Party night:</b> any online league can play in the same room. Tap <b>Start party night</b> on Home (or in the ⚙️ Game menu) and everyone books at once, locks in their card, then GMs go live one at a time: any live call shows on the TV while you make it on your phone, and the reveal shows how the card went. The week airs when the last GM wraps up. To put it on a TV, open the game there, tap <b>Show a league on this screen</b> and enter the league code — the TV shows who's still booking and plays the results as a tug of war (a Battle Royale with 3 or 4 GMs). End party night any time and the league carries on as a normal league with the same save. The TV goes full screen (press <b>F</b> or tap ⛶ to switch) and shows the draft as a live board of every GM's picks. While everyone books, the TV's <b>locker-room feed</b> plays each office visit as it's answered — the ring bell, the wrestler's line, then the answer — and only teases the strategic ones (tampering, the trainer, trades, tapes). On party night the TV plays the sounds and the phones stay quiet.</p>
<p><b>🔊 Sound effects:</b> the ring bell, the crowd, near falls counted out loud, stars landing and your calls hitting. Switch them off or set the volume in the ⚙️ Game menu.</p>
<p>Top AEW and WWE wrestlers have their own wording for challenges, replies and solo callouts. In the ring, signature moves can appear on pinfall, submission and tag-team calls. An awkward escape on a near fall still leads to the finish you call.</p>
<p><b>🌙 After Dark</b> in the ⚙️ Game menu adds up to two optional beats to eligible live face-offs and singles matches with any wrestler. Choose <b>Grudge</b> for sharper threats and rougher action, <b>Tension</b> for mutual flirtation, or <b>Auto</b> to use Grudge for heated rivalries and Tension for other pairings. The extra lines have no effect on ratings.</p>
<p><b>Cloud save &amp; backups:</b> tap <b>Sign in with Google</b> in ⚙️ Game menu → Saves &amp; backups and every solo game you play backs up automatically and syncs both ways with your other devices — sign in on another device (or enter your sync code there) and all your games show up in ⇄ Your games there, kept in step whichever one you play. Everything saves on the device first, so offline play just works and syncs later. If the same game was played on two devices before they synced, you're asked which save to keep and the other is kept as a backup. Deleting a game removes it from your other devices too, but its cloud copy stays under Backups → Deleted games. The game also keeps automatic backups of your last few weeks (⚙️ Game menu → Saves &amp; backups).</p>
<p><b>Your crowds:</b> in the booking sheet, stipulations, run-ins and finishes are tagged with the crowd they speak to — <i>Bloodhounds thirst for this</i> on a cage, <i>Flippy fans live for this</i> on a ladder, <i>Technical fans savor this</i> on a submission match, <i>Chaos fiends eat this up</i> on No DQ or a run-in (Technical fans hate one that costs someone the match, along with screwy finishes in their kind of match). The reveal ends with each crowd's verdict on your show beside both shows' fan changes. <b>Loved it</b> means a full serving that delivered, <b>Wanted more</b> means they liked it but needed more or better, <b>Let down</b> means it missed, and <b>Ignored</b> means nothing was for them (Casuals are <b>Hooked</b>, <b>Watching</b> or <b>Tuned out</b>). Your three biggest fan moves come with the reason, and <b>Next time</b> gives a tip for the crowd that cost you the most. Every show needs something for the women's division if you have one.</p>
<p><b>Debuts:</b> anyone you sign during the season arrives with debut buzz. Their first appearance on your show — match or promo — pops the crowd: the bigger the star, the bigger the bump in stars and fans (a PPV debut is bigger still). Wait more than a few weeks and the buzz wears off.</p>

<p><b>Fans:</b> your audience is five fan groups, and each one reacts to the segments aimed at it. <b>Technical</b>, <b>Bloodhounds</b>, <b>Flippy</b> and <b>Chaos fiends</b> each need about one real match of their own every show — their wrestlers, a stipulation they love, or (for the Chaos fiends) a run-in or a Chaos wrestler on the mic. <b>Stipulations always draw their crowd, but they take a toll</b>: a rough or big gimmick match costs more stamina and carries more injury risk, every stipulation costs money, and the same stipulation two shows running only pulls half — they've just seen one. Use them where they count. A match where everyone draws the same crowd lands hardest, a second or third match for the same crowd counts for less, and a crowd fed the same thing too many weeks running gets bored. A crowd that gets nothing drifts away, faster if it keeps happening. Each crowd's expectations rise toward what you've been giving it, so the same card stops working; a match that beats them grows the group, and a 4★+ match that beats them turns some casuals into hardcore fans. Technical fans hate screwy finishes and run-ins that cost someone a match. <b>Casuals</b> are the biggest group and tune out a little every week unless big stars, titles, spectacle, a good show and <b>a story</b> hook them — the card's hottest feuds keep them tuning in to see how it ends, most of all on a PPV. Gains come out of a big shared pool of potential fans, so even a small group can grow fast; losses come out of your own. <b>Fans switch shows</b>: after each night, every group drifts toward the show that served it better. Casuals switch on any clear gap; hardcore fans only walk out on a show that let them down that night, and only toward one that fed them (Technical fans are the stickiest) — a Bloodhound stays a Bloodhound, they just watch the other show. Winning the night and the main event war go in the history book; the fans come from the crowds. Kept promises grow (and broken ones cost) the crowds of the wrestlers in them. The rival books for its own crowds too: most weeks it swaps a match's stipulation for one its hungriest crowd loves — once a show on Easy, up to three times on Normal and four on Hard. Your crowds and the rival's start with the same expectations. Suggest the rest books from stats only, so feeding your crowds is up to you. Debuts, chants and 5★ classics also bring fans, and they reach casuals. PPVs swing far more, and WrestleMania and All In count double. After every show, <b>The fans</b> shows each group before and after with its verdict and the reason, then <b>X Redditino</b>, your Head of PR, reads you the replies. <b>Each season is won by the bigger total audience</b> at the end of the season Your audience carries over, so a lead does too — but a big audience is work to hold: casuals tune out and underserved crowds switch shows in proportion to what you have.</p>
<p><b>Finishes:</b> pick how every match ends, not just who wins. ✅ <b>Clean</b> is the only way to truly settle a feud on PPV (a clean blow-off rates higher). 😈 <b>Heel shenanigans</b> (heel winners only) builds 35% more heat and protects the loser, but a cold feud's crowd doesn't buy it, and a dirty finish on a PPV blow-off leaves the feud unsettled. ⚡ <b>Upset roll-up</b> (the winner must be the clear underdog) gives the winner a big boost. 🟥 <b>DQ</b> and 🚪 <b>count-out</b> build the most heat but feel cheap unless the feud is hot, and titles never change hands on them — a classic way for a champion to escape. Any finish that isn't clean protects the loser's momentum.</p>
<p><b>Who wins matters:</b> beating someone more popular than you gives you <b>the rub</b> (an upset even more so) — beating someone far below you does little. Winning streaks build momentum, and a hot streak gets the crowd invested in a wrestler's matches. Lose four in a row clean and fans stop believing in a star (enhancement talent under 45 popularity is fine). Trading clean wins back and forth within a month is 50/50 booking and cools the feud off.</p>
<p><b>Divisions:</b> in a head-to-head game each show has six titles: a world title, a midcard title and a tag title for the men and for the women. Which belts land on which show is dealt fresh each new game. Every belt belongs to the men's or women's division, and only wrestlers from that division can compete for it. Intergender matches are welcome, just non-title.</p><p><b>Title reigns:</b> every successful defense adds to a champion's credibility and the title's prestige, and the wrestler who ends a long reign gets a bigger boost. Swap a belt again within 3 weeks and it's a hot potato: the title loses 8 prestige and the new champ gets little out of it.</p>
<p><b>Card position:</b> main-eventing boosts morale (and popularity after a great match). Stars who want the spotlight pitch you for it — a main event slot or a shot at a belt — and the unhappier they are, the more often they knock on your door. Leave a star (80+) out of the spotlight for 2 weeks and their morale starts slipping too (see 🌟 Star egos).</p>
<p><b>The calendar:</b> each season is a ${SEASON}-week year with a PPV every 4 weeks, alternating the biggest AEW and WWE shows — ${Object.entries(PPVS).map(([w,n])=>+w===ALLIN_WEEK?`<b>${n}</b> (AEW's supershow, week ${ALLIN_WEEK})`:+w===WM_WEEK?`<b>${n}</b> (WWE's supershow, week ${WM_WEEK})`:n).join(', ')}, which closes the year. Both brands run every PPV head to head. Then the awards and offseason, and the calendar rolls on into a new year. Plus 📺 <b>TV specials</b> (${Object.values(SPECIALS).join(', ')}) with hotter crowds, 50% bigger fan swings and better gates. <b>${PPVS[FD_WEEK]}</b> is the crossover PPV: alongside your card you can sign up to two dream matches between one of your stars and one of the rival's, and in the TV weeks before it rival stars may invade your shows. Neither GM controls both sides of a dream match, so the winner is decided in the ring, and the winner's brand earns extra fans (4K; a 4★+ dream match pays the losing brand 2K too).</p>
<p><b>WWE:</b> WWE's Raw and SmackDown stars are in the same talent pool as AEW's — draft them, sign them in free agency, put them in a ring with anyone. WWE's world titles can be dealt to either show alongside AEW's. Photos for WWE wrestlers search wwe.com.</p>
<p><b>🏟️ Royal Rumble</b> (week ${RR_WEEK}): a men's Rumble (${SPK.rr.size} entrants) and a women's Rumble (${SPK.rrw.size}) lock onto your card. You pick the entrants (or clear the field and pick your own), the winner and who's eliminated last — the runner-up gets a small popularity bump and everyone else stays protected. The winner earns a world title shot at <b>${PPVS[WM_WEEK]}</b> against your best world champion in their division — belts never leave their show, so if your world titles are vacant the winner is first in line when one is crowned.</p>
<p><b>💼 Money in the Bank</b> (week ${MITB_WEEK}): a men's (${SPK.mitb.size}) and a women's (${SPK.mitbw.size}) ladder match lock onto your card. The winner holds the briefcase for a year and can cash in on a world champion of their division on your brand at any time: book them against the champion and make it the cash-in, or — the classic — open any match the champion is in and have the holder cash in right after it, on a worn-out champion. Set it up in that match's <b>Finish</b> tab, where you also decide whether the cash-in works. It lifts that match (+½★ when it succeeds), and a briefcase that's never used expires at the next Money in the Bank. The rival cashes in too.</p>
<p><b>Tournaments</b> lock onto your card — you decide who advances. Tournament rules are about winning, not good vs evil: face vs face and heel vs heel pairings rate and build heat like face vs heel, and the repetition rule, trading-wins cooling, feud-check warnings and promised-match giveaways don't apply to bracket matches. From three weeks out until the first matches air, tap <b>Pick your field</b> on the Home screen to choose your four entrants (and the seeding for the Owen Hart Cups); if you don't, your four best are entered automatically. ♾️ The <b>Continental Classic</b> (weeks ${TOURS.c2.rr[0]}–${TOURS.c2.rr[2]}) is a round robin for your four best men (3 points a win, no run-ins), and the top two meet at ${PPVS[TOURS.c2.final]} for the Continental title if your brand holds it or it's vacant. 🏆 The <b>Owen Hart Cups</b> (men's semi-finals week ${TOURS.ohc.semi}, women's week ${TOURS.ohcw.semi}, both finals at ${PPVS[TOURS.ohc.final]}) send the winners to All In with a world title shot against your own show's champion. Injured entrants forfeit.</p>
<p><b>Who takes the pin:</b> in a triple threat, 4-way, gauntlet or any tag match, only one wrestler on the losing end takes the fall — everyone else stays protected. Tap <b>Pin</b> under who takes it on the card (the default is the lowest-billed). Pinning a bigger name gives the winner a bigger rub, and a wrestler with creative control only fights the finish if they're the one taking the pin.</p><p><b>Titles:</b> a new game splits the titles evenly between the two shows, eight each (see Divisions). Your titles start vacant. Every belt stays on its show, and a champion who leaves your show (traded, poached, released) vacates the title.</p><p><b>Casino Gauntlet:</b> six wrestlers enter one at a time and the first to be pinned or submitted loses, so only that one takes the loss. It rates like any other multi-person match (flyers and showmen love the chaos), but it can't take a stipulation, needs a clean finish and builds heat slowly. The winner gets the rub from whoever they pinned and earns a title shot at the next PPV against your top champion in their division.</p>
<p><b>Arcs:</b> the <b>Arcs</b> tab has two views: <b>Active</b> (the arcs you're running, each with the wrestler's card and whoever they're working with) and <b>Potential</b>. Potential opens with <b>This week's pitches</b>: three wrestlers who could use a story right now, each paired with an arc and tagged with why (a contract ending, ready to break out, off TV lately, morale slipping, room to grow), set each Monday. Below them, every arc on offer is a short row (its name, a few-word hook for each storyline, the price, a few faces of who can run it); filter by Mic, In-ring, Trait, Story or what you can afford, tap a row to open its stories and wrestlers, then tap one to cast it. To start from the wrestler instead, sort the Roster by <b>📖 Arcs</b>: each card shows how many arcs they have ready, and a tap opens them. Each storyline lays its own road: its stops and payoff tell that story. Each wrestler is assigned up to three arcs that fit who they are, and every arc comes with a <b>storyline</b> that fits them and the partner or rival you cast. One Mic arc (a heel or face turn, a betrayal, finding their voice), one In-ring arc (a mentor, a gauntlet to a title shot, an undefeated streak) and one that changes who they are (a new trait, a second crowd, a tag team or faction, a rebrand). Their crowd tilts which arcs they get (Bloodhounds see hardcore stories more, Technical wrestlers technical ones), faces and heels get different turns, and superstars (85+ popularity) get story arcs: a bigger payoff, popularity and heat, never In-ring or Mic. The calendar sets the size: small stories early in the season and right after the big shows, big ones on the road to WrestleMania and All In. Arcs reshuffle after each PPV, after one of their arcs ends, or when they turn. The story doesn't have to exist first: starting a Stakes Match picks a rival and the build is the feud, a Faction War forms the factions, a Comeback opens with an injury angle. When an arc has a partner or rival, <b>you pick them</b> (the best fit is picked to start). <b>Each arc runs once a season</b> across your roster, whether it pays off or not, except Pride of the Town: any wrestler who qualifies can claim a hometown, once a season each. A few need a bigger stage: Hometown Hero and Dream Match the Good Building, Farewell Run and Last Chase the Actual Arena, and Force a Retirement waits for season 2. Milestones (your first great payoff, a blood feud, a new champion, a new team, a turn paying off) each earn a <b>🔀 reshuffle</b> once a season, to reshuffle any wrestler's arcs. Assign one, pay up front, book the build steps (each needs 2½★ or better, a backstage vignette 2★, unless it says more), then book the payoff before the deadline. A payoff that needs a PPV has its deadline on a PPV. The payoff segment gets a story bonus on the night, bigger after a strong build and on a PPV, brings in fans (a weak build brings in far fewer), and the wrestler comes out of it better: In-ring or Mic, a trait, a crowd, a team, popularity. A build that averages about 4★ or better is a great payoff and pays more. <b>Arcs build people up.</b> The price follows whoever the story builds (the successor in Passing the Torch and Passing the Title): half price at 45 popularity or under, full price at 75, more for a superstar. The lower on the card, the bigger the lift: the payoff gives someone on the way up extra popularity and more fans, a little less for each payoff they've already had this season. A superstar in the payoff segment rubs off on whoever's below them, and an upper-midcarder (70+) whose great payoff lands in the main event or on a PPV has a breakthrough night. The crowd gets more invested with every step, so segments with the people in a running arc rate a little higher. The big story arcs come in different versions each game (a Heel Turn might end in a costly run-in one game and a promo betrayal the next), the storyline leads each arc, and everyone is secretly <b>made for one arc</b>: run it with them and the payoff and rewards are half again as big, and their profile shows it with a ✨ from then on. Some arcs play differently: a <b>Groundswell</b> builds by keeping them off TV (or squashing them) while the crowd's anger costs you a few fans each week, until the big win pays it all back, and <b>The Corporate Offer</b> stops the show right before its payoff so you decide whether they sign or refuse (a few storylines do the same: a legend's Last Chase lets you decide whether they retire as champion, an Invasion whether they stick the knife in or find common ground, a Wedding whether the three break up or become a throuple, a Crisis of Faith whether the faction converts or kicks them out, Too Good to Be True whether the kindness was real or a ruse, and Flags of War whether the two sides call a ceasefire or go to total war). Two arcs run at once. Miss the deadline or drop one and the wrestler is let down. <b>Holding a story:</b> when someone an arc needs is unavailable (injured, suspended, retraining or away; time off written into the arc itself doesn't count), they bring it to your office, and the arc's own screen offers the same choice. <b>Hold the story</b> keeps your finished stops and build ratings, frees the slot and stops the story's feud from cooling. Once everyone's back it gets the next open slot before a new arc can start, with the weeks it had left when the absence began (at least one for each remaining stop and the payoff, and longer if a PPV payoff needs it). With a slot open you have 4 weeks to resume it. A held arc carries into the next season. <b>Drop it</b> while someone's out, or while it's on hold, and the unfinished share of the price comes back (each stop and the payoff count the same) with nobody let down. That share also comes back if someone in an arc leaves your roster or retires, if the title a held story is about is no longer theirs, or if a held arc waits too long. A champion who'd lose the title the story is about can't be held. You can also keep it running on its original deadline. An arc has to be held or dropped before its deadline passes. Tap an arc to see its road: every stop, the payoff and the reward. A running arc shows as a track of stops ending in the payoff ★, on the Arcs tab and their profile, and each stop shows on the Book screen's checklist with <b>Book it</b>. Your running arcs also sit on Home and the Book screen under <b>📖 Your arcs</b>: each one's stops, its next step and the week it's due. When a show hits a stop, the star reveal plays it out in that segment's box, so everyone can read what happened.</p>
<p><b>Network mandates:</b> after each PPV the TV network asks for something specific by the next one: a 4★ main event, two women's matches on one show, a new champion, an arc paid off, a turn, a feud taken to 45 heat, and so on. Story mandates come up most and pay the most. Deliver for a big cash and fan bonus; miss it and you lose ${fmtFans(MAND_MISS)} fans. Check the Home or Book screen for your current one.</p>
<p><b>🎯 Weekly goals &amp; 📣 crowd chants:</b> each week the Book screen gives you one small goal (hit it for a little cash and 3K fans — no penalty for missing it; a live ✅/🤞/⏳ line tells you if the card you've booked is on track), and the crowd starts chanting for someone on your roster — a banner on Home and the Book screen shows the chant, with a button to book them. Book them in a match or promo that week and their segment gets +½★, they gain 2 popularity and you get 5K fans.</p>
<p><b>Head to head:</b> in solo play the rival's card stays a surprise until the show airs. On TV, whoever's main event rates higher wins the main event war. Big free agents take sealed offers, so the rival can outbid you (see Offers &amp; contracts).</p>
