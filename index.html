/* ---- automatic local backups (last 5 weeks + a snapshot before anything replaces your save) ---- */
function localBackups(){try{return JSON.parse(LS.get('tksim_bk')||'[]')}catch(e){return []}}
function localBackup(why,st){st=st||soloState();if(!st||!st.w)return;const l=localBackups();const tag=`${st.season}-${st.week}`;
 const rest=l.filter(b=>!(b.tag===tag&&!b.why&&!why));rest.unshift({tag,why:why||'',at:Date.now(),label:saveLabel(st),data:JSON.stringify(st)});
 const keep=[];let auto=0,manual=0;for(const b of rest){if(b.why?manual++<3:auto++<CLOUD_BK)keep.push(b)}
 for(let n=keep.length;n>0;n--){try{LS.set('tksim_bk',JSON.stringify(keep.slice(0,n)));return}catch(e){}}}

/* ---- cloud sync ---- */
let CL_T=null,CL_BUSY=false,CL_STATUS='';
function cloudSoon(){if(!cloudOn())return;if(cloudMode()==='other'){clearTimeout(CG_T);CG_T=setTimeout(cgActive,4000);return}clearTimeout(CL_T);CL_T=setTimeout(cloudPush,2500)}
/* ---- a cloud copy of every solo game ----
 Cloud save follows one game live. Every other solo game on the device gets its own cloud copy too: when it goes
 into ⇄ Your games, and as you play it when cloud save is following a different game. Those copies can be added
 to any device from Backups. Uploads queue while offline; anything that didn't make it is retried on the next sync. */
let CG_T=null,CG_SWEEP=false;
function cgUp(sid,data,st,at){if(!cloudOn()||!TKO.cloudGamePut)return Promise.resolve(false);const c=cloudCfg();
 return TKO.cloudGamePut(c.id,sid,{state:data,label:saveLabel(st),t:soloTitle(st),sub:stageTxt(st),at,dev:devId(),game:sid===c.sid&&c.game||''}).then(()=>true,e=>{console.warn('cloud copy failed',e);return false})}
function cgMark(sid,at){try{const l=shelfList();const x=l.find(e=>e.id===sid);if(x&&(x.at||0)<=at){x.cl=at;shelfSet(l)}}catch(e){}}
function cgActive(){clearTimeout(CG_T);CG_T=null;if(!cloudOn()||cloudMode()!=='other')return;if(S&&!ON()&&!TV)saveLocal();const st=soloState();if(!st||!st.w)return;
 const m=soloMeta(),at=m.at||Date.now();if((m.cl||0)>=at)return;const sid=soloSid();
 cgUp(sid,JSON.stringify(st),st,at).then(ok=>{if(!ok)return;const m2=soloMeta();if(m2.sid===sid){m2.cl=Math.max(m2.cl||0,at);LS.set('tksim_meta',JSON.stringify(m2))}})}
async function cgSweep(){if(CG_SWEEP||!cloudOn())return;CG_SWEEP=true;
 try{if(cloudMode()==='other')cgActive();
  for(const x of shelfList()){if((x.cl||0)>=(x.at||1))continue;const data=await shelfGet(x.id);let st=null;try{st=JSON.parse(data)}catch(e){}if(!st||!st.w)continue;
   if(await cgUp(x.id,data,st,x.at||Date.now()))cgMark(x.id,x.at||0);else break}}
 finally{CG_SWEEP=false}}
/* with several solo games, cloud save follows one of them: the one it was turned on with */
function cloudMode(){const c=cloudCfg();if(!c)return 'none';const st=soloState();if(st&&st.w){const sid=soloSid();if(!c.sid){c.sid=sid;cloudSet(c)}return c.sid===sid?'linked':'other'}return c.sid&&shelfList().some(x=>x.id===c.sid)?'other':'none'}
/* `game` tags which game the cloud copy is. When another device switches cloud save to a different game ("Sync this
 game instead"), the tag changes, and this device puts its own game on the shelf instead of overwriting it. */
function cloudPayload(){const md=cloudMode();const st=md==='linked'?soloState():null,m=soloMeta();const c=cloudCfg()||{};const p={state:st?JSON.stringify(st):'',label:saveLabel(st),at:m.at||Date.now(),rev:(m.rev||0),dev:devId(),leagues:JSON.stringify(mpGames())};if(c.game)p.game=c.game;p._bk=st&&st.w?`${st.season}-${st.week}`:'';return p}
/* writes are queued by Firebase while offline and sent later, so don't wait on them forever */
/* one upload at a time: a second request while one is in flight just runs again afterwards */
let CL_PUSHING=null,CL_AGAIN=false;
function cloudPush(){if(CL_PUSHING){CL_AGAIN=true;return CL_PUSHING}
 CL_PUSHING=cloudPush0().finally(()=>{CL_PUSHING=null;if(CL_AGAIN){CL_AGAIN=false;cloudPush()}});return CL_PUSHING}
async function cloudPush0(){clearTimeout(CL_T);CL_T=null;
 /* cloudMode() may record which game cloud save follows, so read the settings after it */
 if(!cloudCfg()||!cloudOn()||cloudMode()==='other')return;const c=cloudCfg();
 const base=c.rev||0;const p=cloudPayload();const bk=p._bk;delete p._bk;p.rev=base+1;const at0=soloMeta().at||0;c.pending=true;cloudSet(c);CL_STATUS='syncing';let ok=0;
 try{const r=await TKO.cloudPut(c.id,p,base);if(typeof r==='number')p.rev=r;ok=1}catch(e){if(String(e&&e.message).includes('conflict')){CL_STATUS='';if(!CL_BUSY)setTimeout(()=>cloudCheck(),0);return}console.warn('cloud save failed',e)}
 const c2=cloudCfg();if(ok&&c2&&c2.id===c.id){c2.rev=Math.max(p.rev,c2.rev||0);c2.at=p.at;c2.synced=Date.now();
  /* anything saved while the upload was in flight still needs to go up */
  c2.pending=(soloMeta().at||0)>at0;if(c2.pending)CL_AGAIN=true;
  /* weekly cloud backup (5 rotating slots) */
  if(bk&&c2.lastBk!==bk){c2.lastBk=bk;c2.bkn=((c2.bkn||0)+1)%CLOUD_BK;TKO.cloudBackup(c2.id,c2.bkn,{state:p.state,label:p.label,at:p.at}).catch(()=>{})}
  cloudSet(c2);CL_STATUS=''}else CL_STATUS='offline';
 if(tab==='office'&&$('#modal').classList.contains('hidden')&&S)render()}
/* leagues removed on this device stay removed, even though the cloud list still has them */
function mpGone(){try{return JSON.parse(LS.get('tksim_gone')||'[]')}catch(e){return []}}
function mergeLeagues(json){let l=[];try{l=JSON.parse(json||'[]')}catch(e){}if(!l.length)return;const mine=mpGames(),gone=mpGone();l.forEach(g=>{if(g&&g.code&&!gone.includes(g.code)&&!mine.some(x=>x.code===g.code))mine.push(g)});LS.set('tksim_games',JSON.stringify(mine.slice(0,12)))}
/* check the cloud when the game opens or comes back to the foreground */
/* something on screen that a save swap would pull out from under the player */
function busy(){return !!(PS||ME||LQ||ED||PE||CE||PK||CF||QP)||!$('#modal').classList.contains('hidden')}
let CL_DEFER=false;
async function cloudCheck(manual){if(cloudCfg())cloudMode();const c=cloudCfg();if(!c||!cloudOn()||CL_BUSY)return;CL_BUSY=true;
 try{const d=await TKO.cloudGet(c.id);if(!d){if(manual)toast('Cloud save not found — uploading this device’s copy.');CL_BUSY=false;return cloudPush()}
  mergeLeagues(d.leagues);if(cloudMode()==='other'){CL_STATUS='';cgSweep();return}
  /* another device switched cloud save to a different game: keep this device's game on the shelf and follow the new one */
  if(d.state&&d.game&&d.game!==c.game){if(!ON()&&(busy()&&!manual||PS||ME||LQ||ED||PE||CE)){CL_DEFER=true;return}await cloudAdopt(d);CL_STATUS='';return}
  if(d.dev===devId()&&(d.rev||0)>(c.rev||0)){c.rev=d.rev;cloudSet(c)}const m=soloMeta();const localDirty=!!c.pending||(m.at||0)>(c.synced||0);const cloudNewer=(d.rev||0)>(c.rev||0)&&d.dev!==devId();
  /* the other device only changed its league list: take its version number and carry on */
  if(cloudNewer&&!d.state){c.rev=d.rev;cloudSet(c);if(localDirty)await cloudPush();CL_STATUS='';return}
  /* mid-show or mid-edit: don't swap saves now — try again when the screen closes */
  if(cloudNewer&&!ON()&&busy()&&!manual){CL_DEFER=true;return}
  if(cloudNewer&&localDirty&&soloState()&&d.state)return cloudConflict(d);
  if(cloudNewer&&d.state){applyCloud(d,false);toast(`☁️ Loaded your latest save from the cloud (${d.label}).`)}
  else if(localDirty||(d.rev||0)<(c.rev||0))await cloudPush();
  else if(manual)toast('☁️ Everything is synced.');
  const c2=cloudCfg();if(c2){c2.synced=Date.now();cloudSet(c2)}CL_STATUS='';cgSweep()}
 catch(e){CL_STATUS='offline';if(manual)toast('You’re offline — your save is safe on this device and will sync later.')}

function applyCloud(d,backupFirst){if(TV){CL_DEFER=false;return}if(!ON()&&(PS||ME||LQ||ED||PE||CE)){CL_DEFER=true;return}const cur=soloState();if(cur&&backupFirst!==false)localBackup('Before loading the cloud save',cur);else if(cur)localBackup('Replaced by cloud save',cur);
 const st=JSON.parse(d.state);try{localStorage.setItem(KEY,d.state)}catch(e){}LS.set('tksim_meta',JSON.stringify({at:d.at,rev:d.rev,sid:(cloudCfg()||{}).sid||soloMeta().sid}));
 const c=cloudCfg();if(c){c.rev=d.rev;c.at=d.at;c.pending=false;c.synced=Date.now();cloudSet(c)}
 if(!ON()){S=st;dataUpdate(S);ensureTraits(S);econMigrate(S);feudInit(S);showMigrate();closeModal();tab='home';ANIM=true;render();loadRepoPhotos()}}
