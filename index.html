:root{--bg:#09090b;--st1:#18191e;--st2:#101115;--line:#2b2d34;--gold:#d8b449;--gold2:#f6dd8e;--gold3:#9c7424;--red:#e2332b;--red2:#8f0f0b;--ember:#ff7a2e;--text:#f3efe6;--mut:#9b978e;--face:#4fb0ff;--heel:#ff4d4d;--good:#4fd585;--bad:#ff5a52;
--grain:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 38%);
--grunge:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60%);
--cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
--slant:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font-family:'Barlow',-apple-system,Segoe UI,Roboto,sans-serif;font-weight:500;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);touch-action:manipulation}
body{min-height:100vh;background:radial-gradient(120% 55% at 50% -8%,rgba(255,138,46,.20),transparent 60%),radial-gradient(90% 45% at 105% 0%,rgba(226,51,43,.16),transparent 60%),radial-gradient(80% 60% at 50% 115%,rgba(216,180,73,.08),transparent 60%),linear-gradient(180deg,#121216 0%,#0a0a0c 55%,#060607 100%);background-attachment:fixed}
body:before{content:none}
body:after{content:none}
body.lock{overflow:hidden}
#app{position:relative;z-index:1}
.h,.mhd,.showname,.logo,.ovr,.btn,.chip,label,.crown,.mini,.badge,.vs,nav.tabs button,.tile b,.hudc,.slot .lbl,.key{font-family:'BC','Barlow Condensed','Arial Narrow',Impact,sans-serif}
.h{text-transform:uppercase;letter-spacing:.03em;font-weight:800;font-style:italic}
/* header */
header.top:before{content:"";position:absolute;left:0;right:0;bottom:100%;height:120px;background:#09090b;pointer-events:none}
header.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px 9px;padding-top:max(10px,calc(env(safe-area-inset-top) + 14px));background:#09090b;border-bottom:1px solid #000;box-shadow:0 1px 0 rgba(216,180,73,.35),0 8px 24px rgba(0,0,0,.6)}
header.top:after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;background:linear-gradient(90deg,var(--gold) 0%,var(--red) 55%,transparent 100%)}
.brand{position:relative;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ver{position:absolute;left:5px;bottom:-10px;font:600 9px/1 'Barlow',sans-serif;letter-spacing:.08em;color:#6f6b64;pointer-events:none}
.logo{font-size:23px;font-weight:900;font-style:italic;letter-spacing:.02em;line-height:.9;padding-right:3px;background:linear-gradient(180deg,#fff9df 0%,#f3d77a 38%,#b78a23 52%,#f0cf6d 72%,#fff1bc 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.8))}
.logo2{display:block;margin:3px 0 0 -3px;font:800 italic 9.5px/1 'BC',Impact,sans-serif;color:#fff;background:linear-gradient(180deg,#ff4a3d,#a8130d);padding:2px 9px 2px 9px;clip-path:var(--slant);letter-spacing:.42em;text-align:center}
.lstack{display:flex;flex-direction:column;align-items:stretch}
.lmk{display:block;width:52px;height:18px;margin-right:4px;overflow:visible;filter:drop-shadow(0 2px 0 rgba(0,0,0,.7))}
.hud{display:flex;gap:5px;align-items:center}
.hudc{font-size:13px;font-weight:700;letter-spacing:.04em;background:linear-gradient(180deg,#22232a,#15161a);border-top:1px solid #34363e;padding:4px 10px;clip-path:var(--slant);color:#e9e4d8;white-space:nowrap}
.hudc b{color:var(--gold2);font-weight:800}
main{padding:16px 16px 110px;max-width:640px;margin:0 auto}
main.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.05s}main.enter>*:nth-child(3){animation-delay:.1s}main.enter>*:nth-child(4){animation-delay:.15s}main.enter>*:nth-child(5){animation-delay:.2s}main.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes shine{0%,72%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(320%) skewX(-20deg)}}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
@keyframes livedot{0%,100%{opacity:1}50%{opacity:.25}}
/* nav */
nav.tabs{position:fixed;bottom:-120px;left:0;right:0;z-index:6;display:flex;padding:6px 6px calc(120px + max(6px,env(safe-area-inset-bottom) - 8px));background:linear-gradient(180deg,#0e0e11,#050506);box-shadow:0 -10px 30px rgba(0,0,0,.7)}
nav.tabs:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--red) 70%,transparent)}
nav.tabs button{flex:1;position:relative;background:none;border:0;color:#77736b;padding:7px 0 3px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--gold2);text-shadow:0 0 12px rgba(246,221,142,.5)}
nav.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(246,221,142,.55))}
nav.tabs button.on:before{content:"";position:absolute;top:-6px;left:22%;right:22%;height:3px;background:var(--gold2);clip-path:var(--slant);box-shadow:0 0 10px var(--gold)}
/* panels */
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.07);position:relative;background:var(--grunge),linear-gradient(180deg,var(--st1) 0%,var(--st2) 100%);border:1px solid var(--line);border-top-color:#3a3c44;padding:15px;margin-bottom:12px;clip-path:var(--cut)}
.card.warn{background:linear-gradient(180deg,#2a1810,#170d08);border-color:#6d3a18}
.card.mine{box-shadow:inset 4px 0 0 var(--gold)}
.card.theirs{box-shadow:inset 4px 0 0 #6b6d76}
.small{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--gold2);margin-bottom:10px}
.small:before{content:"";width:12px;height:12px;background:linear-gradient(135deg,var(--red),var(--ember));clip-path:polygon(40% 0,100% 0,60% 100%,0 100%);flex:none}
/* poster */
.showcard{position:relative;overflow:hidden;min-height:196px;padding:18px 16px 16px;background:var(--grain),radial-gradient(70% 90% at 85% 0%,rgba(255,150,60,.45),transparent 60%),radial-gradient(60% 80% at 0% 100%,rgba(226,51,43,.35),transparent 65%),linear-gradient(160deg,#2a1a10 0%,#120b08 55%,#07070a 100%);border:1px solid #4b3620}
.showcard.col{background:var(--grain),radial-gradient(70% 90% at 90% 0%,rgba(226,51,43,.55),transparent 60%),radial-gradient(60% 80% at 0% 100%,rgba(90,110,140,.35),transparent 65%),linear-gradient(160deg,#27100f 0%,#110909 55%,#07070a 100%);border-color:#5b2320}
.showcard.ppv{background:var(--grain),radial-gradient(80% 90% at 50% -10%,rgba(246,221,142,.55),transparent 60%),radial-gradient(60% 80% at 100% 100%,rgba(226,51,43,.35),transparent 65%),linear-gradient(170deg,#3a2a08 0%,#150f03 60%,#070604 100%);border-color:var(--gold)}
.wm{position:absolute;right:-6px;bottom:-14px;font:900 italic 86px/1 'BC',Impact,sans-serif;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.09);text-transform:uppercase;letter-spacing:-.01em;pointer-events:none;white-space:nowrap}
.kicker{display:inline-flex;gap:8px;align-items:center;font:700 13px 'BC',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#e9d9b0}
.kicker i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:livedot 1.4s infinite}
.showname{position:relative;font-size:58px;line-height:.9;margin:8px 0 6px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.005em;background:linear-gradient(180deg,#ffffff 0%,#ffe9a8 40%,#e1a93a 62%,#fff0c2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.75)) drop-shadow(0 0 18px rgba(255,160,60,.25))}
.showcard.col .showname{background:linear-gradient(180deg,#fff 0%,#ffd3cf 40%,#e2332b 64%,#ffc2bd 100%);-webkit-background-clip:text;background-clip:text}
.venue{position:relative;font:700 14px 'BC',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#cfc6b2}
.venue b{color:#fff}
.showcard .btn{position:relative}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{position:relative;overflow:hidden;text-align:left;height:108px;padding:12px;border:1px solid var(--line);border-top-color:#3c3e46;background:var(--grunge),linear-gradient(160deg,#1f2026,#111216);color:var(--text);clip-path:var(--cut);cursor:pointer;font-family:inherit;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile svg{width:26px;height:26px;fill:none;stroke:var(--gold2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(216,180,73,.4))}
.tile b{display:block;font-size:22px;font-weight:800;font-style:italic;text-transform:uppercase;line-height:1;margin-top:8px}
.tile span{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
.tile em{position:absolute;right:10px;top:6px;font:900 italic 34px/1 'BC',sans-serif;color:rgba(246,221,142,.14)}
.tile:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:40%;background:linear-gradient(90deg,var(--gold),transparent)}
/* buttons */
.btn{position:relative;overflow:hidden;display:block;width:100%;border:0;padding:14px 16px 12px;margin-top:9px;font-size:19px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.07em;color:#1b1303;background:linear-gradient(180deg,#fff0bd 0%,#ecc45e 40%,#b98a26 58%,#e8c461 100%);clip-path:var(--slant);cursor:pointer;transition:transform .1s,filter .1s}
.btn:after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 4.5s ease-in-out infinite}
.btn:active{transform:scale(.97);filter:brightness(1.15)}
.btn.sec{color:var(--text);background:linear-gradient(180deg,#2c2e36,#1a1b20);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(216,180,73,.28);font-size:16px;padding:12px 14px 10px}
.btn.sec:after,.btn.ghost:after,.btn:disabled:after{display:none}
.btn.ghost{background:none;color:var(--mut);font-size:15px}
.btn.danger{color:var(--bad)}
.btn.live{color:#fff;font-size:24px;padding:17px;background:linear-gradient(180deg,#ff6a55 0%,#e2332b 45%,#9d100b 60%,#d8261f 100%);animation:pulse 1.8s ease-in-out infinite;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.3;animation:none}
.row{display:flex;gap:8px;align-items:center}.row>.btn{margin-top:0}.row.sb{justify-content:space-between}
.mt{margin-top:10px}.center{text-align:center}
.muted{color:var(--mut);font-size:13.5px}.tiny{font-size:11.5px}.big{font-size:22px;font-weight:700}
.gold{color:var(--gold2)}.good{color:var(--good)}.bad{color:var(--bad)}.face{color:var(--face)}.heel{color:var(--heel)}.rk{color:#9fe870;font-weight:700}
.err{color:var(--bad);font-size:13.5px;margin-top:6px}
label{display:block;font-size:13px;font-weight:700;color:#bdb6a6;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.14em}
select,input{width:100%;background:#0b0b0e;color:var(--text);border:1px solid #33353d;border-bottom-color:#4a4c55;border-radius:0;padding:12px 11px;font-size:16px;font-family:'Barlow',sans-serif;font-weight:600;-webkit-appearance:none;appearance:none;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
select:focus,input:focus{outline:none;border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 11px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
.side{background:rgba(0,0,0,.35);border:1px solid #26282e;padding:10px;margin-top:8px;clip-path:var(--cut)}
.side select{margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini{background:linear-gradient(180deg,#3a2f12,#221b09);border:0;box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold2);padding:7px 12px 6px;font-weight:800;font-style:italic;font-size:14px;text-transform:uppercase;letter-spacing:.06em;clip-path:var(--slant);white-space:nowrap;cursor:pointer}
.chips{display:flex;gap:4px;overflow-x:auto;padding:0 16px 2px;margin:0 -16px;scroll-padding:0 16px;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.chips:after{content:"";flex:0 0 12px}.chip{flex:none}
.card .chips{padding-left:15px;padding-right:15px;margin:0 -15px;scroll-padding:0 15px}.chips::-webkit-scrollbar{display:none}
.chip{background:#17181c;border:0;box-shadow:inset 0 0 0 1px #34363e;color:#a9a497;padding:7px 15px 6px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;clip-path:var(--slant);cursor:pointer}
.chip.on{background:linear-gradient(180deg,#fbe7a1,#d6ad45);color:#1a1203;box-shadow:none}
/* bars */
.bar{position:relative;height:9px;margin-top:5px;background:repeating-linear-gradient(90deg,#26272d 0 9px,transparent 9px 11px)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2));-webkit-mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 11px);mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 11px);box-shadow:0 0 10px rgba(246,221,142,.4)}
.bar>b{position:absolute;top:-4px;width:3px;height:17px;background:#fff;box-shadow:0 0 6px #fff}
.bar.bad>i{background:linear-gradient(90deg,#7a1410,var(--bad))}
.bar.fat>i{background:linear-gradient(90deg,#3ea36a,#e0a43a,#e2332b)}
.bar.heat>i{background:linear-gradient(90deg,#8f0f0b,var(--red),var(--ember))}
.stat{margin-top:11px}.stat .row span:first-child{font:700 14px 'BC',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#cfc8b8}
/* brand war */
.war{position:relative;height:18px;margin:8px 0 6px;background:linear-gradient(90deg,#3b3d45,#55575f);clip-path:var(--slant);overflow:hidden}
.war>i{display:block;height:100%;background:linear-gradient(90deg,#9c7424,#f6dd8e);position:relative}
.war>i:after{content:"";position:absolute;right:-2px;top:0;bottom:0;width:4px;background:#fff;box-shadow:0 0 10px #fff}
.warnames{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.warnames b{font:800 italic 20px/1 'BC',sans-serif;text-transform:uppercase}
.warnames .r{text-align:right;color:#c6c2b9}
.vsdot{font:900 italic 16px 'BC';color:var(--red)}
/* booking slots */
.slot{position:relative;display:block;width:100%;text-align:left;background:linear-gradient(90deg,rgba(216,180,73,.05),transparent 40%),linear-gradient(180deg,#16171b,#0f1013);border:1px dashed #4f4220;padding:14px 14px 14px 58px;margin-bottom:10px;color:var(--text);font-family:inherit;font-size:15px;clip-path:var(--cut);cursor:pointer;min-height:76px}
.slot.done{border:1px solid #3c3320;background:var(--grunge),linear-gradient(90deg,rgba(216,180,73,.1),transparent 50%),linear-gradient(180deg,#1b1c21,#111216)}
.slot .num{position:absolute;left:0;top:0;bottom:0;width:44px;display:flex;align-items:center;justify-content:center;font:900 italic 26px 'BC',sans-serif;color:#1a1203;background:linear-gradient(180deg,#f6dd8e,#b98a26)}
.slot:not(.done) .num{background:#23242a;color:#6d6a62}
.slot .lbl{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.slot b{font-size:16px}
.slot .add{color:var(--mut);margin-top:3px;font-weight:600}
.stars{color:var(--gold2);letter-spacing:1px;white-space:nowrap;text-shadow:0 0 10px rgba(246,221,142,.45)}
.stars.big{font-size:30px}
.dd{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0b0b0e;color:var(--text);border:1px solid #33353d;border-bottom-color:#4a4c55;padding:10px 12px;text-align:left;cursor:pointer;font-family:'Barlow',sans-serif;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
.scout{margin:10px 0;background:rgba(0,0,0,.3)}.scout .btn{margin-bottom:0}
.wc .fdl{margin:0 -8px 6px -10px}.wc .fdl .fdb{margin:0 0 2px}.wc .fdb.x{background:linear-gradient(90deg,rgba(120,98,40,.9),rgba(60,48,18,.25))}.wc .fdm{font:700 10px/1.2 'Barlow',sans-serif;color:#e8cf8e;padding:1px 8px 0 10px}
.fck .muh{color:var(--gold2)}
.rib{margin-top:8px;padding:10px;background:rgba(0,0,0,.35);border:1px solid #3c3320;clip-path:var(--cut)}.ril{margin:10px 0 5px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#bdb6a6}.hp{margin:3px 0;gap:8px;font-size:14px}.hp b{flex:none}
.dd.sm{padding:7px 10px}.dd.sm .ddv b{font-size:14px}.dd.sm .ddv small{font-size:12px}.tsel{margin-bottom:8px}
.dd.open{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);clip-path:none}
.ddv{min-width:0}.ddv b{display:block;font-size:16px;font-weight:700}.ddv small{display:block;color:var(--mut);font-size:13px;margin-top:1px}
.ddc{flex:none;width:9px;height:9px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .15s}.dd.open .ddc{transform:rotate(-135deg);margin-top:4px}
.ddl{border:1px solid var(--gold);border-top:0;background:#0f1013;margin-bottom:4px}
.ddg{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:12px 12px 6px;border-top:1px solid #222329}.ddg:first-child{border-top:0}
.ddh{color:var(--mut);font-size:13px;padding:10px 12px}
.ddo{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid #1e1f25;color:var(--text);padding:10px 12px;cursor:pointer;font-family:'Barlow',sans-serif}
.ddo.on{background:linear-gradient(90deg,rgba(216,180,73,.16),transparent 80%);box-shadow:inset 3px 0 0 var(--gold)}
.ddo:disabled{opacity:.42;cursor:not-allowed}
.ddt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.ddt b{font-size:15px}.ddp{flex:none;color:var(--gold2);font-weight:700;font-size:14px}
.ddd{color:var(--mut);font-size:13px;line-height:1.35;margin-top:2px}.ddd i{font-style:normal;color:#c9c2b1}
.ddm{margin:6px 0 0}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.prod{background:#17181c;border:0;box-shadow:inset 0 0 0 1px #34363e;color:var(--text);padding:8px 6px;text-align:center;cursor:pointer;clip-path:var(--cut);display:flex;flex-direction:column;gap:2px;min-width:0}
.prod b{font-size:14px;line-height:1.1}.prod span{color:var(--gold2);font-weight:700}.prod small{color:var(--mut);font-size:12px}
.sells{display:flex;flex-direction:column;gap:6px;margin-top:6px}.sell{display:flex;gap:10px;align-items:center;text-align:left;background:#17181c;border:0;box-shadow:inset 0 0 0 1px #34363e;color:var(--text);padding:8px 10px;cursor:pointer;font:inherit}.sell.on{background:linear-gradient(180deg,#3a2f10,#231c08);box-shadow:inset 0 0 0 1px var(--gold)}.sell .si{font-size:20px}.sell .st{flex:1;min-width:0;display:flex;flex-direction:column}.sell .st small{color:var(--mut);font-size:12px}.sell .sv{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap;font-size:13px}.sell .sv small{font-size:12px}
.prod.on{background:linear-gradient(180deg,#3a2f10,#231c08);box-shadow:inset 0 0 0 1px var(--gold)}.prod:disabled{opacity:.4;cursor:not-allowed}
.bill{border-top:1px solid var(--line);padding-top:8px;font-size:14px}.bill .row{margin:3px 0;gap:10px}.bill b{text-align:right}
.capbox{background:rgba(0,0,0,.35);border:1px solid #3c3320;padding:8px 10px;clip-path:var(--cut)}.capbox .tiny{margin-top:4px}
.proj{background:rgba(0,0,0,.45);border:1px solid #3c3320;padding:12px;margin-top:12px;text-align:center;clip-path:var(--cut)}
.news{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.news .muted{display:inline-block;min-width:34px;font:700 13px 'BC';letter-spacing:.08em;color:var(--red)}
.feud{margin-bottom:12px;font-size:14.5px;font-weight:600}
.badge{font-size:13px;font-weight:800;font-style:italic;padding:3px 10px 2px;letter-spacing:.08em;clip-path:var(--slant)}
.badge.you{background:linear-gradient(180deg,#fbe7a1,#d6ad45);color:#111}.badge.riv{background:#4a4c55}.badge.vac{background:#26272c;color:var(--mut)}
.card.belt{background:var(--grain),radial-gradient(90% 120% at 50% 0%,rgba(246,221,142,.13),transparent 60%),linear-gradient(180deg,#1d1a12,#0f0e0b);border-color:#4a3c1b}
.card.belt .h{font-size:22px}
.champ{font-size:18px;font-weight:700;margin:8px 0;cursor:pointer}
.wc.champ{margin:0;font-size:inherit;font-weight:inherit}
.seg{padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}
.note{font-size:13.5px;color:var(--gold2);margin-top:3px;font-weight:600}
/* modal */
#modal:before,#modal:after,nav.tabs:after{content:"";position:absolute;left:0;right:0;height:140px;pointer-events:none}
#modal:before{bottom:100%;background:rgba(0,0,0,.85)}
#modal:after{top:100%;background:#0c0d10}
nav.tabs:after{top:100%;background:#050506}
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(100% 70% at 50% 100%,rgba(0,0,0,.6),rgba(0,0,0,.85));animation:fadein .2s}
#modal.hidden{display:none}
.sheet{position:relative;width:100%;max-width:640px;max-height:93vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:22px 16px calc(24px + env(safe-area-inset-bottom));background:var(--grunge),radial-gradient(90% 40% at 50% 0%,rgba(255,150,60,.12),transparent 70%),linear-gradient(180deg,#17181d 0%,#0c0d10 100%);border-top:2px solid var(--gold);box-shadow:0 -20px 50px rgba(0,0,0,.8)}
.sheet:before{content:"";position:absolute;top:8px;left:50%;width:44px;height:4px;margin-left:-22px;background:#3b3d45;border-radius:2px}
.sheet.in{animation:sheetin .32s cubic-bezier(.2,.8,.2,1)}
.sheet.swap{animation:fadein .18s}
/* iOS Safari stops fixed elements above its floating address bar. Run the pop-up 200px past the bottom
   (off-screen / behind the bar) and pad its content by the same amount, so it always reaches the true
   bottom edge and the last item still scrolls clear of the bar. Visually identical everywhere else. */
#modal{bottom:-200px}
.sheet{max-height:calc(93vh + 200px);max-height:calc(93dvh + 200px);padding-bottom:calc(224px + env(safe-area-inset-bottom))}
.mhd{font-size:30px;line-height:1;font-weight:900;font-style:italic;text-transform:uppercase;margin:4px 0 8px;background:linear-gradient(180deg,#fff7d6,#e9c258 60%,#b98a26);-webkit-background-clip:text;background-clip:text;color:transparent}
.wd-n{font-size:30px;line-height:1}
.scene{font-size:18px;line-height:1.5;margin:10px 0 16px;font-weight:600}
.choice{position:relative;display:grid;grid-template-columns:36px 1fr;column-gap:10px;align-items:center;width:100%;text-align:left;background:linear-gradient(90deg,rgba(216,180,73,.08),transparent 60%),#15161a;border:1px solid #3a3222;padding:12px;margin-bottom:9px;color:var(--text);font-size:16px;font-weight:600;font-family:inherit;clip-path:var(--cut);cursor:pointer;transition:transform .1s}
.choice:active{transform:scale(.98);border-color:var(--gold)}
.sbody.picking .choice{pointer-events:none}
.sbody .choice.picked{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 26px rgba(255,200,80,.3);background:linear-gradient(90deg,rgba(255,205,90,.28),rgba(255,205,90,.06) 70%),#1c1a12;z-index:1;animation:tvpick .45s both}
.sbody .choice.picked::after{content:'✓ PICKED';position:absolute;bottom:7px;right:12px;padding:3px 10px;background:var(--gold);color:#16120a;font:900 italic 12px/1.2 'BC',sans-serif;letter-spacing:.08em;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);animation:rise .3s both}
.sbody .choice.picked .key span{font-size:0}.sbody .choice.picked .key span::before{content:'✓';font-size:18px}
.sbody .choice.unpicked{opacity:.28;filter:grayscale(.7);transition:opacity .25s,filter .25s}
.ppick{display:flex;align-items:center;gap:11px;margin:0 0 10px;padding:8px 12px;border:1px solid var(--gold3);border-left:4px solid var(--gold);background:rgba(255,200,80,.08);animation:rise .3s both}
.ppick small{display:block;color:var(--gold);font:800 11px/1.3 'BC',sans-serif;letter-spacing:.14em;text-transform:uppercase}
.ppick .tvp-k{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--gold);color:#16120a;font:900 italic 15px 'BC',sans-serif;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.tv-live-sheet .ppick{display:none}
nav.tabs.kb{display:none}
.choice .key{grid-row:span 2;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;font-style:italic;color:#1a1203;background:linear-gradient(180deg,#fbe7a1,#c99a33);transform:rotate(45deg) scale(.82)}
.choice .key span{transform:rotate(-45deg)}
.outcome{padding:13px 14px;margin:10px 0;font-size:16px;font-weight:600;clip-path:var(--cut)}
.outcome.ok{background:linear-gradient(90deg,rgba(79,213,133,.22),rgba(79,213,133,.05));box-shadow:inset 4px 0 0 var(--good)}
.outcome.no{background:linear-gradient(90deg,rgba(255,90,82,.22),rgba(255,90,82,.05));box-shadow:inset 4px 0 0 var(--bad)}
.log{font-size:14.5px;color:#d6d0c2;border-left:3px solid var(--red);padding-left:10px}
.res-hd{text-align:center;margin-bottom:12px}
.res-hd .showname{font-size:48px}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px 0 14px;text-align:center}
.score>div{background:rgba(0,0,0,.4);border:1px solid #33353d;padding:10px 6px;clip-path:var(--cut)}
.score>div.me{border-color:var(--gold);background:linear-gradient(180deg,rgba(216,180,73,.18),rgba(0,0,0,.4))}
.score span{display:block;font:700 13px 'BC';letter-spacing:.12em;text-transform:uppercase;color:#bdb6a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .stars{font-size:22px}
.score i{font:900 italic 22px 'BC';color:var(--red)}
/* title screen */
.hero{text-align:center;padding:34px 0 16px;position:relative}
.hero .kicker{justify-content:center}
.hero-t{font:900 italic 64px/.88 'BC',Impact,sans-serif;text-transform:uppercase;margin:12px 0 10px;background:linear-gradient(180deg,#fff 0%,#ffe9a8 40%,#d99b2b 62%,#fff0c2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.8)) drop-shadow(0 0 30px rgba(255,150,60,.35))}
.hero p{max-width:420px;margin:0 auto}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:linear-gradient(180deg,#26272d,#15161a);box-shadow:inset 0 0 0 1px var(--gold);color:var(--text);padding:11px 20px;font-size:14.5px;font-weight:600;max-width:90vw;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;clip-path:var(--slant)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
details summary{cursor:pointer;margin:0}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}.prow .wl{flex:1;min-width:0}.prow .wn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prow a.mini{text-decoration:none}
.card details,.sheet details.card{margin-bottom:10px}
details p{font-size:14.5px;color:#d0cabc}
/* wrestler cards */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-items:start}
.wc{position:relative;display:block;width:100%;aspect-ratio:3/4;overflow:hidden;background:#111;border:0;padding:0;color:var(--text);font-family:inherit;text-align:left;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:transform .12s}
.wc:active{transform:scale(.96)}
.wc:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 0 2px #5a4a2e}
.wc.t1:before{box-shadow:inset 0 0 0 2px #f1d27a,inset 0 0 18px rgba(246,221,142,.35)}
.wc.t2:before{box-shadow:inset 0 0 0 2px #c7cfd9}
.wc.t3:before{box-shadow:inset 0 0 0 2px #a8703f}
.wc.t1:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,240,190,.28) 42%,transparent 54%);background-size:250% 100%;animation:foil 5s linear infinite}
@keyframes foil{from{background-position:120% 0}to{background-position:-120% 0}}
.wc.champ .o{background:linear-gradient(180deg,#fbe7a1,#c99a33);color:#1a1203}

function matchGuide(w){const fit=styleFit(w.st);
 let h=`<div class="h small mt">Traits</div>${(w.tr||[]).map(t=>TRAITS[t]?`<div class="trl"><span class="ti">${TRAITS[t].i}</span><div><b>${TRAITS[t].n}</b><span>${TRAITS[t].d}</span></div></div>`:'').join('')||'<div class="muted">None</div>'}
 <div class="muted mt">As a <b>${STYLE_N[w.st]}</b>, ${fit.best.length?`${fit.strong?'clicks with':'works best with'} <b class="good">${fit.best.join(', ')}</b>`:'has no standout style pairing'}${fit.worst.length?` · struggles with <b class="bad">${fit.worst.join(', ')}</b>`:''}. Face vs heel always helps. Real chemistry only shows once two wrestlers share a ring.</div>`;
 if(!S||S.phase==='rookies')return h;
 const mine=ownList('p').filter(o=>o.id!==w.id);
 if(!mine.length)return h;
 const row=(o,p)=>{const tot=p.reduce((a,x)=>a+x.v,0);const nw=!metPair(w.id,o.id);return `<div class="mrow"><div class="row sb" onclick="showW('${o.id}')"><span class="row" style="gap:0">${face(o)}<b>${esc(o.name)}</b>${o.inj?' 🚑':''}</span><span class="${tot>=6?'good':tot<0?'bad':'muted'}"><b>${chemWord(tot)}</b>${nw?' <span class="muted">on paper ❓</span>':''}</span></div><div>${partsHtml(p)}</div></div>`};
 const opp=mine.map(o=>[o,chemParts(w,o)]).map(([o,p])=>[o,p,p.reduce((a,x)=>a+x.v,0)]).sort((a,b)=>b[2]-a[2]);
 h+=`<div class="h small mt">${w.own==='p'?'Best opponents on your roster':'Best matchups on your roster'}</div>${opp.slice(0,5).map(([o,p])=>row(o,p)).join('')}`;
 const bad=opp.slice(-2).filter(x=>x[2]<3).reverse();if(bad.length&&opp.length>6)h+=`<div class="h small mt">Avoid booking against</div>${bad.map(([o,p])=>row(o,p)).join('')}`;
 const part=mine.map(o=>[o,teamParts(w,o)]).map(([o,p])=>[o,p,p.reduce((a,x)=>a+x.v,0)]).sort((a,b)=>b[2]-a[2]).slice(0,3);

const HOWTO=`<p><b>Offers &amp; contracts:</b> free agents with 55+ popularity want an offer, not just a fee: a signing bonus, a weekly salary and promises — creative control, main event spots, a title shot, a place on every PPV. Each wrestler wants different things, so the biggest number doesn't always win. Offers are sealed: the rival (or, in a league, every other GM) can send one too, and the wrestler picks the best package. Re-signing is a negotiation: agree to their demands, or counter on money and refuse some — they take it, counter back or walk away depending on morale, how hot your show is and whether you've kept your word. Promises are contract terms you'll see on the Book screen. Break one and morale drops; break three and they may walk out. Creative control means they won't agree to lose: book them to lose and they fight the finish.</p><p><b>Open challenges:</b> book one wrestler and see who answers — someone from your roster or the free agents, usually at the challenger's level. The crowd builds up a favourite beforehand: deliver them (or someone bigger) for a huge pop, or fall flat with someone they didn't want. The answer is revealed live and you call the finish. A champion can put their title on the line. A free agent who impresses can be signed at a discount for one week.</p><p><b>Pitches:</b> every couple of weeks a wrestler brings you an idea — a turn, a new skill, a wild new character, a feud, a tag partner, or a problem they need fixed. <i>Give it a try</i> starts a short trial with a clear goal (hit it and it sticks); <i>Go for it</i> commits right away for a bigger payoff and more risk; <i>Let them down gently</i> costs a little morale. Answer within the week or they'll take it as a no. Trials and promises are tracked in your weekly briefing.</p><p><b>Past 5★:</b> a match can only show 5★, but a hot feud on the big stage can rate well past it. The extra becomes an instant-classic bonus — popularity, title prestige, more PPV buys (or merch on TV) and a few extra fans (capped per show, since the show rating already counts those stars). That's also why a gimmick match or a gutsy producer call still pays off on a match that was already headed for 5★.</p><p><b>Producer calls:</b> during a live show you're the producer in gorilla — call the big spots, call the finish, make audibles when things go off the layout, and handle disasters. Each choice shows its odds and how big the payoff could be; you find out exactly what your call did to the match after you make it.</p><p><b>Weekly briefing:</b> the first time you open Home each week you'll get a rundown of expiring contracts, unhappy talent, backstage heat, feuds about to go stale, what's coming up and free agents about to leave. Reopen it from Home any time.</p><p><b>Match ratings</b> blend in-ring skill (the best worker in the match helps carry the rest), popularity, chemistry (styles that mesh — high-flyers vs powerhouses, technicians vs technicians — plus face vs heel and history together), feud heat, stipulation fit, title prestige and stamina.</p><p><b>Booking by feel:</b> the match editor doesn't show star math any more. You get the crowd buzz (🥶 Crowd won't care up to 🔥🔥🔥 Could steal the show) and ▲/▼ tells on each stipulation, title and finish. Risky calls — a first-time pairing, a gimmick match, a screwy finish, a run-in or a green rookie — make a match a 🎲 <b>wild card</b> that can land big or fall flat. After the show, tap <b>Why that rating?</b> under any of your matches to see exactly what each part was worth, including the luck of the night.</p><p><b>Discovered chemistry:</b> two wrestlers who have never shared a ring show their chemistry "on paper" only (styles, face vs heel, traits) with a ❓. Their first match together finds out whether they really click — and that spark stays with them as history from then on.</p><p><b>Building stars:</b> popularity from a match is judged against what's expected at each wrestler's level, so a midcarder in a good-for-them match grows while a main eventer still needs a real performance. The fastest way to make someone is to put them next to a top star: tag them together, put them in a multi-person match with the star (winning it helps most), or have them beat the star once — the bigger the name you beat, and the better the match, the bigger the rub. Losing to a top star in a good match costs very little; losing every week to midcarders does.</p><p><b>The top of the card:</b> popularity gets much harder to gain past 80, and harder again past 90, so a 100 is rare. Stars at 85+ also need upkeep: in any week they don't main event, win on PPV or have a 3½★+ match or promo, they slip a little (half as much if they carried a lower name in a decent tag or multi-person match). Keep your top stars featured — and pay them back with a big win after they've spent a few weeks making someone else.</p><p><b>Multi-person matches:</b> in triple threats, 4-ways, tags and trios the top two names carry the crowd and the hottest rivalry in the ring sets the heat. Triple threats and 4-ways love high-flyers and showmen, tag matches lean on partners who click, and a good mix of styles (plus someone to boo) helps. They pay off later too: only one loser takes the fall, lower names gain popularity from working with the top star, and the top star does less of the work (less stamina).</p>
<p><b>Shows</b>: ${cardMatches(false)} matches and 2 promos on weekly TV, plus an optional <b>bonus match</b> and <b>bonus promo</b> — run them when you have something worth showing; they count toward the show rating like any segment and cost stamina like any match; PPVs are ${cardMatches(true)} matches plus an optional title challenge. The last match is your main event and counts the most.</p>
<p><b>Stamina</b> (the green-to-red STA bar on each card): a match costs about 16 in singles, less in tag and multi-person matches, more with a rough stipulation or on PPV. Wrestlers who worked a match get 10 back each week; anyone who gets the week off — or only cuts a promo — gets 25 back. Below ${100-FAT_OK} stamina matches start to suffer, and below ${100-FAT_RISK} the injury risk climbs. Rotate your roster and rest your stars before PPVs. <b>Double duty:</b> a wrestler can work up to ${DD_MAX} matches on the same show — each match after their first costs ${DD_FAT}× the stamina, and they go into it carrying the first one's wear. If they get hurt in the first, the second is scrapped. AEW rotates a big roster, so sitting out is fine — time off TV doesn't cost morale.</p>
<p><b>Turning heel or face:</b> book a <b>Heel / Face Turn</b> promo — the turn is guaranteed when it airs. Add a second wrestler and a face can turn on them (big heat) or a heel can make the save (chemistry). Or use <b>Turn off-screen</b> on a wrestler's profile for an instant switch that costs a little popularity. You can also turn someone with a <b>run-in</b>: a face who costs another face the match or beats them down after the bell turns heel, and a heel who runs off another heel to save the day turns face — tick the turn option in the run-in section. Turning the same wrestler again within 8 weeks gives fans whiplash.</p>
<p><b>Intergender booking</b> is fully open: anyone can wrestle anyone, form teams, cut promos together, and challenge for any championship — a woman can win the World title and a man can win the Women's title. Title names keep their original division, but the belts go to whoever wins.</p>
<p><b>Calls that stick:</b> what happens in a match doesn't stay there. Risky spots and brutal moments can hurt someone: most injuries are a week or two out, some turn out to be a false alarm, and now and then it's serious (low durability makes that likelier, Iron Man less so). Get caught cheating under normal rules and it's a DQ loss; go too far and it's a fine or a suspension. A tag partner walking out ends the team, a no-contest has fans demanding the rematch next week, and a chair stashed under the ring comes back out in that wrestler's next match. In the weeks before Forbidden Door, rival stars can invade your matches — whoever they go after gets that dream match penciled onto the Forbidden Door card.</p>
<p><b>Durability</b> (on each wrestler's profile) reflects how well their real-life body holds up, based on their actual injury history. Iron-bodied workers like Darby Allin lose up to ~18% less stamina per match and get hurt far less often; fragile ones like Wardlow drain faster, get injured up to 3.5× as often and stay out longer. Sort your roster by Durability to see who can carry a heavy schedule.</p>
<p><b>Traits</b> (the round badges on each card) add chemistry and bonuses on top of style — e.g. a Monster vs an Underdog is a big boost, a Storyteller helps with anyone. Open any wrestler to see their best opponents and tag partners on your roster with the reasons, or tap <b>Why?</b> under a match's projected rating.</p>
<p><b>Front office situations</b> pop up now and then after a show — backstage fights, viral videos, social media trouble, contract demands, travel mishaps, and the occasional viral opportunity. Pick how to handle each one; every option has tradeoffs. These are randomly generated fictional events.</p>
<p><b>Ending feuds:</b> book a hot feud (35+ heat) against each other on a PPV to <b>blow it off</b> — the feud is over, both wrestlers get a morale boost and the winner gets the last word (a no-contest leaves it unsettled). A feud that isn't working can be dropped early: tap it and choose <b>Cut your losses</b>. It ends at once, but you lose fans (fewer if it had already gone stale), both wrestlers lose a little morale and popularity, and any match you promised between them is cancelled.</p>
<p><b>Building feuds inside matches:</b> everyone on opposite sides of a match builds heat with each other, so tag and multi-person matches grow several feuds at once (the match editor shows exactly how much). Put two feuding wrestlers on the <b>same side</b> and the tension builds — lose, and one may betray the other. Book a <b>run-in</b> to involve someone who isn't in the match: cost them the match (the most heat, but a screwy finish in a normal-rules match unless the feud is already hot), attack them after the bell, or make the save. Doing the same run-in two weeks running builds half heat.</p>
<p><b>Stipulations</b> are modelled on real AEW match types — from Submission and 2 Out of 3 Falls to Lights Out, Texas Death, Anarchy in the Arena and Blood &amp; Guts. Each suits certain styles, costs money, and wears wrestlers out. The brutal ones pay off big when the feud is red-hot (heat 50+); without a real feud behind them they simply don't add a bonus. Some are PPV only, and the faction wars need Trios or 8-Man Tag.</p>
<p><b>Money</b> supports the booking — it doesn't replace it. The draft has a <b>salary cap</b>: stars cost far more than the midcard, so you can't draft an all-star roster (anything left under the cap goes into your bank). Every wrestler's salary is locked in on their contract until they re-sign — and a wrestler who got more popular asks for a raise. Money comes from four places: a <b>TV deal</b> signed for a season at a time (your fanbase at the start of the season sets it, and it's renegotiated each new season), <b>tickets</b> that follow your buzz from recent shows, <b>merch</b> that follows your stars and the show, and <b>ads</b> that follow the rating. PPVs add buys and a bigger gate. A bigger company also costs more to run: arena &amp; crew costs and PPV venue bills grow with your fanbase. <b>Great shows pay</b>: a 3½★ week roughly covers a full payroll, 4★+ weeks make real money and bad shows lose it. Need cash fast? <b>Sell out</b> — sponsored segments, pricier tickets, merch blitzes, extra ad breaks or a sportsbook sponsor — but each one costs fans, and doing it often makes fans angrier. You can spend on <b>production</b> (a small bump to the show rating) and <b>stipulations</b>, and every PPV has a venue bill. Fall into the red and morale drops; stay there 3 weeks and wrestlers start walking out.</p>
<p><b>Developing talent:</b> the draft is real wrestlers only. During the season, open <b>Roster → Free agents</b> and scroll to <b>Prospects</b> to hand-pick one — Prospect, Blue-Chip or Generational — on a cheap 52-week developmental deal. The board refreshes every few weeks, and the rival scouts too (more often, and better, on Hard). You can still design your own prospect or star; they wait in free agency until you sign them.</p>
<p><b>Free agency</b> rotates: after the draft only about 8 unsigned wrestlers are on the market at once, each for a few weeks, with new names arriving every week (and anyone released or out of contract going straight onto it). The rival signs from the same market.</p>
<p><b>Created wrestlers</b> go into the free-agent pool and are always available to you. Draft them or sign them any week from Free Agents; the rival never signs them. Rookies carry a one-time development fee when signed (free if drafted).</p>
<p><b>The story so far:</b> tap ⋯ on any feud to see how it was built — every match, promo, run-in and wild moment that added heat, the head-to-head record, and the biggest moment. Finished feuds (blown off, dropped or faded) live on under <b>📚 Past feuds</b>.</p>
<p><b>Feuds</b> start and grow from matches and promos: great matches, face vs heel, title matches and messy finishes build the most heat, and the results call it out when a rivalry is brewing (20), becomes a full-blown feud (45) or a blood feud (75). <b>🔁 One repetition rule:</b> doing the same thing with the same two people two weeks in a row — the same match pairing, the same promo segment or the same run-in — builds half heat. If either week's meeting was a tag or multi-person match, it's a lighter repeat (75% heat). That's it; it never costs stars, and PPVs are exempt. <b>💥 Boiling over:</b> when two wrestlers have only been talking, the first time they get physical (a match, run-in or sneak attack) gets a bigger reaction and +50% heat. A feud that goes 8 weeks without a PPV chapter goes stale and cools off fast; a PPV match that doesn't end the feud starts a new chapter and resets the clock, so big stories can run across several PPVs. Feuds also cool off when ignored. PPVs weigh heat much more heavily, so build rivalries on TV and pay them off on PPV. A hot feud (35+) settled on PPV is over; a cooler one continues into a new chapter.</p>
<p><b>Promos</b> play out as short scenes. Each choice tests mic skill, in-ring ability, popularity or luck. Promos between two wrestlers build feud heat. A <b>Contract Signing</b> books that match on your next PPV card (with a stipulation if you add one); a callout where you <b>lay down a challenge</b> promises the match for next week or the next PPV — your pick. While a match is promised, booking either wrestler against the other's stablemates or tag partners (🔗 proxy war) and trading promos where they take turns leading (↔️ back-and-forth) builds the feud with bonus heat. Running the promised singles match early gives it away and halves the payoff. Deliver and it pays off; skip it and you lose fans and morale. Trading promos week after week on the road to a PPV is how feuds are built: a steady weekly build earns up to +30% heat, and alternating who leads adds +15%. The only thing fans tire of is the exact same segment two weeks running (half heat). A pair can only share one promo per show. Match events work the same way — faces fly and rally the crowd, heels rake eyes and put their feet on the ropes, and some events only happen in face vs heel, face vs face or heel vs heel matches. Each promo deals fresh options: faces get crowd-pleasing moves and heels get dirty tricks (😇/😈 — playing to character gives slightly better odds), and the scene changes depending on whether it's face vs heel, heel vs heel or face vs face.</p>
<p><b>Development:</b> wrestlers improve toward their potential by working matches (faster against better opponents) and by Performance Center training. Overworked talent gets hurt.</p>
<p><b>League weeks:</b> everyone books the same week at the same time, on their own phone, whenever suits them. Make your calls, lock in, and the week airs the moment the last GM locks in — cards stay secret until then. While anyone is still booking, even smaller free agents take sealed offers instead of going to whoever taps first: if two GMs want the same wrestler, they usually pick the hotter show. (Prefer the old way? Office → League weeks → Take turns.)</p>
<p><b>Draft board:</b> during the draft, tap <b>Draft board</b> to see every GM's roster as it fills up — round by round, newest pick on top, with payroll and cap room.</p>
<p><b>Party night:</b> any online league can play in the same room. Start it from the league's Office and everyone locks in their card, then GMs go live one at a time: you make your promo and match calls on your phone while the TV shows every choice and outcome to the room. The week airs when the last GM wraps up. To put it on a TV, open the game there, tap <b>Show a league on this screen</b> and enter the league code — the TV shows who's still booking and plays the results segment by segment. End party night any time and the league goes back to taking turns with the same save. The TV goes full screen (press <b>F</b> or tap ⛶ to switch) and shows the draft as a live board of every GM's picks.</p>
<p><b>Cloud save &amp; backups:</b> turn on cloud save in the ⚙️ Game menu to back up automatically and continue on any device with your sync code. Everything still saves on the device first, so offline play just works and syncs later. The game also keeps automatic backups of your last few weeks (Office → Backups).</p>
<p><b>Show structure</b> counts toward the show rating, the way AEW's quarter-hour numbers reward it: open hot with a strong segment, keep the middle moving (back-to-back promos and dead spots cost you), build through the second half, and make the main event the best thing on the show. Every show needs something for the women's division if you have one. The Show flow card on the booking screen previews it — hold and drag segments to change the running order.</p>
<p><b>Debuts:</b> anyone you sign during the season arrives with debut buzz. Their first appearance on your show — match or promo — pops the crowd: the bigger the star, the bigger the bump in stars and fans (a PPV debut is bigger still). Wait more than a few weeks and the buzz wears off.</p>
<p><b>Quick booking:</b> hold and drag segments to reorder the card, drag one wrestler's name onto another's to swap them between segments, or drag someone from the locker room onto a name or an empty slot. When you add a wrestler to a match or promo, their top rival is added as the opponent automatically — tap to change it.</p>
<p><b>Fans:</b> each week you book all of Dynamite while the rival books Collision. Your show earns or loses fans based on its rating (the main event counts most), with a bonus for beating the rival's show. PPVs swing far more fans, and All In counts double. <b>Each season is won by the fans you gain that season</b> — your all-time fanbase carries over (it still drives TV money, tickets and PPV buys), but next season's fan war starts level.</p>
<p><b>Finishes:</b> pick how every match ends, not just who wins. ✅ <b>Clean</b> is the only way to truly settle a feud on PPV (a clean blow-off rates higher). 😈 <b>Heel shenanigans</b> (heel winners only) builds 35% more heat and protects the loser, but a cold feud's crowd doesn't buy it, and a dirty finish on a PPV blow-off leaves the feud unsettled. ⚡ <b>Upset roll-up</b> (the winner must be the clear underdog) gives the winner a big boost. 🟥 <b>DQ</b> and 🚪 <b>count-out</b> build the most heat but feel cheap unless the feud is hot, and titles never change hands on them — a classic way for a champion to escape. Any finish that isn't clean protects the loser's momentum.</p>
<p><b>Who wins matters:</b> beating someone more popular than you gives you <b>the rub</b> (an upset even more so) — beating someone far below you does little. Winning streaks build momentum, and a hot streak gets the crowd invested in a wrestler's matches. Lose four in a row clean and fans stop believing in a star (enhancement talent under 45 popularity is fine). Trading clean wins back and forth within a month is 50/50 booking and cools the feud off.</p>
<p><b>Title reigns:</b> every successful defense adds to a champion's credibility and the title's prestige, and the wrestler who ends a long reign gets a bigger boost. Swap a belt again within 3 weeks and it's a hot potato: the title loses 8 prestige and the new champ gets little out of it.</p>
<p><b>Card position:</b> main-eventing boosts morale (and popularity after a great match). Stars who want the spotlight don't sulk — they pitch you: a main event slot or a shot at a belt. The unhappier they are, the more often they knock on your door.</p>
<p><b>The calendar:</b> each season is a full AEW year of ${SEASON} weeks with a PPV every 4 weeks — Revolution, Dynasty, Double or Nothing, Forbidden Door, Redemption, <b>All In</b> (the midyear supershow, week ${ALLIN_WEEK}), All Out, WrestleDream, Full Gear and Worlds End, which closes the year. Then the awards and offseason, and the calendar rolls on into a new year. Plus 📺 <b>TV specials</b> (${Object.values(SPECIALS).join(', ')}) with hotter crowds, 50% bigger fan swings and better gates. <b>Forbidden Door</b> is a crossover PPV: alongside your card you can sign up to two dream matches between one of your stars and one of the rival's. Neither GM controls both sides, so the winner is decided in the ring, and the winner's brand earns extra fans (4K; a 4★+ dream match pays the losing brand 2K too).</p>
<p><b>Tournaments</b> lock onto your card — you decide who advances. Tournament rules are about winning, not good vs evil: face vs face and heel vs heel pairings rate and build heat like face vs heel, and the repetition rule, trading-wins cooling, feud-check warnings and promised-match giveaways don't apply to bracket matches. From three weeks out until the first matches air, tap <b>Pick your field</b> on the Home screen to choose your four entrants (and the seeding for the Owen Hart Cups); if you don't, your four best are entered automatically. ♾️ The <b>Continental Classic</b> (weeks ${TOURS.c2.rr[0]}–${TOURS.c2.rr[2]}) is a round robin for your four best men (3 points a win, no run-ins), and the top two meet at Worlds End for the Continental title if your brand holds it or it's vacant. 🏆 The <b>Owen Hart Cups</b> (men's semi-finals week ${TOURS.ohc.semi}, women's week ${TOURS.ohcw.semi}, both finals at Double or Nothing) send the winners to All In with a World title shot — against your champion, or as your title challenge if the rival holds the belt. Injured entrants forfeit.</p>
<p><b>Casino Gauntlet:</b> a new match type for six. It rates a little lower than a straight wrestling match, but the winner earns a title shot at the next PPV against your top champion in their division.</p>
<p><b>Network mandates:</b> after each PPV the TV network asks for something specific by the next one — a 4★ main event, two women's matches on one show, a new champion, a debut and so on. Deliver for a cash and fan bonus; miss it and you lose 5K fans. Check the Home or Book screen for your current one.</p>
<p><b>🎯 Weekly goals &amp; 📣 crowd chants:</b> each week the Book screen gives you one small goal (hit it for a little cash and 3K fans — no penalty for missing it; a live ✅/🤞/⏳ line tells you if the card you've booked is on track), and the crowd starts chanting for someone on your roster. Book them in a match or promo that week and their segment gets +¼★, they gain popularity and you get 2K fans.</p>
<p><b>Head to head:</b> in solo play the rival's card stays a surprise until the show airs. On TV, whoever's main event rates higher wins the main event war (+3K fans). When you sign a big free agent (70+ popularity), the rival may start a <b>bidding war</b>: pay 35% more (and a 20% higher salary) or let them go.</p>
<p><b>✨ Suggest the rest</b> on the Book screen fills any empty slots with a sensible card — it keeps everything you've already booked, promised or entered in a tournament. <b>Clear card</b> wipes everything else.</p>
<p><b>Difficulty:</b> no rival gets free stars any more. Hard rivals book like pros — they rest stars before PPVs, order their card for the ratings, protect new champions and pay off feuds cleanly. Easy rivals book sloppily.</p>
<p><b>The offseason:</b> after Worlds End, the season ends with an awards show (Wrestler and Women's Wrestler of the Year, Breakout Star, Rookie, Tag Team, Feud, Match and Promo of the Year — winners start next season with a boost). Veterans feel Father Time: they lose a little in-ring each year and may retire. Prospects ready for the main roster (60+ in-ring) get called up with debut buzz. Re-sign anyone whose contract is running out before you start the new season.</p>`;

/* ===================== CLOUD SAVE & BACKUPS =====================
 Your solo save (and your list of online leagues) can live in the cloud under a private sync code.
 Every change still saves on the device first, so the game never waits on the internet; the cloud copy

/* ===================== YOUR GAMES: several solo games and leagues on one device =====================
 The solo game you're playing lives where it always has (so backups and cloud save keep working); other solo
 games wait on a shelf in IndexedDB until you switch to them. Leagues already live in their own slots. */
const SHELF='tksim_shelf';
function shelfList(){try{return JSON.parse(LS.get(SHELF)||'[]')}catch(e){return []}}
/* throws if the list can't be written, so callers never drop a save that the list doesn't point to */
function shelfSet(l){localStorage.setItem(SHELF,JSON.stringify(l))}
let SDB=null,BOOT_Q=false;
function sdb(){if(SDB)return SDB;SDB=new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return rej('no idb');const r=indexedDB.open('tksim_saves',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});SDB.catch(()=>{});return SDB}
function sdbOp(mode,fn){return sdb().then(db=>new Promise((res,rej)=>{const t=db.transaction('s',mode);const q=fn(t.objectStore('s'));t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error)}))}
async function shelfPut(id,v){try{await sdbOp('readwrite',st=>{st.put(v,id)})}catch(e){localStorage.setItem('tksim_shelf_'+id,v)}}
async function shelfGet(id){let v=null;try{v=await sdbOp('readonly',st=>st.get(id))}catch(e){}if(!v){try{v=localStorage.getItem('tksim_shelf_'+id)}catch(e){}}return v||null}
async function shelfDel(id){try{await sdbOp('readwrite',st=>{st.delete(id)})}catch(e){}try{localStorage.removeItem('tksim_shelf_'+id)}catch(e){}}
function soloSid(){const m=soloMeta();if(!m.sid){m.sid=newCode(8);LS.set('tksim_meta',JSON.stringify(m))}return m.sid}
const inApp=()=>!!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone);
/* put the solo game you're playing on the shelf (nothing is lost if this fails: it throws before touching your save) */
async function shelveSolo(){if(S&&!ON()&&!TV)saveLocal();const st=soloState();if(!st||!st.w)return;const sid=soloSid(),m=soloMeta();
 /* the cloud copy follows this game: send its last changes up before it goes on the shelf (the upload reads the save right away) */
 if(cloudOn()&&(CL_T||(cloudCfg()||{}).pending)&&cloudMode()==='linked')cloudPush();
 const at=m.at||Date.now(),data=JSON.stringify(st);await shelfPut(sid,data);const l=shelfList().filter(x=>x.id!==sid);l.unshift({id:sid,label:saveLabel(st),t:soloTitle(st),sub:stageTxt(st),at,meta:m,cl:m.cl||0});shelfSet(l);
 cgUp(sid,data,st,at).then(ok=>{if(ok)cgMark(sid,at)});
 try{localStorage.removeItem(KEY)}catch(e){}LS.set('tksim_meta','{}')}
function leaveLeagueView(){if(!ON()||TV)return;if(typeof MP_UNSUB!=='undefined'&&MP_UNSUB){MP_UNSUB();MP_UNSUB=null}saveLocal();LMP=null;LS.del('tksim_active')}
function afterSoloLoad(){S=load();if(S&&(!S.w||!S.phase))S=null;if(S){dataUpdate(S);ensureTraits(S);econMigrate(S);feudInit(S);showMigrate()}closeModal();tab='home';ANIM=true;render();if(S)loadRepoPhotos();cloudCheck()}
/* Order matters in the switches below: shelve the solo game first (it throws before touching anything), and only then
 close the league view. Closing the league first and then failing would leave the league on screen with no league
 slot to save into, and the next autosave would land on top of the solo game. */
async function openSolo(id){if(TV)return toast('Exit TV mode first (top right).');if(busy()&&!$('#games'))return;
 const data=await shelfGet(id);if(!data)return toast("Couldn't find that game on this device.");const ent=shelfList().find(x=>x.id===id)||{};
 try{await shelveSolo()}catch(e){console.warn(e);return toast("Couldn't switch games — your device may be out of storage.")}
 leaveLeagueView();
 try{localStorage.setItem(KEY,data)}catch(e){console.warn(e);afterSoloLoad();return toast("Couldn't switch games — your device may be out of storage. Both games are safe in ⇄ Your games.")}
 LS.set('tksim_meta',JSON.stringify(Object.assign({},ent.meta||{},{sid:id,cl:ent.cl||0})));
 try{shelfSet(shelfList().filter(x=>x.id!==id));await shelfDel(id)}catch(e){}afterSoloLoad()}
function openActiveSolo(){if(TV)return toast('Exit TV mode first (top right).');if(ON())return mpSolo();closeModal()}
async function newSolo(){if(TV)return toast('Exit TV mode first (top right).');try{await shelveSolo()}catch(e){return toast("Couldn't put your current game away — your device may be out of storage.")}leaveLeagueView();S=null;closeModal();tab='home';ANIM=true;render();toast('Your other games are saved in ⇄ Your games.')}
/* safety net: a shelved game whose list entry went missing (e.g. storage filled up mid-switch) is put back on the list */
async function shelfRecover(){let keys=[];try{keys=await sdbOp('readonly',st=>st.getAllKeys())||[]}catch(e){}
 try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('tksim_shelf_'))keys.push(k.slice(12))}}catch(e){}
 const have=new Set(shelfList().map(x=>x.id));const cur=soloMeta().sid;let found=0;
 for(const id of new Set(keys)){if(have.has(id)||id===cur)continue;const v=await shelfGet(id);let st=null;try{st=JSON.parse(v)}catch(e){}if(!st||!st.w)continue;
  try{const l=shelfList();l.push({id,label:saveLabel(st),t:soloTitle(st),sub:stageTxt(st),at:Date.now(),meta:{}});shelfSet(l);found++}catch(e){}}
 if(found)toast(`Found ${found} saved game${found>1?'s':''} — they're in ⇄ Your games.`)}
/* ===================== BACK UP EVERYTHING ON THIS DEVICE (v92) =====================
 One file with every solo game (playing + shelved), every league seat, your settings and your photos — so the
 home-screen app can be deleted and re-added without losing anything. Restoring merges: games already here stay. */
let RESTORING=false;
const BK_SKIP=k=>k==='tksim_bk'||k.startsWith('tksim_shelf_');
async function backupAll(){if(TV)return toast('Exit TV mode first (top right).');
 try{if(S&&!TV)saveLocal()}catch(e){}
 const ls={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||BK_SKIP(k)||k===KEY+'_img')continue;if(k.startsWith('tksim')||k===KEY)ls[k]=localStorage.getItem(k)}}catch(e){}
 const shelf={};for(const x of shelfList()){const v=await shelfGet(x.id);if(v)shelf[x.id]=v}
 try{await IMGREADY}catch(e){}const img=Object.assign({},IMG);
 const n=gamesList().length,np=Object.keys(img).length;
 const data=JSON.stringify({type:'tksim-device-backup',v:1,at:Date.now(),app:APP_VERSION,ls,shelf,img});
 const d=new Date(),nm=`tony-khan-sim-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
 const blob=new Blob([data],{type:'application/json'});
 /* phones: the share sheet's "Save to Files" is the reliable way out of a home-screen app */
 try{const f=new File([blob],nm,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Tony Khan Simulator backup'});toast(`Backed up ${n} game${n===1?'':'s'}${np?` and ${np} photos`:''}.`);return}}
 catch(e){if(e&&e.name==='AbortError')return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
 toast(`Backed up ${n} game${n===1?'':'s'}${np?` and ${np} photos`:''}.`)}
function restoreAll(){if(TV)return toast('Exit TV mode first (top right).');const i=fileInput();i.accept='.json,application/json';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d=null;try{d=JSON.parse(r.result)}catch(e){}
  if(!d||d.type!=='tksim-device-backup'){if(d&&d.w&&d.titles&&d.phase)return toast('That\'s a single-game save — use Load a save file / Import for it.');return toast("That file isn't a Tony Khan Simulator backup.")}
  restoreAll2(d)};r.readAsText(f)};i.click()}
async function restoreAll2(d){openModal(`<div class="h mhd">Restoring…</div><p class="muted">Putting your games back on this device.</p>`);
 const ls=d.ls||{},bShelf=d.shelf||{};let added=0,fail=0;
 const bMeta=(()=>{try{return JSON.parse(ls.tksim_meta||'{}')}catch(e){return {}}})();
 const bSolo=(()=>{try{return ls[KEY]?JSON.parse(ls[KEY]):null}catch(e){return null}})();
 /* the solo game you're playing here: if the backup has a different one, put yours on the shelf first so nothing is overwritten */
 const cur=soloState();let takeSolo=!!(bSolo&&bSolo.w)&&!shelfList().some(x=>x.id===bMeta.sid);
 if(takeSolo&&cur&&cur.w){if(soloMeta().sid&&soloMeta().sid===bMeta.sid){takeSolo=(bMeta.at||0)>(soloMeta().at||0)}
  else{try{await shelveSolo()}catch(e){closeModal();return toast("This device is out of storage — couldn't make room to restore.")}}}
 if(ON())leaveLeagueView();
 RESTORING=true;
 const put=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){fail++;return false}};
 /* shelved solo games */
 const have=new Set(shelfList().map(x=>x.id));const curSid=takeSolo?bMeta.sid:soloMeta().sid;
 const bList=(()=>{try{return JSON.parse(ls[SHELF]||'[]')}catch(e){return []}})();
 for(const id of Object.keys(bShelf)){if(have.has(id)||id===curSid)continue;try{await shelfPut(id,bShelf[id])}catch(e){fail++;continue}
  let st=null;try{st=JSON.parse(bShelf[id])}catch(e){}const ent=bList.find(x=>x.id===id)||{id,label:saveLabel(st),t:soloTitle(st),sub:stageTxt(st),at:Date.now(),meta:{}};
  try{const l=shelfList();l.push(ent);shelfSet(l);added++}catch(e){fail++}}
 /* the solo game that was being played */
 if(takeSolo){if(put(KEY,ls[KEY])){put('tksim_meta',ls.tksim_meta||'{}');added++}}
 /* league seats: add any this device doesn't already know */
 try{const bg=JSON.parse(ls.tksim_games||'[]');const l=mpGames();const codes=new Set(l.map(g=>g.code));bg.forEach(g=>{if(!codes.has(g.code)){l.push(g);added++}});if(bg.length)put('tksim_games',JSON.stringify(l))}catch(e){}
 /* everything else (league copies, device id, name, alerts, cloud link…) only fills gaps — nothing here is replaced */
 for(const k of Object.keys(ls)){if(k===KEY||k===SHELF||k==='tksim_games'||k==='tksim_meta'||BK_SKIP(k))continue;if(localStorage.getItem(k)==null)put(k,ls[k])}
 /* photos */
 const img=d.img||{};const puts=Object.entries(img).filter(([k,v])=>typeof v==='string'&&v.startsWith('data:image/')&&!IMG[k]);
 if(puts.length){try{await IMGREADY}catch(e){}puts.forEach(([k,v])=>IMG[k]=v);
  try{await idbWrite(puts,[]);puts.forEach(([k,v])=>PSAVED&&(PSAVED[k]=v))}catch(e){try{localStorage.setItem(KEY+'_img',JSON.stringify(IMG))}catch(e2){fail++}}}
 openModal(`<div class="h mhd">${fail?'Restored — mostly':'All restored ✅'}</div><p>${added} game${added===1?'':'s'}${puts.length?` and ${puts.length} photo${puts.length===1?'':'s'}`:''} put back on this device.${fail?` <b>${fail} item${fail===1?'':'s'} didn't fit</b> — this device may be low on storage.`:''}</p><p class="muted tiny">Leagues pick up the latest turns from online the next time you open them.</p><button class="btn" onclick="location.reload()">Open my games</button>`)}
function backupCard(){return `<div class="card mt"><div class="h small">💾 Back up this device</div><p class="muted" style="margin-top:0">One file with <b>every</b> game on this device — solo games, league seats and photos. Save it to Files before deleting the app, then tap <b>Restore</b> after re-adding it.</p><div class="row"><button class="btn sec" onclick="backupAll()">Back up all games</button><button class="btn sec" onclick="restoreAll()">Restore</button></div></div>`}
function soloTitle(st){return st&&st.w?`${st.gm||'You'} vs ${st.rival||'The Rival Office'}`:'Solo game'}
function stageTxt(st){return !st||!st.w?'':st.phase==='draft'?`Season ${st.season} · Draft`:st.phase==='rookies'?`Season ${st.season} · Creating wrestlers`:st.phase==='over'?`Season ${st.season} · Complete`:`Season ${st.season} · Week ${Math.min(st.week,SEASON)}`}
function gamesList(){const out=[];const cur=soloState();
 if(cur&&cur.w)out.push({k:'solo',id:soloSid(),t:soloTitle(cur),sub:stageTxt(cur),at:soloMeta().at,active:!ON()&&!TV,cur:1,fans:cur.fans&&cur.fans.p,wk:cur.phase==='season'?cur.week:null});
 shelfList().forEach(x=>out.push({k:'solo',id:x.id,t:x.t||x.label,sub:x.sub||'',at:x.at}));
 mpGames().forEach(g=>{let st=null;try{st=JSON.parse(LS.get('tksim_game_'+g.code)||'null')}catch(e){}
  const turn=st&&st.online?(simOn(st)?(st.phase==='over'||!(st.online.booked||{}).p?'mine':'wait'):st.online.turn==='p'?'mine':'wait'):'';out.push({k:'league',id:g.code,t:g.label||g.code,sub:`League ${g.code}${st?' · '+stageTxt(st):' · on another device'}`,turn,active:ON()&&!TV&&LMP&&LMP.code===g.code,fans:st&&st.fans&&st.fans.p,wk:st&&st.phase==='season'?st.week:null})});
 return out}
/* v91: the games screen is a full-screen lobby — your most urgent game up top, the rest below, new games as tiles */
function gOpen(g){return g.k==='league'?`mpOpen('${g.id}')`:g.cur?'openActiveSolo()':`openSolo('${g.id}')`}
function gStatus(g){return g.active?'<span class="lbst on">● Playing now</span>':g.turn==='mine'?'<span class="lbst turn">Your turn</span>':g.turn==='wait'?'<span class="lbst">Waiting</span>':g.at?`<span class="lbst">${esc(whenTxt2(g.at))}</span>`:''}
function gameRow(g){return `<div class="lbrow ${g.turn==='mine'?'turn':''}${g.active?' on':''}"><button class="lbmain" onclick="${g.active?'closeModal()':gOpen(g)}"><span class="lbtag ${g.k}">${g.k==='league'?'League':'Solo'}</span><span class="lbtx"><b>${esc(g.t)}</b><small>${esc(g.sub||'')}</small></span>${gStatus(g)}</button><button class="lbmore" onclick="gameMenu('${g.k}','${g.id}',${g.cur?1:0})" aria-label="More options">⋯</button></div>`}
function gameHero(g){const lab=g.turn==='mine'?"It's your turn":g.active?'Pick up where you left off':g.turn==='wait'?'Waiting on your friends':'Jump back in';
 const stat=(v,l)=>v!=null&&v!==''?`<div class="lbhs"><b>${v}</b><small>${l}</small></div>`:'';
 return `<div class="lbhero ${g.turn==='mine'?'turn':''}"><div class="lbkick"><span class="lbtag ${g.k}">${g.k==='league'?'League':'Solo'}</span>${esc(lab)}</div>
 <div class="lbht">${esc(g.t)}</div><div class="lbsub">${esc(g.sub||'')}</div>
 ${g.wk||g.fans?`<div class="lbstats">${stat(g.wk?`${Math.min(g.wk,SEASON)}<i>/${SEASON}</i>`:'','Week')}${stat(g.fans?fmtFans(g.fans):'','Fans')}${g.at&&g.k==='solo'?stat(esc(whenTxt2(g.at)),'Last played'):''}</div>`:''}
 <div class="lbhb"><button class="btn" onclick="${g.active?'closeModal()':gOpen(g)}">${g.turn==='mine'?'▶ Take your turn':'▶ Continue'}</button><button class="lbmore big" onclick="gameMenu('${g.k}','${g.id}',${g.cur?1:0})" aria-label="More options">⋯</button></div></div>`}
function openGames(){if(TV)return toast('This screen is showing a league — tap Exit TV to switch games.');const l=gamesList();
 const hero=l.find(g=>g.turn==='mine')||l.find(g=>g.active)||l.slice().sort((a,b)=>(b.at||0)-(a.at||0))[0];const rest=l.filter(g=>g!==hero);
 const tile=(i,t,d,on)=>`<button class="lbtile" onclick="${on}"><span class="lbti">${i}</span><b>${t}</b><small>${d}</small></button>`;
 openModal(`<div id="games"><div class="lbtop"><div class="lbbrand">Tony Khan <span>Simulator</span></div>${l.some(g=>g.active)?'<button class="lbx" onclick="closeModal()" aria-label="Close">✕</button>':''}</div>
 ${inApp()?'':`<div class="note">📱 You're in a browser tab. Games here don't share saves with the home-screen app — to get turn alerts there, tap <b>⋯ → Move</b> on a game.</div>`}
 ${hero?gameHero(hero):'<div class="lbhero"><div class="lbht">No games yet</div><div class="lbsub">Start one below.</div></div>'}
 ${rest.length?`<div class="lbsec">Your other games <span>${rest.length}</span></div><div class="lblist">${rest.map(gameRow).join('')}</div>`:''}
 <div class="lbsec">New game</div>
 <div class="lbtiles">${tile('🎮','Solo game','You vs the rival office','newSolo()')}${tile('🌐','Host a league','Play friends online','mpHostForm()')}${tile('🔗','Join a league','Got an invite code?','mpJoinForm()')}${tile('📲','Receive a game','Move one from another device','rcvForm()')}</div>
 <div class="lbsec">This device</div>
 <div class="lbtiles">${tile('💾','Back up all','Every game in one file','backupAll()')}${tile('♻️','Restore','From a backup file','restoreAll()')}</div></div>`)}
function gameMenu(k,id,cur){const g=gamesList().find(x=>x.k===k&&x.id===id);if(!g)return;
 openModal(`<div class="h mhd">${esc(g.t)}</div><p class="muted" style="margin-top:0">${esc(g.sub||'')}</p>
 <button class="btn" onclick="moveGame('${k}','${id}',${cur})">📲 Move to my app or another device</button>
 <button class="btn ghost danger" onclick="delGame('${k}','${id}',${cur})">${k==='league'?'Remove this league from this device':'Delete this game'}</button><button class="btn ghost" onclick="openGames()">Back</button>`)}
/* ---- moving a game ---- */
function moveGame(k,id,cur){if(k==='league'){const g=mpGames().find(x=>x.code===id);if(!g||!g.key)return toast('This device doesn\'t hold the seat code for that league.');
  return openModal(`<div class="h mhd">Move this league</div><p>Your seat moves with everything in it — mid-draft is fine.</p><ol class="steps"><li>Copy this seat code.</li><li>Open the game from your <b>home screen</b> (or the other device).</li><li>Tap <b>⇄ → Receive a game</b> and paste it.</li><li>Turn on turn alerts there.</li></ol><div class="mpcode" style="font-size:22px">${g.code}-${g.key}</div><button class="btn" onclick="copyTxt('${g.code}-${g.key}')">Copy seat code</button><p class="muted tiny">Keep it private. Once the seat opens on the new device, this one stops syncing it.</p><button class="btn ghost" onclick="openGames()">Back</button>`)}
 openModal(`<div class="h mhd">Move this game</div><p>This makes a one-time move code. Enter it in the home-screen app (or on another device) with <b>⇄ → Receive a game</b>. Needs a connection for a moment.</p><button class="btn" id="mvGo" onclick="moveSolo('${id}',${cur})">Make a move code</button><button class="btn sec" onclick="exportSave()">Or save a file instead</button><button class="btn ghost" onclick="openGames()">Back</button>`)}
async function moveSolo(id,cur){if(!mpAvail()||!TKO.ready||!TKO.cloudPut)return mpNeedSetup();const b=$('#mvGo');if(b){b.disabled=true;b.textContent='Making code…'}
 try{if(cur&&S&&!ON())saveLocal();const data=cur?JSON.stringify(soloState()):await shelfGet(id);if(!data)throw new Error('nodata');const st=JSON.parse(data);
  const code=newCode(12);await TKO.cloudPut(code,{state:data,label:saveLabel(st),at:Date.now(),dev:devId(),leagues:'[]',transfer:true},0);
  openModal(`<div class="h mhd">Move code ready</div><ol class="steps"><li>Open the game from your <b>home screen</b> (or the other device).</li><li>Tap <b>⇄ → Receive a game</b>.</li><li>Enter this code.</li></ol><div class="mpcode" style="font-size:24px">${fmtCode(code)}</div><button class="btn" onclick="copyTxt('${code}')">Copy move code</button><p class="muted tiny">The game stays here too. Once it's on the new device, you can delete this copy from ⇄ Your games.</p><button class="btn ghost" onclick="closeModal()">Done</button>`)}
 catch(e){console.warn(e);if(b){b.disabled=false;b.textContent='Make a move code'}toast(navigator.onLine?"Couldn't make a move code — try again.":'You need a connection to make a move code.')}}
async function copyTxt(t){try{await navigator.clipboard.writeText(t);toast('Copied.')}catch(e){toast(t)}}
function rcvForm(){openModal(`<div class="h mhd">Receive a game</div><p class="muted">Paste a <b>move code</b> (12 letters) for a solo game, or a <b>seat code</b> (it has a dash) for a league.</p><input id="rcvCode" maxlength="24" autocapitalize="characters" placeholder="ABCD-EFGH-JKLM" style="text-transform:uppercase;letter-spacing:2px"><button class="btn mt" id="rcvGo" onclick="rcvGo()">Receive</button>${navigator.clipboard&&navigator.clipboard.readText?'<button class="btn sec" onclick="rcvPaste()">Paste</button>':''}<button class="btn ghost" onclick="openGames()">Back</button>`)}
async function rcvPaste(){try{const t=await navigator.clipboard.readText();$('#rcvCode').value=(t||'').trim()}catch(e){toast('Long-press the box and choose Paste.')}}
async function rcvGo(){if(TV)return toast('Exit TV mode first (top right).');const raw=($('#rcvCode').value||'').trim().toUpperCase().replace(/\s+/g,'');
 if(/^[A-Z0-9]{6}-[A-Z0-9]{6,12}$/.test(raw)){if(!mpAvail())return mpNeedSetup();mpJoinForm();$('#mpCode').value=raw;return mpJoin()}
 const id=raw.replace(/[^A-Z0-9]/g,'');if(id.length!==12)return toast('Move codes have 12 letters and numbers.');if(!mpAvail()||!TKO.ready)return mpNeedSetup();
 const b=$('#rcvGo');b.disabled=true;b.textContent='Receiving…';
 try{const d=await TKO.cloudGet(id);if(!d||!d.state)throw new Error('nogame');const st=JSON.parse(d.state);if(!st.w||!st.phase)throw new Error('bad');
  await shelveSolo();leaveLeagueView();try{localStorage.setItem(KEY,d.state)}catch(e){afterSoloLoad();return toast("Couldn't receive that game — your device may be out of storage.")}
  LS.set('tksim_meta',JSON.stringify({at:Date.now(),sid:newCode(8)}));afterSoloLoad();toast(`📲 ${soloTitle(st)} is on this device now.`)}
 catch(e){console.warn(e);b.disabled=false;b.textContent='Receive';const m=String(e&&e.message||e);toast(m.includes('nogame')?'No game found for that code.':navigator.onLine?"Couldn't receive that game — check the code.":'You need a connection to receive a game.')}}
async function delGame(k,id,cur){const g=gamesList().find(x=>x.k===k&&x.id===id);if(!g)return;
 if(k==='league'){if(ON()&&LMP&&LMP.code===id)return mpLeave();const gm=mpGames().find(x=>x.code===id);if(!confirm(`Remove ${g.t} from this device? The other GMs keep playing; you can rejoin with your seat code${gm&&gm.key?` (${id}-${gm.key})`:''}.`))return;
  LS.del('tksim_game_'+id);LS.del(mpUnsentKey(id));LS.del(mpUnsentKey(id)+'_n');LS.set('tksim_games',JSON.stringify(mpGames().filter(x=>x.code!==id)));LS.set('tksim_gone',JSON.stringify(mpGone().filter(c=>c!==id).concat([id]).slice(-30)));cloudSoon();return openGames()}
