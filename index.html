<p><b>The overnights:</b> the show that gains more fans tonight wins the night (the better show rating breaks a dead heat), and a win pays the ratings bonus. The reveal opens on the overnights chart, with both shows' running totals across the top, and plays segment by segment underneath it: your segment lands with its cards and stars while the chart dims, and under them up to two of the crowds it moved, each with ▲ or ▼ and the main reason. Crowds judge stars against what they’ve come to expect, and that rises as you give them better shows: <b>Blown away</b>, <b>Loved it</b> and <b>Satisfied</b> mean your stars worked for them (Satisfied only just); <b>Wanted better</b> means they fell short; <b>Expect more now</b> means they fell short of a standard your recent shows raised. Other reasons name what moved them instead, such as star power, a title, a story or a run-in. Casuals judge the whole show, so one can come for the stars even when another crowd wants better. Then the chart lights up and your line moves by the fans that segment gained or lost; then the same for the rival's. The main event is the overrun. Each segment's point is only what that segment did; <b>after the bell</b>, both lines take one last step for what happened beyond the segments. Each show's plate is a receipt of that step: every line shows its fans (the casual weekly drop-off, a crowd that only got a taste or had nothing on the card, bonuses such as a delivered crowd chant, and which crowds switched shows), and the lines add up to the step. Story fans count toward the night for both shows: arc payoffs and kept promises add to it, and broken promises take away. Tap <b>more</b> for the smaller lines. Casuals who convert to another crowd are listed underneath; they stay fans of that show. Then you see how every crowd moved on your show, and the winner of the night lands on top of it. Tap either fan total above the chart to see that booker's crowds, with the reasons behind them. In a head-to-head league week, the two fan totals on the results screen switch the same way.</p>
<p><b>✨ Suggest the rest</b> on the Book screen fills any empty slots and keeps everything you've already booked, promised or entered in a tournament. It books the best matches it can from the wrestlers' own traits — popularity, in-ring skill, crowd matchups and traits, face vs heel, no recent rematches — rated the way the show rates them, including how hot a feud is right now, as plain singles matches with clean finishes, plus a Backstage Vignette from your best talker for any open promo. It books on ability alone: it won't rest anyone who's worn down or steer around a miserable wrestler — stamina and morale are yours to manage. It ignores your checklist entirely: promises, contract clauses, title defenses, the weekly goal, the crowd's chant and building feuds and paying them off are all yours to handle, and the optional bonus promo stays empty. <b>Clear card</b> wipes everything else.</p>
<p><b>🆚 Your rival plays for fans too</b> (solo, on Normal and Hard): it comes back to the same rivalries and pays them off on PPVs, and goes after the bonuses you can. <b>Arcs:</b> up to two at once, with the same price, build, deadline and fan reward as yours; letting one fall apart costs it. <b>PPV promises:</b> it promises wrestlers a PPV spot (one at a time on Normal, two on Hard); keeping it brings fans, breaking it costs them. <b>Weekly goals and crowd chants:</b> it gets its own, worth what yours are, and goes after them some weeks on Normal and most weeks on Hard. Show results report its story payoffs, promises and weekly goals. On Normal, in your first season, its arcs, promises, goals and chants start in week 7; it runs one rivalry and arc at a time until week 15, then up to two. An Easy rival does none of this.</p>
<p><b>Difficulty:</b> Hard rivals book like pros — they rest stars before PPVs, order their card for the ratings, protect new champions and pay off feuds cleanly. Easy rivals book sloppily.</p>
<p><b>The offseason:</b> after ${PPVS[SEASON]}, the season ends with an awards show (Wrestler and Women's Wrestler of the Year, Breakout Star, Rookie, Tag Team, Feud, Match and Promo of the Year — winners start next season with a boost). Veterans feel Father Time: they lose a little in-ring each year and may retire. Prospects ready for the main roster (60+ in-ring) get called up with debut buzz. Re-sign anyone whose contract is running out before you start the new season.</p>`;

/* ===================== YOUR GAMES: several solo games and leagues on one device =====================
 The solo game you're playing lives where it always has (so backups and cloud save keep working); other solo
 games wait on a shelf in IndexedDB until you switch to them. Leagues already live in their own slots. */
const SHELF='tksim_shelf';
function shelfList(){try{return JSON.parse(LS.get(SHELF)||'[]')}catch(e){return []}}
/* throws if the list can't be written, so callers never drop a save that the list doesn't point to */
function shelfSet(l){lsPut(SHELF,JSON.stringify(l))}
let SDB=null,BOOT_Q=false;
function sdb(){if(SDB)return SDB;SDB=new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return rej('no idb');const r=indexedDB.open('tksim_saves',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});SDB.catch(()=>{});return SDB}
function sdbOp(mode,fn){return sdb().then(db=>new Promise((res,rej)=>{const t=db.transaction('s',mode);const q=fn(t.objectStore('s'));t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error)}))}
async function shelfPut(id,v){try{await sdbOp('readwrite',st=>{st.put(v,id)})}catch(e){localStorage.setItem('tksim_shelf_'+id,v)}}
async function shelfGet(id){let v=null;try{v=await sdbOp('readonly',st=>st.get(id))}catch(e){}if(!v){try{v=localStorage.getItem('tksim_shelf_'+id)}catch(e){}}return v||null}
async function shelfDel(id){try{await sdbOp('readwrite',st=>{st.delete(id)})}catch(e){}try{localStorage.removeItem('tksim_shelf_'+id)}catch(e){}}
function soloSid(){const m=soloMeta();if(!m.sid){m.sid=newCode(8);LS.set('tksim_meta',JSON.stringify(m))}return m.sid}
const inApp=()=>!!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone);
/* put the solo game you're playing on the shelf (nothing is lost if this fails: it throws before touching your save) */
async function shelveSolo(){if(S&&!ON()&&!TV)saveLocal();const st=soloState();if(!st||!st.w)return;const sid=soloSid(),m=soloMeta();
 /* it keeps its id and save time on the shelf, so cloud sync carries on with it there */
 const at=m.at||0,data=JSON.stringify(st);await shelfPut(sid,data);const l=shelfList().filter(x=>x.id!==sid);l.unshift({id:sid,label:saveLabel(st),t:soloTitle(st),sub:stageTxt(st),at,meta:m});shelfSet(l);
 try{localStorage.removeItem(KEY)}catch(e){}LS.set('tksim_meta','{}');cloudSoon()}

function afterSoloLoad(){S=load();if(S&&(!S.w||!S.phase))S=null;if(S){dataUpdate(S);ensureTraits(S);econMigrate(S);feudInit(S);showMigrate()}closeModal();tab='home';ANIM=true;render();if(S)loadRepoPhotos();cloudCheck()}
/* Order matters in the switches below: shelve the solo game first (it throws before touching anything), and only then
 close the league view. Closing the league first and then failing would leave the league on screen with no league
 slot to save into, and the next autosave would land on top of the solo game. */
async function openSolo(id){if(TV)return toast('Exit TV mode first (top right).');if(busy()&&!$('#games'))return;
 const data=await shelfGet(id);if(!data)return toast("Couldn't find that game on this device.");const ent=shelfList().find(x=>x.id===id)||{};
 try{await shelveSolo()}catch(e){console.warn(e);return toast("Couldn't switch games — your device may be out of storage.")}
 leaveLeagueView();
 try{lsPut(KEY,data)}catch(e){console.warn(e);afterSoloLoad();return toast("Couldn't switch games — your device may be out of storage. Both games are safe in ⇄ Your games.")}
 LS.set('tksim_meta',JSON.stringify(Object.assign({},ent.meta||{},{sid:id,at:ent.at||0})));
 try{shelfSet(shelfList().filter(x=>x.id!==id));await shelfDel(id)}catch(e){}afterSoloLoad()}
function openActiveSolo(){if(TV)return toast('Exit TV mode first (top right).');if(ON())return mpSolo();closeModal()}
async function newSolo(){if(TV)return toast('Exit TV mode first (top right).');try{await shelveSolo()}catch(e){return toast("Couldn't put your current game away — your device may be out of storage.")}leaveLeagueView();S=null;closeModal();tab='home';ANIM=true;render();toast('Your other games are saved in ⇄ Your games.')}
/* safety net: a shelved game whose list entry went missing (e.g. storage filled up mid-switch) is put back on the list */
async function shelfRecover(){let keys=[];try{keys=await sdbOp('readonly',st=>st.getAllKeys())||[]}catch(e){}
 try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('tksim_shelf_'))keys.push(k.slice(12))}}catch(e){}
 const have=new Set(shelfList().map(x=>x.id));const cur=soloMeta().sid;let found=0;
 for(const id of new Set(keys)){if(have.has(id)||id===cur)continue;const v=await shelfGet(id);let st=null;try{st=JSON.parse(v)}catch(e){}if(!st||!st.w)continue;
  try{const l=shelfList();l.push({id,label:saveLabel(st),t:soloTitle(st),sub:stageTxt(st),at:Date.now(),meta:{}});shelfSet(l);found++}catch(e){}}
 if(found)toast(`Found ${found} saved game${found>1?'s':''} — they're in ⇄ Your games.`)}
/* ===================== BACK UP EVERYTHING ON THIS DEVICE (v92) =====================
 One file with every solo game (playing + shelved), every league seat, your settings and your photos — so the
 home-screen app can be deleted and re-added without losing anything. Restoring merges: games already here stay. */
let RESTORING=false;
const BK_SKIP=k=>k==='tksim_bk'||k.startsWith('tksim_shelf_');
async function backupAll(){if(TV)return toast('Exit TV mode first (top right).');
 try{if(S&&!TV)saveLocal()}catch(e){}
 const ls={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||BK_SKIP(k)||k===KEY+'_img')continue;if(k.startsWith('tksim')||k===KEY)ls[k]=localStorage.getItem(k)}}catch(e){}
 const shelf={};for(const x of shelfList()){const v=await shelfGet(x.id);if(v)shelf[x.id]=v}
 try{await IMGREADY}catch(e){}const img=Object.assign({},IMG);
 const n=gamesList().length,np=Object.keys(img).length;
 const data=JSON.stringify({type:'tksim-device-backup',v:1,at:Date.now(),app:APP_VERSION,ls,shelf,img});
 const d=new Date(),nm=`tksim-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
 const blob=new Blob([data],{type:'application/json'});
 /* phones: the share sheet's "Save to Files" is the reliable way out of a home-screen app */
 try{const f=new File([blob],nm,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'TKSim backup'});toast(`Backed up ${n} game${n===1?'':'s'}${np?` and ${np} photos`:''}.`);return}}
 catch(e){if(e&&e.name==='AbortError')return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
 toast(`Backed up ${n} game${n===1?'':'s'}${np?` and ${np} photos`:''}.`)}
function restoreAll(){if(TV)return toast('Exit TV mode first (top right).');const i=fileInput();i.accept='.json,application/json';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d=null;try{d=JSON.parse(r.result)}catch(e){}
  if(!d||d.type!=='tksim-device-backup'){if(d&&d.w&&d.titles&&d.phase)return toast('That\'s a single-game save — use Load a save file / Import for it.');return toast("That file isn't a TKSim backup.")}
  restoreAll2(d)};r.readAsText(f)};i.click()}
async function restoreAll2(d){openModal(`<div class="h mhd">Restoring…</div><p class="muted">Putting your games back on this device.</p>`);
 const ls=d.ls||{},bShelf=d.shelf||{};let added=0,fail=0;
 const bMeta=(()=>{try{return JSON.parse(ls.tksim_meta||'{}')}catch(e){return {}}})();
 const bSolo=(()=>{try{return ls[KEY]?JSON.parse(ls[KEY]):null}catch(e){return null}})();
 /* the solo game you're playing here: if the backup has a different one, put yours on the shelf first so nothing is overwritten */
 const cur=soloState();let takeSolo=!!(bSolo&&bSolo.w)&&!shelfList().some(x=>x.id===bMeta.sid);
 if(takeSolo&&cur&&cur.w){if(soloMeta().sid&&soloMeta().sid===bMeta.sid){takeSolo=(bMeta.at||0)>(soloMeta().at||0)}
  else{try{await shelveSolo()}catch(e){closeModal();return toast("This device is out of storage — couldn't make room to restore.")}}}
 if(ON())leaveLeagueView();
 RESTORING=true;
 const put=(k,v)=>{try{lsPut(k,v);return true}catch(e){fail++;return false}};
 /* shelved solo games */
 const have=new Set(shelfList().map(x=>x.id));const curSid=takeSolo?bMeta.sid:soloMeta().sid;
 const bList=(()=>{try{return JSON.parse(ls[SHELF]||'[]')}catch(e){return []}})();
 for(const id of Object.keys(bShelf)){if(have.has(id)||id===curSid)continue;try{await shelfPut(id,bShelf[id])}catch(e){fail++;continue}
  let st=null;try{st=JSON.parse(bShelf[id])}catch(e){}const ent=bList.find(x=>x.id===id)||{id,label:saveLabel(st),t:soloTitle(st),sub:stageTxt(st),at:Date.now(),meta:{}};
  try{const l=shelfList();l.push(ent);shelfSet(l);added++}catch(e){fail++}}
 /* the solo game that was being played */
 if(takeSolo){if(put(KEY,ls[KEY])){put('tksim_meta',ls.tksim_meta||'{}');added++}}
 /* league seats: add any this device doesn't already know */
 try{const bg=JSON.parse(ls.tksim_games||'[]');const l=mpGames();const codes=new Set(l.map(g=>g.code));bg.forEach(g=>{if(!codes.has(g.code)){l.push(g);added++}});if(bg.length)put('tksim_games',JSON.stringify(l))}catch(e){}
 /* everything else (league copies, device id, name, alerts, cloud link…) only fills gaps — nothing here is replaced */
 for(const k of Object.keys(ls)){if(k===KEY||k===SHELF||k==='tksim_games'||k==='tksim_meta'||k==='tksim_dev'||BK_SKIP(k))continue;if(localStorage.getItem(k)==null)put(k,ls[k])}
 /* photos */
 const img=d.img||{};const puts=Object.entries(img).filter(([k,v])=>typeof v==='string'&&v.startsWith('data:image/')&&!IMG[k]);
 if(puts.length){try{await IMGREADY}catch(e){}puts.forEach(([k,v])=>IMG[k]=v);
  try{await idbWrite(puts,[]);puts.forEach(([k,v])=>PSAVED&&(PSAVED[k]=v))}catch(e){try{localStorage.setItem(KEY+'_img',JSON.stringify(IMG))}catch(e2){fail++}}}
 openModal(`<div class="h mhd">${fail?'Restored — mostly':'All restored ✅'}</div><p>${added} game${added===1?'':'s'}${puts.length?` and ${puts.length} photo${puts.length===1?'':'s'}`:''} put back on this device.${fail?` <b>${fail} item${fail===1?'':'s'} didn't fit</b> — this device may be low on storage.`:''}</p><button class="btn" onclick="location.reload()">Open my games</button>`)}

 return cc.replace(/<\/div>\s*$/,dev+'</div>')}
function soloTitle(st){return st&&st.w?`${st.gm||'You'} vs ${st.rival||'The Rival Office'}`:'Solo game'}
function stageTxt(st){return !st||!st.w?'':st.phase==='draft'?`Season ${st.season} · Draft`:st.phase==='rookies'?`Season ${st.season} · Creating wrestlers`:st.phase==='over'?`Season ${st.season} · Complete`:`Season ${st.season} · Week ${Math.min(st.week,SEASON)}`}
function gamesList(){const out=[];const cur=soloState();
 if(cur&&cur.w)out.push({k:'solo',id:soloSid(),t:soloTitle(cur),sub:stageTxt(cur),at:soloMeta().at,active:!ON()&&!TV,cur:1,fans:cur.fans&&cur.fans.p,wk:cur.phase==='season'?cur.week:null});
 shelfList().forEach(x=>out.push({k:'solo',id:x.id,t:x.t||x.label,sub:x.sub||'',at:x.at}));

  const turn=st&&st.online?(simOn(st)?(st.phase==='over'||!(st.online.booked||{}).p?'mine':'wait'):st.online.turn==='p'?'mine':'wait'):'';out.push({k:'league',id:g.code,t:g.label||g.code,sub:`League ${g.code}${st?' · '+stageTxt(st):' · on another device'}`,turn,active:ON()&&!TV&&LMP&&LMP.code===g.code,fans:st&&st.fans&&st.fans.p,wk:st&&st.phase==='season'?st.week:null})});

function openGames(){if(TV)return toast('This screen is showing a league — tap Exit TV to switch games.');const l=gamesList();

/* ---- automatic backups (last 5 weeks + up to 3 snapshots before anything replaces a save, per game) ----
 v408: backups live in IndexedDB (the phone's big storage), not localStorage. localStorage is capped at ~5MB per
 site, and full copies of big saves used to fill it until switching games failed with "out of storage".
 BKC is the in-memory list (newest first); every change is written to IndexedDB, falling back to localStorage
 only if IndexedDB can't be used at all. Old localStorage backups are moved over at boot. */
let BKPEND=[],BKC=null,BKDB=null,BK_LS=false,BKREADY=null;
function bkdb(){if(BKDB)return BKDB;BKDB=new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return rej('no idb');const r=indexedDB.open('tksim_backups',1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});BKDB.catch(()=>{});return BKDB}
function bkOp(mode,fn){return bkdb().then(db=>new Promise((res,rej)=>{const t=db.transaction('b',mode);const q=fn(t.objectStore('b'));t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error)}))}
function bkLsRead(){try{return JSON.parse(localStorage.getItem('tksim_bk')||'[]')||[]}catch(e){return []}}
/* keep what's worth keeping, per game: no two copies of the same save, one weekly backup per week, the last
 CLOUD_BK weeks and the last 3 snapshots of each game (so one game's backups never push out another's) */
function bkTidy(l){l=l.filter(b=>b&&b.data).sort((a,b)=>(b.at||0)-(a.at||0));const same=new Set(),cnt={},out=[];
 for(const b of l){const g=b.sid||'';
  if(same.has(g+'|'+b.data))continue;same.add(g+'|'+b.data);           /* an identical copy of a newer backup of this game */
  if(!b.why){if(same.has(g+'|w|'+b.tag))continue;same.add(g+'|w|'+b.tag)} /* an older weekly backup of the same week */
  const c=cnt[g]||(cnt[g]={a:0,m:0});if(b.why?c.m++<3:c.a++<CLOUD_BK)out.push(b)}

function bkLsWrite(l){for(let n=l.length;n>0;n--){try{localStorage.setItem('tksim_bk',JSON.stringify(l.slice(0,n)));return}catch(e){}}try{localStorage.removeItem('tksim_bk')}catch(e){}}
let BK_Q=Promise.resolve();

 .catch(()=>{BK_LS=true;bkLsWrite(l)});return BK_Q}
function bkBoot(){if(BKREADY)return BKREADY;BKREADY=(async()=>{let db=[];try{db=await bkOp('readonly',st=>st.get('list'))||[]}catch(e){BK_LS=true}

function lsRoom(){if(BK_LS)return false;const old=bkLsRead();if(!old.length)return false;BKPEND=BKPEND.concat(old);try{localStorage.removeItem('tksim_bk')}catch(e){}
 if(BKC){BKC=bkTidy(BKC.concat(BKPEND));BKPEND=[];bkFlush()}else bkBoot();return true}

function lsPut(k,v){try{localStorage.setItem(k,v);return}catch(e){if(!lsRoom())throw e}localStorage.setItem(k,v)}
function localBackups(){return BKC||BKPEND.concat(bkLsRead())}
function localBackup(why,st,sid){st=st||soloState();if(!st||!st.w)return;if(!sid&&st===soloState())sid=soloMeta().sid;const tag=`${st.season}-${st.week}`;

/* ===================== CLOUD SYNC (v196): every solo game, both ways =====================
 Your sync code holds every solo game you play, each in its own slot (saves/{code}/games/{id}), and every device on
 the code keeps all of them up to date. The rules that keep saves safe:
   • Everything saves on the device first. The cloud catches up in the background and nothing waits on it.
   • An upload only lands if nobody else saved that game since this device last synced it. If both sides changed,
     you're asked which to keep — never decided silently — and the other version is kept as a backup.
   • A newer cloud version only replaces a game that has no unsynced changes on this device, and the game you're
     playing gets a backup first. Nothing is applied while you're mid-show or mid-edit.
   • Deleting a game hides it from your other devices, but its cloud copy stays: Backups → Deleted games brings it back.
   • Uploads and checks run one at a time, so two of them never race on the same game.
 Saves from older versions of the app (one game in the main save document) are brought over once, and a device still
 on an older version keeps working: its uploads are picked up and passed on. */
let CL_HERE=false,CL_T=null,CL_BUSY=false,CL_STATUS='',CL_DEFER=false,CL_PEND=null,CL_BIG='';
const SYNC='tksim_sync';
/* per-game sync records for this sync code: rev = the cloud version we last saw, at = the local save time that
   version matches (newer local saves are unsynced), try = the save time of an upload whose answer we never got */
function syncMap(){const c=cloudCfg();let s=null;try{s=JSON.parse(LS.get(SYNC)||'null')}catch(e){}if(!s||!s.g||!c||s.code!==c.id)s={code:c?c.id:'',g:{}};return s}
function syncRec(sid){return syncMap().g[sid]||null}
function syncPut(sid,rec){const s=syncMap();if(rec===null)delete s.g[sid];else s.g[sid]=Object.assign({},s.g[sid]||{},rec);try{localStorage.setItem(SYNC,JSON.stringify(s))}catch(e){console.warn('sync record',e)}}
function activeSid(){const st=soloState();return st&&st.w?soloSid():null}
/* every solo game on this device */
function localGames(){const out=[];const a=activeSid();if(a)out.push({sid:a,at:soloMeta().at||0,active:true});shelfList().forEach(x=>{if(x&&x.id&&x.id!==a)out.push({sid:x.id,at:x.at||0})});return out}
function isDirty(g){const r=syncRec(g.sid);return !r||r.at==null||(g.at||0)>r.at}
function cloudPendingAny(){if(!cloudCfg())return false;try{return localGames().some(isDirty)||LS.get('tksim_lgsent')!==JSON.stringify(mpGames())}catch(e){return false}}
/* read by id at the moment of use: the game may have moved between playing and the shelf since the list was made */
async function localData(g){if(activeSid()===g.sid){if(S&&!ON()&&!TV)saveLocal();const st=soloState();return st&&st.w&&soloMeta().sid===g.sid?JSON.stringify(st):null}return shelfGet(g.sid)}
/* one sync job at a time */
let CL_Q=Promise.resolve();
function syncQ(fn){const p=CL_Q.then(fn,fn);CL_Q=p.catch(()=>{});return p}
function clRender(){if(tab==='office'&&$('#modal').classList.contains('hidden')&&S)render()}

/* ---- uploading ---- */
async function pushOne(g){const c=cloudCfg();if(!c||!cloudOn())return 'off';

 const r=syncRec(g.sid)||{};const at=g.at||Date.now();syncPut(g.sid,{try:at});
 try{const rev=await TKO.cloudSlotPut(c.id,g.sid,{state:data,label:saveLabel(st),t:soloTitle(st),sub:stageTxt(st),at,dev:devId()},r.rev||0);
  /* anything saved while this was in flight has a newer time than `at`, so it stays unsynced and goes up next */
  syncPut(g.sid,{rev,at,try:null,mig:false,del:false,synced:Date.now()});cloudBk(c.id,g.sid,st,data,at);return 'ok'}

/* weekly cloud backups (5 rotating slots, shared by all your games) */
function cloudBk(id,sid,st,data,at){const c=cloudCfg();if(!c||c.id!==id)return;const tag=`${st.season}-${st.week}`;c.bkTag=c.bkTag||{};if(c.bkTag[sid]===tag)return;

async function pushLeagues(){const c=cloudCfg();if(!c||!cloudOn()||!TKO.cloudLeaguesPut)return;const l=JSON.stringify(mpGames());if(LS.get('tksim_lgsent')===l)return;

async function pushDirty(){const c=cloudCfg();if(!c||!cloudOn())return;if(c.v!==2)return cloudCheck0();

/* ---- bringing a cloud version onto this device ---- */
function applyCloud(d,sid,why){if(TV)return false;if(!ON()&&(PS||ME||LQ||ED||PE||CE))return false;

 if(!ON()){S=st;dataUpdate(S);ensureTraits(S);econMigrate(S);feudInit(S);showMigrate();closeModal();if(!S.phase||S.phase!=='season'||!['home','book','roster','office','titles','arcs'].includes(tab))tab='home';ANIM=true;render();loadRepoPhotos();CL_HERE=true}return true}

async function putLocal(sid,d,o){o=o||{};const st=JSON.parse(d.state);if(!st||!st.w||!st.phase)throw new Error('bad');const at=o.at!=null?o.at:(d.at||Date.now());

 else{if(o.why){const old=await shelfGet(sid);if(old){try{localBackup(o.why,JSON.parse(old),sid)}catch(e){}}}await shelfPut(sid,d.state);const l=shelfList();const ent={id:sid,label:saveLabel(st),t:soloTitle(st),sub:stageTxt(st),at,meta:{at,sid}};const i=l.findIndex(x=>x.id===sid);if(i>=0)l[i]=ent;else l.push(ent);shelfSet(l)}

/* ---- checking the cloud: on open, coming back to the app, and Sync now ---- */
function cloudCheck(manual){return syncQ(()=>cloudCheck0(manual))}
async function cloudCheck0(manual){const c=cloudCfg();if(!c||!cloudOn())return;CL_HERE=false;
 /* a question is waiting on you; if its sheet was closed without an answer, ask again below */
 if(CL_PEND){if(/two different saves/i.test($('#modal').textContent||''))return;CL_PEND=null}CL_BUSY=true;CL_STATUS='syncing';const note={got:0,add:0,drop:0};
 try{const [d,idx]=await Promise.all([TKO.cloudGet(c.id),TKO.cloudGameList(c.id)]);
  if(d)mergeLeagues(d.leagues);

  /* a device still on an older version saves into the main document: bring that save in */
  {const b=await legacyBridge(d,idx,manual);if(b==='stop')return}
  const me=devId();const seen=new Set();
  for(const g of localGames()){seen.add(g.sid);const m=idx[g.sid]&&!(idx[g.sid].game&&idx[g.sid].game!==g.sid)?idx[g.sid]:null;let r=syncRec(g.sid);const rev=(m&&m.rev)||0;
   /* our own upload landed even though the answer never came back */
   if(m&&r&&r.try!=null&&m.dev===me&&m.at===r.try&&rev>(r.rev||0)){syncPut(g.sid,{rev,at:r.try,try:null});r=syncRec(g.sid)}
   /* first sync after the update: this game was already in the cloud, so settle it by save time instead of asking */

    if((m.at||0)>(g.at||0)){const doc=await TKO.cloudGameGet(c.id,g.sid);if(doc&&doc.state){if(g.active&&busy()&&!manual){CL_DEFER=true;continue}if(await putLocal(g.sid,doc,{why:'Older than the cloud copy'}))note.got++}continue}

   else if(newer){if(g.active&&busy()&&!manual){CL_DEFER=true;continue}const doc=await TKO.cloudGameGet(c.id,g.sid);if(doc&&doc.state){if(await putLocal(g.sid,doc))note.got++;else CL_DEFER=true}}

/* ---- saves from older versions ---- */
/* once per device: the game the old cloud save followed takes the id the old version tagged it with (the same on every
   device), and games that already had a cloud copy are settled by save time instead of being uploaded twice */
async function cloudMigrate(d){const c=cloudCfg();if(!c)return;const gid=(d&&d.game)||c.game||c.sid||newCode(8);
 if(c.sid&&c.sid!==gid&&!(d&&d.game&&c.game&&d.game!==c.game)){
  if(soloMeta().sid===c.sid&&activeSid()){const m=soloMeta();m.sid=gid;LS.set('tksim_meta',JSON.stringify(m))}
  else{const e=shelfList().find(x=>x.id===c.sid);if(e&&!shelfList().some(x=>x.id===gid)){const v=await shelfGet(c.sid);if(v){await shelfPut(gid,v);const l=shelfList().map(x=>x.id===c.sid?Object.assign({},x,{id:gid,meta:Object.assign({},x.meta||{},{sid:gid})}):x);shelfSet(l);await shelfDel(c.sid)}}}}
 const linked=c.sid?(c.sid===gid||!(d&&d.game&&c.game&&d.game!==c.game)?gid:c.sid):null;

  if(g.sid===linked){/* settled against the main save just below (the bridge), then by time against any slot */
   syncPut(g.sid,{mig:true,at:-1,lpend:!!c.pending||(g.at||0)>(c.synced||0)})}
  else{const e=shelfList().find(x=>x.id===g.sid);const cl=g.active?soloMeta().cl:e&&e.cl;if(cl&&cl>=(g.at||0))syncPut(g.sid,{mig:true,at:-1})}}

/* a device on an older version saved into the main document: treat that as a cloud version of its game */
async function legacyBridge(d,idx,manual){const c=cloudCfg();if(!d||!d.state||!c)return;const gid=d.game||c.game;if(!gid||gid.length!==8)return;
 if((d.rev||0)<=(c.lrev||0))return;
 const slot=idx[gid];const done=()=>{const c2=cloudCfg();if(c2){c2.lrev=d.rev||0;cloudSet(c2)}};
 if(d.dev===devId()||slot&&!slot.gone&&(slot.at||0)>=(d.at||0)){done();return}
 const g=localGames().find(x=>x.sid===gid);const doc={state:d.state,label:d.label,at:d.at,rev:(slot&&slot.rev)||0};
 const gr=syncRec(gid)||{};if(g&&(gr.mig?gr.lpend:isDirty(g))){if(busy()&&!manual){CL_DEFER=true;return 'stop'}cloudConflict(g,doc,{bridge:d.rev||0});return 'stop'}

/* ---- when both sides changed ---- */
function cloudConflict(g,d,o){CL_PEND={sid:g.sid,d,o:o||{}};CL_BUSY=false;

 const hereLab=g.active?saveLabel(soloState()):ent?ent.label:'This device';const hereT=g.active?soloTitle(soloState()):ent?ent.t:'';
 openModal(`<div class="h mhd">Two different saves</div><p>${hereT?`<b>${esc(hereT)}</b> was`:'This game was'} played on this device and on another one since they last synced. Which one do you want to keep playing?</p>
 <button class="choice" onclick="cloudResolve('here')"><span class="key"><span>A</span></span><div><b>This device</b> — ${esc(hereLab)}</div><div class="muted tiny">Saved ${whenTxt2(g.at)}</div></button>
 <button class="choice" onclick="cloudResolve('cloud')"><span class="key"><span>B</span></span><div><b>Cloud</b> — ${esc(d.label||'')}</div><div class="muted tiny">Saved ${whenTxt2(d.at)} on another device</div></button>
 <p class="muted tiny">The one you don't pick is kept as a backup (⚙️ Game menu → Saves &amp; backups).</p>`)}
async function cloudResolve(which){const P=CL_PEND;closeModal();if(!P){CL_PEND=null;return}const {sid,d,o}=P;

   CL_PEND=null;const ok=await putLocal(sid,d,o.bridge!=null?{rev:d.rev||0,dirty:true,why:'This device’s version (not kept)'}:{why:'This device’s version (not kept)'});
   if(o.bridge!=null){const c=cloudCfg();if(c){c.lrev=o.bridge;cloudSet(c)}}

   partners, title strip, one status chip). Each plate and partner keeps its drag position, so drag-to-swap still works. */
function hyChip(w){if(w.inj)return '<span class="hych b">Hurt</span>';const st=100-(w.fat||0),sw=staWord(st);
 if(sw!=='Fresh')return `<span class="hych ${sw==='Tired'?'w':'b'}">${sw}</span>`;
 if(w.own==='p'&&typeof moodWord==='function'&&w.mor<50)return `<span class="hych ${w.mor<35?'b':'w'}">${moodWord(w.mor)[1]}</span>`;return '<span class="hych g">Fresh</span>'}
/* v215: Book plates, face-off style — the two sides sit side by side. A one-wrestler side is a plate (overall, WIN on the
   booked winner, a status chip, name, title strip). A side of two or more is a team card: the team's name (or the members'
   names joined, biggest first, when they aren't a set team), the average overall, WIN, a shared title, and every member as
   a chip with their overall (amber when tired or hurt). Every name keeps its drag position, so drag-to-swap still works. */
function hyTeamName(ids){const t=(S.teams||[]).find(t=>ids.every(id=>t.m.includes(id)));return t?t.n:null}
function hyShort(ids,id){const ln=x=>S.w[x].name.split(' ').slice(-1)[0];return ids.filter(x=>ln(x)===ln(id)).length>1?S.w[id].name.split(' ')[0]:ln(id)}
function hyJoin(ids){const o=ids.slice().sort((a,b)=>S.w[b].pop-S.w[a].pop).map(id=>hyShort(ids,id));return o.length<2?o.join(''):o.slice(0,-1).join(', ')+' & '+o[o.length-1]}
function hyTired(w){return w.inj?'hurt':staWord(100-(w.fat||0))!=='Fresh'?'tired':''}
/* v217: back to side-by-side plates (v215), sized up, in a slimmer slot frame. */
function hyFo(w,pos,win){if(!w)return '<div class="fo"><b class="fon">TBD</b></div>';const t=titlesOf(w.id)[0];const ch=hyChip(w);
 return `<div class="fo ${w.al==='f'?'fc':'hl'}${win?' w':''}" data-dg="${pos}" data-dp="${pos}"><div class="fot"><span class="o">${ovr(w)}</span><span class="for">${win?'<span class="wn">WIN</span>':''}${win&&/hych g/.test(ch)?'':ch}</span></div><b class="fon${w.name.length>14?' ln':''}">${esc(w.name)}</b>${t?`<i class="twbelt">${esc(t.n)}</i>`:''}</div>`}
function hyTc(ids,i,si,pis,win){const ws=ids.map(id=>S.w[id]);const avg=Math.round(ws.reduce((a,w)=>a+ovr(w),0)/ws.length);
 const lead=ws.slice().sort((a,b)=>b.pop-a.pop)[0];const nm=hyTeamName(ids)||hyJoin(ids);
 const bt=Object.values(S.titles).find(t=>t.holders.length>=2&&t.holders.every(id=>ids.includes(id)));
 const mem=ids.map((id,k)=>{const w=S.w[id],td=hyTired(w);return `<span class="mc ${w.al==='f'?'fc':'hl'}${td?' t':''}" data-dg="w:${i}:${si}:${pis[k]}" data-dp="w:${i}:${si}:${pis[k]}"><i>${ovr(w)}</i>${esc(hyShort(ids,id))}${td?' · '+td:''}</span>`}).join('');
 return `<div class="fo tm ${lead.al==='f'?'fc':'hl'}${win?' w':''}"><div class="fot"><span class="o">${avg}</span><span class="for">${win?'<span class="wn">WIN</span>':''}</span></div><b class="fon${nm.length>14?' ln':''}">${esc(nm)}</b>${bt?`<i class="twbelt">${esc(bt.n)}</i>`:''}<div class="mcs">${mem}</div></div>`}
/* v272: tap a plate on the Book screen to make that side the winner — no need to open the match */
function cwOk(m){return m&&!m.nc&&!m.tour&&!isSp(m)&&!isSq(m)&&m.type!=='gauntlet'&&m.type!=='open'&&!ocPending(m)}
function cwTag(h,m,i,si){if(!cwOk(m)||!m.sides[si]||!m.sides[si].every(Boolean))return h;return h.replace(/^<div /,`<div data-cw="${i}:${si}" `)}
function crownTap(i,si){if(mpLocked()||LIVE)return;const sl=S.card.p[i];const m=sl&&sl.d;if(!m||sl.k!=='match'||!cwOk(m)||!m.sides[si])return;
 const nm=sideName(m.sides[si]);if(m.winner===si)return toast(`👑 ${nm} already wins this one — tap the other side to flip it.`);
 const ri=m.ri;if(ri&&ri.k==='cost'&&m.sides[si].includes(ri.t))return toast(`The run-in costs ${S.w[ri.t].name} this match — open it to change that first.`);
 m.winner=si;delete m.ev;save();render();if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}
 let cc=[];try{cc=typeof ccLosers==='function'?ccLosers(m,'p'):[]}catch(e){}toast(cc.length?`👑 ${nm} wins — but ${cc.map(w=>w.name).join(' & ')} won't agree to lose.`:`👑 ${nm} wins.`)}
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('[data-cw]');if(!el||!el.closest('.rord')||Date.now()<DG_SUP)return;
 e.stopPropagation();e.preventDefault();const [i,si]=el.dataset.cw.split(':').map(Number);crownTap(i,si)},true);
function hyFace(m,i){const n=m.sides.length;const wi=m.nc?-1:m.winner;
 const sides=m.sides.map((sd,si)=>{const ps=sd.map((id,pi)=>({id,pi})).filter(x=>x.id&&S.w[x.id]);
  if(!ps.length)return hyFo(null);if(ps.length===1)return hyFo(S.w[ps[0].id],`w:${i}:${si}:${ps[0].pi}`,si===wi);
  return hyTc(ps.map(x=>x.id),i,si,ps.map(x=>x.pi),si===wi)});
 const cw=sides.map((h,si)=>cwTag(h,m,i,si));
 return n===2?`<div class="hyface">${cw[0]}<span class="vs">vs</span>${cw[1]}</div>`:`<div class="hyface multi">${cw.join('')}</div>`}
function hyPromo(p,i){const a=S.w[p.a],b=p.b&&S.w[p.b];return b?`<div class="hyface">${hyFo(a,`pw:${i}:a`)}<span class="vs">&amp;</span>${hyFo(b,`pw:${i}:b`)}</div>`:`<div class="hyface one">${hyFo(a,`pw:${i}:a`)}</div>`}
/* v218: compact plates — overall + last name on one line, a small title / partners line under it; the winner gets the gold
   frame and a gold name instead of a WIN tag; an amber dot marks anyone tired or hurt. Same drag positions as the big plates. */
function hyCp(o){return `<div class="cpp ${o.al==='f'?'fc':'hl'}${o.win?' w':''}"${o.pos?` data-dg="${o.pos}" data-dp="${o.pos}"`:''}><span class="o">${o.ovr}</span><span class="cpn"><b>${esc(o.name)}</b>${o.sub?`<span class="cps">${o.sub}</span>`:''}</span>${o.tired?'<i class="cpd" title="Tired"></i>':''}</div>`}
function hyCpSide(ps,i,si,win){if(!ps.length)return hyCp({ovr:'–',name:'TBD'});
 if(ps.length===1){const w=S.w[ps[0].id],t=titlesOf(w.id)[0];return hyCp({al:w.al,win,pos:`w:${i}:${si}:${ps[0].pi}`,ovr:ovr(w),name:hyShort([w.id],w.id),sub:t?esc(t.n):'',tired:!!hyTired(w)})}
 const ids=ps.map(x=>x.id),ws=ids.map(id=>S.w[id]),lead=ws.slice().sort((a,b)=>b.pop-a.pop)[0];const nm=hyTeamName(ids);
 const avg=Math.round(ws.reduce((a,w)=>a+ovr(w),0)/ws.length);
 const sub=ps.map(x=>dnm(S.w[x.id],`w:${i}:${si}:${x.pi}`)).join(' · ');
 return hyCp({al:lead.al,win,ovr:avg,name:nm||hyShort(ids,lead.id)+' +'+(ids.length-1),sub,tired:ws.some(hyTired)})}
function hyCpFace(m,i){const wi=m.nc?-1:m.winner;const sides=m.sides.map((sd,si)=>cwTag(hyCpSide(sd.map((id,pi)=>({id,pi})).filter(x=>x.id&&S.w[x.id]),i,si,si===wi),m,i,si));
 return sides.length===2?`<div class="hyface cmpf">${sides[0]}<span class="vs">vs</span>${sides[1]}</div>`:`<div class="hyface cmpf multi">${sides.join('')}</div>`}
function hyCpPromo(p,i){const one=(w,k)=>{if(!w)return '';const t=titlesOf(w.id)[0];return hyCp({al:w.al,pos:`pw:${i}:${k}`,ovr:ovr(w),name:hyShort([w.id],w.id),sub:t?esc(t.n):'',tired:!!hyTired(w)})};
 const a=S.w[p.a],b=p.b&&S.w[p.b];return b?`<div class="hyface cmpf">${one(a,'a')}<span class="vs">&amp;</span>${one(b,'b')}</div>`:`<div class="hyface cmpf one">${one(a,'a')}</div>`}
const HY_BUZZ=TELLS.map(t=>t[2]);
function hyBook(root){if(!root)return;root.querySelectorAll('.rord>.slot,.slot').forEach(sl=>{if(sl.dataset.hy)return;sl.dataset.hy='1';
  const lb=sl.querySelector(':scope>.lbl');if(!lb)return;const hd=document.createElement('div');hd.className='shd';sl.insertBefore(hd,lb);hd.appendChild(lb);
  const t=sl.querySelector('.tellrow .tell:not(.wild)');
  /* v220: the crowd buzz reads as words in the slot's top corner (it was a five-segment bar duplicating the tell below) */
  if(t){t.classList.add('hdt');hd.appendChild(t)}
  /* tags, match type and the buzz share one line under the plates (the winner is on the plates, so it leaves the text) */
  const face=sl.querySelector(':scope>.hyface');if(!face)return;const line=document.createElement('div');line.className='hyline';
  sl.querySelectorAll(':scope>.tags').forEach(x=>{[...x.children].forEach(c=>line.appendChild(c));x.remove()});
  const sub=[...sl.children].find(c=>c.matches('div.muted'));if(sub){const tx=sub.textContent.replace(/\s*·\s*Winner:.*$/,'').trim();if(tx){const sp=document.createElement('span');sp.className='hysub';sp.textContent=tx;line.appendChild(sp)}sub.remove()}
  const tr=sl.querySelector(':scope>.tellrow');if(tr){[...tr.children].forEach(c=>line.appendChild(c));tr.remove()}
  if(BOOK_CMP){let tg=0;[...line.children].forEach(c=>{if(c.classList.contains('hysub')||(c.classList.contains('tg')&&tg++>0)||c.classList.contains('wild'))c.remove()})}
  if(line.children.length)face.after(line)})}
/* v212: the Hybrid look (v214: the only look — html.lk-hy is always on).
   Section labels lose their emoji in it; the label already says what the section is. */
function skinOn(){return document.documentElement.classList.contains('lk-hy')}
const HY_EMO=/^[\p{Extended_Pictographic}\uFE0F\u200D\s]+/u;
function hyTidy(root){if(!skinOn()||!root)return;root.querySelectorAll('.small,.atb>b,.hyps>summary>b,.card.warn,.card.warn>*:first-child').forEach(el=>{const n=el.firstChild;if(n&&n.nodeType===3&&HY_EMO.test(n.nodeValue))n.nodeValue=n.nodeValue.replace(HY_EMO,'')})}
{hookStep('render','look: compact book, tidy panels',{before(){document.documentElement.classList.toggle('cmp',!!BOOK_CMP)},after(){try{hyTidy(document.getElementById('app'));hyBook(document.getElementById('app'))}catch(e){}}})}
{hookStep('openModal','index.html',{after(ctx,o){try{hyTidy(document.getElementById('modal'))}catch(e){}return o}})}
