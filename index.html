:root{--bg:#09090b;--st1:#18191e;--st2:#101115;--line:#2b2d34;--gold:#d8b449;--gold2:#f6dd8e;--gold3:#9c7424;--red:#e2332b;--red2:#8f0f0b;--ember:#ff7a2e;--text:#f3efe6;--mut:#9b978e;--face:#4fb0ff;--heel:#ff4d4d;--good:#4fd585;--bad:#ff5a52;
--grain:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 38%);
--grunge:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60%);
--cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
--slant:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font-family:'Barlow',-apple-system,Segoe UI,Roboto,sans-serif;font-weight:500;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;background:radial-gradient(120% 55% at 50% -8%,rgba(255,138,46,.20),transparent 60%),radial-gradient(90% 45% at 105% 0%,rgba(226,51,43,.16),transparent 60%),radial-gradient(80% 60% at 50% 115%,rgba(216,180,73,.08),transparent 60%),linear-gradient(180deg,#121216 0%,#0a0a0c 55%,#060607 100%);background-attachment:fixed}
body:before{content:none}
body:after{content:none}
body.lock{overflow:hidden}
#app{position:relative;z-index:1}
.h,.mhd,.showname,.logo,.ovr,.btn,.chip,label,.crown,.mini,.badge,.vs,nav.tabs button,.tile b,.hudc,.slot .lbl,.key{font-family:'BC','Barlow Condensed','Arial Narrow',Impact,sans-serif}
.h{text-transform:uppercase;letter-spacing:.03em;font-weight:800;font-style:italic}
/* header */
header.top:before{content:"";position:absolute;left:0;right:0;bottom:100%;height:120px;background:#09090b;pointer-events:none}
header.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px 9px;padding-top:max(10px,calc(env(safe-area-inset-top) + 14px));background:#09090b;border-bottom:1px solid #000;box-shadow:0 1px 0 rgba(216,180,73,.35),0 8px 24px rgba(0,0,0,.6)}
header.top:after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;background:linear-gradient(90deg,var(--gold) 0%,var(--red) 55%,transparent 100%)}
.brand{position:relative;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ver{position:absolute;left:1px;bottom:-9px;font:600 9px/1 'Barlow',sans-serif;letter-spacing:.08em;color:#6f6b64;pointer-events:none}
.logo{font-size:25px;font-weight:900;font-style:italic;letter-spacing:.02em;line-height:1;background:linear-gradient(180deg,#fff9df 0%,#f3d77a 38%,#b78a23 52%,#f0cf6d 72%,#fff1bc 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.8))}
.logo2{font:900 italic 15px/1 'BC',Impact,sans-serif;color:#fff;background:linear-gradient(180deg,#ff4a3d,#a8130d);padding:4px 8px 3px 6px;clip-path:var(--slant);letter-spacing:.06em}
.hud{display:flex;gap:5px;align-items:center}
.hudc{font-size:13px;font-weight:700;letter-spacing:.04em;background:linear-gradient(180deg,#22232a,#15161a);border-top:1px solid #34363e;padding:4px 10px;clip-path:var(--slant);color:#e9e4d8;white-space:nowrap}
.hudc b{color:var(--gold2);font-weight:800}
main{padding:16px 16px 110px;max-width:640px;margin:0 auto}
main.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.05s}main.enter>*:nth-child(3){animation-delay:.1s}main.enter>*:nth-child(4){animation-delay:.15s}main.enter>*:nth-child(5){animation-delay:.2s}main.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes shine{0%,72%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(320%) skewX(-20deg)}}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
@keyframes livedot{0%,100%{opacity:1}50%{opacity:.25}}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#0e0e11,#050506);box-shadow:0 -10px 30px rgba(0,0,0,.7)}
nav.tabs:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--red) 70%,transparent)}
nav.tabs button{flex:1;position:relative;background:none;border:0;color:#77736b;padding:7px 0 5px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--gold2);text-shadow:0 0 12px rgba(246,221,142,.5)}
nav.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(246,221,142,.55))}
nav.tabs button.on:before{content:"";position:absolute;top:-6px;left:22%;right:22%;height:3px;background:var(--gold2);clip-path:var(--slant);box-shadow:0 0 10px var(--gold)}
/* panels */
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.07);position:relative;background:var(--grunge),linear-gradient(180deg,var(--st1) 0%,var(--st2) 100%);border:1px solid var(--line);border-top-color:#3a3c44;padding:15px;margin-bottom:12px;clip-path:var(--cut)}
.card.warn{background:linear-gradient(180deg,#2a1810,#170d08);border-color:#6d3a18}
.card.mine{box-shadow:inset 4px 0 0 var(--gold)}
.card.theirs{box-shadow:inset 4px 0 0 #6b6d76}
.small{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--gold2);margin-bottom:10px}
.small:before{content:"";width:12px;height:12px;background:linear-gradient(135deg,var(--red),var(--ember));clip-path:polygon(40% 0,100% 0,60% 100%,0 100%);flex:none}
/* poster */
.showcard{position:relative;overflow:hidden;min-height:196px;padding:18px 16px 16px;background:var(--grain),radial-gradient(70% 90% at 85% 0%,rgba(255,150,60,.45),transparent 60%),radial-gradient(60% 80% at 0% 100%,rgba(226,51,43,.35),transparent 65%),linear-gradient(160deg,#2a1a10 0%,#120b08 55%,#07070a 100%);border:1px solid #4b3620}
.showcard.col{background:var(--grain),radial-gradient(70% 90% at 90% 0%,rgba(226,51,43,.55),transparent 60%),radial-gradient(60% 80% at 0% 100%,rgba(90,110,140,.35),transparent 65%),linear-gradient(160deg,#27100f 0%,#110909 55%,#07070a 100%);border-color:#5b2320}
.showcard.ppv{background:var(--grain),radial-gradient(80% 90% at 50% -10%,rgba(246,221,142,.55),transparent 60%),radial-gradient(60% 80% at 100% 100%,rgba(226,51,43,.35),transparent 65%),linear-gradient(170deg,#3a2a08 0%,#150f03 60%,#070604 100%);border-color:var(--gold)}
.wm{position:absolute;right:-6px;bottom:-14px;font:900 italic 86px/1 'BC',Impact,sans-serif;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.09);text-transform:uppercase;letter-spacing:-.01em;pointer-events:none;white-space:nowrap}
.kicker{display:inline-flex;gap:8px;align-items:center;font:700 13px 'BC',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#e9d9b0}
.kicker i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:livedot 1.4s infinite}
.showname{position:relative;font-size:58px;line-height:.9;margin:8px 0 6px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.005em;background:linear-gradient(180deg,#ffffff 0%,#ffe9a8 40%,#e1a93a 62%,#fff0c2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.75)) drop-shadow(0 0 18px rgba(255,160,60,.25))}
.showcard.col .showname{background:linear-gradient(180deg,#fff 0%,#ffd3cf 40%,#e2332b 64%,#ffc2bd 100%);-webkit-background-clip:text;background-clip:text}
.venue{position:relative;font:700 14px 'BC',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#cfc6b2}
.venue b{color:#fff}
.showcard .btn{position:relative}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{position:relative;overflow:hidden;text-align:left;height:108px;padding:12px;border:1px solid var(--line);border-top-color:#3c3e46;background:var(--grunge),linear-gradient(160deg,#1f2026,#111216);color:var(--text);clip-path:var(--cut);cursor:pointer;font-family:inherit;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile svg{width:26px;height:26px;fill:none;stroke:var(--gold2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(216,180,73,.4))}
.tile b{display:block;font-size:22px;font-weight:800;font-style:italic;text-transform:uppercase;line-height:1;margin-top:8px}
.tile span{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
.tile em{position:absolute;right:10px;top:6px;font:900 italic 34px/1 'BC',sans-serif;color:rgba(246,221,142,.14)}
.tile:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:40%;background:linear-gradient(90deg,var(--gold),transparent)}
/* buttons */
.btn{position:relative;overflow:hidden;display:block;width:100%;border:0;padding:14px 16px 12px;margin-top:9px;font-size:19px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.07em;color:#1b1303;background:linear-gradient(180deg,#fff0bd 0%,#ecc45e 40%,#b98a26 58%,#e8c461 100%);clip-path:var(--slant);cursor:pointer;transition:transform .1s,filter .1s}
.btn:after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 4.5s ease-in-out infinite}
.btn:active{transform:scale(.97);filter:brightness(1.15)}
.btn.sec{color:var(--text);background:linear-gradient(180deg,#2c2e36,#1a1b20);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(216,180,73,.28);font-size:16px;padding:12px 14px 10px}
.btn.sec:after,.btn.ghost:after,.btn:disabled:after{display:none}
.btn.ghost{background:none;color:var(--mut);font-size:15px}
.btn.danger{color:var(--bad)}
.btn.live{color:#fff;font-size:24px;padding:17px;background:linear-gradient(180deg,#ff6a55 0%,#e2332b 45%,#9d100b 60%,#d8261f 100%);animation:pulse 1.8s ease-in-out infinite;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.3;animation:none}
.row{display:flex;gap:8px;align-items:center}.row>.btn{margin-top:0}.row.sb{justify-content:space-between}
.mt{margin-top:10px}.center{text-align:center}
.muted{color:var(--mut);font-size:13.5px}.tiny{font-size:11.5px}.big{font-size:22px;font-weight:700}
.gold{color:var(--gold2)}.good{color:var(--good)}.bad{color:var(--bad)}.face{color:var(--face)}.heel{color:var(--heel)}.rk{color:#9fe870;font-weight:700}
.err{color:var(--bad);font-size:13.5px;margin-top:6px}
label{display:block;font-size:13px;font-weight:700;color:#bdb6a6;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.14em}
select,input{width:100%;background:#0b0b0e;color:var(--text);border:1px solid #33353d;border-bottom-color:#4a4c55;border-radius:0;padding:12px 11px;font-size:16px;font-family:'Barlow',sans-serif;font-weight:600;-webkit-appearance:none;appearance:none;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
select:focus,input:focus{outline:none;border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 11px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
.side{background:rgba(0,0,0,.35);border:1px solid #26282e;padding:10px;margin-top:8px;clip-path:var(--cut)}
.side select{margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini{background:linear-gradient(180deg,#3a2f12,#221b09);border:0;box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold2);padding:7px 12px 6px;font-weight:800;font-style:italic;font-size:14px;text-transform:uppercase;letter-spacing:.06em;clip-path:var(--slant);white-space:nowrap;cursor:pointer}
.chips{display:flex;gap:4px;overflow-x:auto;padding:0 16px 2px;margin:0 -16px;scroll-padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips:after{content:"";flex:0 0 12px}.chip{flex:none}
.card .chips{padding-left:15px;padding-right:15px;margin:0 -15px;scroll-padding:0 15px}.chips::-webkit-scrollbar{display:none}
.chip{background:#17181c;border:0;box-shadow:inset 0 0 0 1px #34363e;color:#a9a497;padding:7px 15px 6px;font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;clip-path:var(--slant);cursor:pointer}
.chip.on{background:linear-gradient(180deg,#fbe7a1,#d6ad45);color:#1a1203;box-shadow:none}
/* bars */
.bar{position:relative;height:9px;margin-top:5px;background:repeating-linear-gradient(90deg,#26272d 0 9px,transparent 9px 11px)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2));-webkit-mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 11px);mask:repeating-linear-gradient(90deg,#000 0 9px,transparent 9px 11px);box-shadow:0 0 10px rgba(246,221,142,.4)}
.bar>b{position:absolute;top:-4px;width:3px;height:17px;background:#fff;box-shadow:0 0 6px #fff}
.bar.bad>i{background:linear-gradient(90deg,#7a1410,var(--bad))}
.bar.fat>i{background:linear-gradient(90deg,#3ea36a,#e0a43a,#e2332b)}
.bar.heat>i{background:linear-gradient(90deg,#8f0f0b,var(--red),var(--ember))}
.stat{margin-top:11px}.stat .row span:first-child{font:700 14px 'BC',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#cfc8b8}
/* brand war */
.war{position:relative;height:18px;margin:8px 0 6px;background:linear-gradient(90deg,#3b3d45,#55575f);clip-path:var(--slant);overflow:hidden}
.war>i{display:block;height:100%;background:linear-gradient(90deg,#9c7424,#f6dd8e);position:relative}
.war>i:after{content:"";position:absolute;right:-2px;top:0;bottom:0;width:4px;background:#fff;box-shadow:0 0 10px #fff}
.warnames{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.warnames b{font:800 italic 20px/1 'BC',sans-serif;text-transform:uppercase}
.warnames .r{text-align:right;color:#c6c2b9}
.vsdot{font:900 italic 16px 'BC';color:var(--red)}
/* booking slots */
.slot{position:relative;display:block;width:100%;text-align:left;background:linear-gradient(90deg,rgba(216,180,73,.05),transparent 40%),linear-gradient(180deg,#16171b,#0f1013);border:1px dashed #4f4220;padding:14px 14px 14px 58px;margin-bottom:10px;color:var(--text);font-family:inherit;font-size:15px;clip-path:var(--cut);cursor:pointer;min-height:76px}
.slot.done{border:1px solid #3c3320;background:var(--grunge),linear-gradient(90deg,rgba(216,180,73,.1),transparent 50%),linear-gradient(180deg,#1b1c21,#111216)}
.slot .num{position:absolute;left:0;top:0;bottom:0;width:44px;display:flex;align-items:center;justify-content:center;font:900 italic 26px 'BC',sans-serif;color:#1a1203;background:linear-gradient(180deg,#f6dd8e,#b98a26)}
.slot:not(.done) .num{background:#23242a;color:#6d6a62}
.slot .lbl{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.slot b{font-size:16px}
.slot .add{color:var(--mut);margin-top:3px;font-weight:600}
.stars{color:var(--gold2);letter-spacing:1px;white-space:nowrap;text-shadow:0 0 10px rgba(246,221,142,.45)}
.stars.big{font-size:30px}
.proj{background:rgba(0,0,0,.45);border:1px solid #3c3320;padding:12px;margin-top:12px;text-align:center;clip-path:var(--cut)}
.news{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.news .muted{display:inline-block;min-width:34px;font:700 13px 'BC';letter-spacing:.08em;color:var(--red)}
.feud{margin-bottom:12px;font-size:14.5px;font-weight:600}
.badge{font-size:13px;font-weight:800;font-style:italic;padding:3px 10px 2px;letter-spacing:.08em;clip-path:var(--slant)}
.badge.you{background:linear-gradient(180deg,#fbe7a1,#d6ad45);color:#111}.badge.riv{background:#4a4c55}.badge.vac{background:#26272c;color:var(--mut)}
.card.belt{background:var(--grain),radial-gradient(90% 120% at 50% 0%,rgba(246,221,142,.13),transparent 60%),linear-gradient(180deg,#1d1a12,#0f0e0b);border-color:#4a3c1b}
.card.belt .h{font-size:22px}
.champ{font-size:18px;font-weight:700;margin:8px 0;cursor:pointer}
.wc.champ{margin:0;font-size:inherit;font-weight:inherit}
.seg{padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}
.note{font-size:13.5px;color:var(--gold2);margin-top:3px;font-weight:600}
/* modal */
#modal:before,#modal:after,nav.tabs:after{content:"";position:absolute;left:0;right:0;height:140px;pointer-events:none}
#modal:before{bottom:100%;background:rgba(0,0,0,.85)}
#modal:after{top:100%;background:#0c0d10}
nav.tabs:after{top:100%;background:#050506}
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(100% 70% at 50% 100%,rgba(0,0,0,.6),rgba(0,0,0,.85));animation:fadein .2s}
#modal.hidden{display:none}
.sheet{position:relative;width:100%;max-width:640px;max-height:93vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 16px calc(24px + env(safe-area-inset-bottom));background:var(--grunge),radial-gradient(90% 40% at 50% 0%,rgba(255,150,60,.12),transparent 70%),linear-gradient(180deg,#17181d 0%,#0c0d10 100%);border-top:2px solid var(--gold);box-shadow:0 -20px 50px rgba(0,0,0,.8)}
.sheet:before{content:"";position:absolute;top:8px;left:50%;width:44px;height:4px;margin-left:-22px;background:#3b3d45;border-radius:2px}
.sheet.in{animation:sheetin .32s cubic-bezier(.2,.8,.2,1)}
.sheet.swap{animation:fadein .18s}
/* iOS Safari stops fixed elements above its floating address bar. Run the pop-up 200px past the bottom
   (off-screen / behind the bar) and pad its content by the same amount, so it always reaches the true
   bottom edge and the last item still scrolls clear of the bar. Visually identical everywhere else. */
#modal{bottom:-200px}
.sheet{max-height:calc(93vh + 200px);max-height:calc(93dvh + 200px);padding-bottom:calc(224px + env(safe-area-inset-bottom))}
.mhd{font-size:30px;line-height:1;font-weight:900;font-style:italic;text-transform:uppercase;margin:4px 0 8px;background:linear-gradient(180deg,#fff7d6,#e9c258 60%,#b98a26);-webkit-background-clip:text;background-clip:text;color:transparent}
.wd-n{font-size:30px;line-height:1}
.scene{font-size:18px;line-height:1.5;margin:10px 0 16px;font-weight:600}
.choice{position:relative;display:grid;grid-template-columns:36px 1fr;column-gap:10px;align-items:center;width:100%;text-align:left;background:linear-gradient(90deg,rgba(216,180,73,.08),transparent 60%),#15161a;border:1px solid #3a3222;padding:12px;margin-bottom:9px;color:var(--text);font-size:16px;font-weight:600;font-family:inherit;clip-path:var(--cut);cursor:pointer;transition:transform .1s}
.choice:active{transform:scale(.98);border-color:var(--gold)}
.choice .key{grid-row:span 2;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;font-style:italic;color:#1a1203;background:linear-gradient(180deg,#fbe7a1,#c99a33);transform:rotate(45deg) scale(.82)}
.choice .key span{transform:rotate(-45deg)}
.outcome{padding:13px 14px;margin:10px 0;font-size:16px;font-weight:600;clip-path:var(--cut)}
.outcome.ok{background:linear-gradient(90deg,rgba(79,213,133,.22),rgba(79,213,133,.05));box-shadow:inset 4px 0 0 var(--good)}
.outcome.no{background:linear-gradient(90deg,rgba(255,90,82,.22),rgba(255,90,82,.05));box-shadow:inset 4px 0 0 var(--bad)}
.log{font-size:14.5px;color:#d6d0c2;border-left:3px solid var(--red);padding-left:10px}
.res-hd{text-align:center;margin-bottom:12px}
.res-hd .showname{font-size:48px}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:6px 0 14px;text-align:center}
.score div{background:rgba(0,0,0,.4);border:1px solid #33353d;padding:10px 6px;clip-path:var(--cut)}
.score div.me{border-color:var(--gold);background:linear-gradient(180deg,rgba(216,180,73,.18),rgba(0,0,0,.4))}
.score span{display:block;font:700 13px 'BC';letter-spacing:.12em;text-transform:uppercase;color:#bdb6a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .stars{font-size:22px}
.score i{font:900 italic 22px 'BC';color:var(--red)}
/* title screen */
.hero{text-align:center;padding:34px 0 16px;position:relative}
.hero .kicker{justify-content:center}
.hero-t{font:900 italic 64px/.88 'BC',Impact,sans-serif;text-transform:uppercase;margin:12px 0 10px;background:linear-gradient(180deg,#fff 0%,#ffe9a8 40%,#d99b2b 62%,#fff0c2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.8)) drop-shadow(0 0 30px rgba(255,150,60,.35))}
.hero p{max-width:420px;margin:0 auto}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:linear-gradient(180deg,#26272d,#15161a);box-shadow:inset 0 0 0 1px var(--gold);color:var(--text);padding:11px 20px;font-size:14.5px;font-weight:600;max-width:90vw;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;clip-path:var(--slant)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
details summary{cursor:pointer;margin:0}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}.prow .wl{flex:1;min-width:0}.prow .wn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prow a.mini{text-decoration:none}
.card details,.sheet details.card{margin-bottom:10px}
details p{font-size:14.5px;color:#d0cabc}
/* wrestler cards */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-items:start}
.wc{position:relative;display:block;width:100%;aspect-ratio:3/4;overflow:hidden;background:#111;border:0;padding:0;color:var(--text);font-family:inherit;text-align:left;cursor:pointer;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:transform .12s}
.wc:active{transform:scale(.96)}
.wc:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 0 2px #5a4a2e}
.wc.t1:before{box-shadow:inset 0 0 0 2px #f1d27a,inset 0 0 18px rgba(246,221,142,.35)}
.wc.t2:before{box-shadow:inset 0 0 0 2px #c7cfd9}
.wc.t3:before{box-shadow:inset 0 0 0 2px #a8703f}
.wc.t1:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,240,190,.28) 42%,transparent 54%);background-size:250% 100%;animation:foil 5s linear infinite}
@keyframes foil{from{background-position:120% 0}to{background-position:-120% 0}}
.wc.champ .o{background:linear-gradient(180deg,#fbe7a1,#c99a33);color:#1a1203}
.wc.sel{outline:3px solid var(--gold2);outline-offset:-3px}
.wc .pic{position:absolute;inset:0}
.wc .pic>*,.fav>*,.wd-pic>*{width:100%;height:100%;object-fit:cover;display:block}
.wc .al{position:absolute;left:0;top:0;bottom:0;width:4px;z-index:2}
.al.fc{background:var(--face)}.al.hl{background:var(--heel)}
.wc .o{position:absolute;top:6px;left:8px;z-index:2;background:rgba(0,0,0,.8);color:var(--gold2);font:900 italic 18px/1 'BC',Impact,sans-serif;padding:3px 7px 2px 5px;clip-path:var(--slant)}
.wc .ic{position:absolute;top:5px;right:7px;z-index:2;font-size:12px;text-shadow:0 1px 2px #000}
.wc .nm{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:26px 7px 7px 10px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85) 42%,#000)}
.wc .nm b{display:block;font:800 italic 15.5px/1 'BC',sans-serif;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.wc .nm span{display:block;font-size:11px;color:#c9c4b8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.wc .trt{position:absolute;left:6px;top:31px;z-index:2;display:flex;flex-direction:column;gap:2px}
.wc .trt i{font-style:normal;font-size:12px;line-height:1;background:rgba(0,0,0,.72);border-radius:50%;width:21px;height:21px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(246,221,142,.35)}
.wc .cwb{position:absolute;right:6px;top:24px;z-index:2;background:var(--gold);color:#140e02;font:900 9px/1 'BC',sans-serif;letter-spacing:.08em;padding:3px 5px 2px}
.wc .ms{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}
.wc .ms div{min-width:0}.wc .ms small{display:block;font:700 8px/1 'BC',sans-serif;letter-spacing:.1em;color:#a9a397}
.wc .ms em{display:block;font:800 italic 13px/1.05 'BC',sans-serif;color:#fff}
.wc .ms u{position:relative;display:block;height:3px;background:rgba(255,255,255,.14);margin-top:2px;text-decoration:none}
.wc .ms u i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold3),var(--gold2))}
.wc .ms u s{position:absolute;top:-1px;width:2px;height:5px;background:#7ee0a1;margin-left:-1px}
.wc .nm span i{font-style:normal;font-weight:700}.wc .nm span i.face{color:var(--face)}.wc .nm span i.heel{color:var(--heel)}
.why{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;margin:3px 4px 0 0;border-radius:3px;background:rgba(255,255,255,.06)}
.why.up{color:var(--good);background:rgba(79,213,133,.12)}.why.dn{color:var(--bad);background:rgba(255,90,82,.12)}
.trl{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin-top:6px;background:rgba(255,255,255,.04);border-left:3px solid var(--gold)}
.trl .ti{font-size:20px;line-height:1.1}.trl b{display:block;font:800 italic 15px/1.1 'BC',sans-serif;text-transform:uppercase;letter-spacing:.03em}.trl span{font-size:13px;color:var(--mut)}
.mrow{padding:9px 0;border-top:1px solid var(--line)}.mrow:first-of-type{border-top:0}
.mrow .row{align-items:center}.mrow .fav{margin-right:8px}
.whyd{margin-top:8px;text-align:left}.whyd summary{cursor:pointer;color:var(--gold2);font-weight:700;font-size:13px}
.qp{display:flex;gap:14px;align-items:flex-start;margin:14px 0 12px}.qp .wd-pic{flex:none}
.qsteps{margin:10px 0 0;padding-left:20px;color:var(--mut);font-size:14px}.qsteps li{margin:2px 0}.qsteps b{color:var(--text)}
a.btn{display:block;text-align:center;text-decoration:none}
.tpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tp{text-align:left;background:var(--st2);border:1px solid var(--line);color:var(--text);padding:8px;font-family:inherit;cursor:pointer}
.tp b{display:block;font:800 italic 14px/1.1 'BC',sans-serif;text-transform:uppercase}.tp span{display:block;font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.3}
.tp.on{border-color:var(--gold);background:rgba(216,180,73,.14);box-shadow:inset 0 0 0 1px var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold);padding:0;margin:4px 0 0;background:none;border:0}
.wc.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#131418 0 8px,#101114 8px 16px);color:var(--gold)}
.wc.empty:before{box-shadow:inset 0 0 0 1.5px #6a5720}
.wc.empty span{font:900 38px/1 'BC',sans-serif}.wc.empty small{color:var(--mut);text-transform:uppercase;font:700 12px 'BC';letter-spacing:.14em;margin-top:4px}
.vsrow{display:flex;gap:8px;align-items:center;margin-top:12px}
.vscol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.vs{font:900 italic 30px/1 'BC',Impact,sans-serif;text-align:center;margin:4px 0;background:linear-gradient(180deg,#ff8a6a,#e2332b 55%,#8f0f0b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000)}
.trow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.crown{background:#17181c;border:0;box-shadow:inset 0 0 0 1px #3a3c44;color:var(--mut);padding:8px 10px 7px;font-weight:800;font-style:italic;font-size:14px;text-transform:uppercase;letter-spacing:.06em;width:100%;white-space:nowrap;clip-path:var(--slant);cursor:pointer}
.crown.on{background:linear-gradient(180deg,#fbe7a1,#d6ad45);color:#111;box-shadow:none}
.side .row .crown{width:auto}

   else if(sl.k==='promo'&&sl.d.res){const p=sl.d;const notes=[];const st=clamp(p.res.stars+adj(b),.5,5);applyPromo(p,notes);segs.push({txt:S.w[p.a].name+(p.b&&S.w[p.b]?' & '+S.w[p.b].name:''),sub:PT[p.type].n,stars:st,notes});v.push(st)}});
  return {segs,v}};
 order.forEach(b=>{const r=ON()&&b==='ai'?asOther(()=>airCard('p')):airCard(b);vals[b]=r.v;
  out.blocks.push({brand:b,label:show.ppv?`${b==='p'?S.gm:S.rival}'s card`:`${showNames()[b]} — ${b==='p'?S.gm:S.rival}`,segs:r.segs})});
 const extra={p:0,ai:0};
 if(show.ppv){const segs=[];
  ['p','ai'].forEach(b=>{const sl=S.card[b].find(x=>x.k==='chal');const c=sl&&sl.d;if(!c)return;const t=S.titles[c.title];const ch=S.w[c.c];
   if(!t||!t.holders.length||!ch||ch.inj||ch.own!==b)return;const h=S.w[t.holders[0]];if(!h||h.inj||h.own===b||!h.own)return;
   const m={type:'singles',stip:'std',sides:[[h.id],[ch.id]],winner:0,title:t.id};
   const sc=w=>w.ring*.4+w.pop*.4+w.mom*2+R(0,25);m.winner=sc(ch)>sc(h)+5?1:0;
   const res=rateMatch(m,ctx);const notes=[];const txt=matchText(m);applyMatch(m,res,ctx,notes);

 const rt={};

 out.blocks.forEach(bl=>{if(bl.brand!=='x')bl.rating=rt[bl.brand]});
 ['p','ai'].forEach(b=>{const r=rt[b];let d;const o=b==='p'?'ai':'p';

const HOWTO=`<p><b>Match ratings</b> blend in-ring skill (the best worker in the match helps carry the rest), popularity, chemistry (styles that mesh — high-flyers vs powerhouses, technicians vs technicians — plus face vs heel and history together), feud heat, stipulation fit, title prestige and fatigue.</p>
<p><b>Traits</b> (the round badges on each card) add chemistry and bonuses on top of style — e.g. a Monster vs an Underdog is +4, a Storyteller adds +1 with anyone. Open any wrestler to see their best opponents and tag partners on your roster with the reasons, or tap <b>Why?</b> under a match's projected rating.</p>
<p><b>Front office situations</b> pop up now and then after a show — backstage fights, viral videos, social media trouble, contract demands, travel mishaps, and the occasional viral opportunity. Pick how to handle each one; every option has tradeoffs. These are randomly generated fictional events.</p>
<p><b>Free agency</b> rotates: after the draft only about 8 unsigned wrestlers are on the market at once, each for a few weeks, with new names arriving every week (and anyone released or out of contract going straight onto it). The rival signs from the same market.</p>
<p><b>Created wrestlers</b> go into the free-agent pool and are always available to you. Draft them or sign them any week from Free Agents; the rival never signs them. Rookies carry a one-time development fee when signed (free if drafted).</p>
<p><b>Feuds</b> start and grow from matches and promos: great matches, face vs heel, title matches and messy finishes build the most heat, and the results call it out when a rivalry is brewing (20), becomes a full-blown feud (45) or a blood feud (75). Don't overdo it — running the same match again within a month costs up to 1¼★ and barely builds heat, and a feud that goes 8 weeks without a PPV payoff goes stale. Feuds also cool off when ignored. PPVs weigh heat much more heavily, so build rivalries on TV and pay them off on PPV. A PPV match cools the feud down.</p>
<p><b>Promos</b> play out as short scenes. Each choice tests mic skill, in-ring ability, popularity or luck. Promos between two wrestlers build feud heat. A <b>Contract Signing</b> books that match on your next PPV card (with a stipulation if you add one); a callout where you <b>lay down a challenge</b> promises the match for next week or the next PPV — your pick. While a match is promised, booking either wrestler against the other's stablemates or tag partners (🔗 proxy war) and trading promos where they take turns leading (↔️ back-and-forth) builds the feud without fatigue. Running the promised singles match early gives it away and halves the payoff. Deliver and it pays off; skip it and you lose fans and morale. Putting the same two in promos week after week brings diminishing returns. Each promo deals fresh options: faces get crowd-pleasing moves and heels get dirty tricks (😇/😈 — playing to character gives slightly better odds), and the scene changes depending on whether it's face vs heel, heel vs heel or face vs face.</p>
<p><b>Development:</b> wrestlers improve toward their potential by working matches (faster against better opponents) and by Performance Center training. Unused talent loses morale; overworked talent gets hurt.</p>
<p><b>Fans:</b> each week you book all of Dynamite while the rival books Collision. Your show earns or loses fans based on its rating (the main event counts most), with a bonus for beating the rival's show. PPVs swing far more fans, and All In counts double. The most fans after All In wins.</p>`;

 const res=S.last&&S.last.week===S.week-1?`Week ${S.last.week} results are in, and `:'';
 mpPass(`${res}${S.gm} has locked in ${sh.ppv?'their '+sh.name+' card':sh.mine} for week ${S.week}. Your turn to book!`);
 render();openModal(`<div class="h mhd">Card locked in ✓</div><p>Your ${esc(sh.ppv?sh.name:sh.mine)} card is saved. The week airs as soon as <b>${esc(S.rival)}</b> books ${sh.ppv?'theirs':esc(sh.theirs)}.</p><p class="muted">${mpAvail()&&TKO.alertsOn&&TKO.alertsOn(LMP.code)?"You'll get a notification when it's your turn again.":'Turn on turn alerts in the Office to get a notification when it is your turn again.'}</p><button class="btn" onclick="closeModal()">Got it</button>`)}

/* ---- create / join ---- */
function mpNeedSetup(){openModal(`<div class="h mhd">Online play isn't set up yet</div><p>Online leagues need a free Firebase project. Follow <b>ONLINE-SETUP.md</b> in the game's GitHub repo, paste your settings into <b>firebase-config.js</b>, and this button will light up.</p><button class="btn" onclick="closeModal()">OK</button>`)}
function mpHostForm(){if(!mpAvail())return mpNeedSetup();openModal(`<div class="h mhd">Host an online league</div><p class="muted">You'll book ${'Dynamite'}; your friend books Collision. You take turns — play whenever you like, even offline, and it syncs when you're back online.</p>
 <label>Your GM name</label><input id="mpName" maxlength="24" value="${esc(S&&!ON()?S.gm:LS.get('tksim_name')||'')}" placeholder="Your name">
 <button class="btn mt" id="mpGo" onclick="mpHost()">Create league</button><button class="btn ghost" onclick="closeModal()">Cancel</button>`)}
async function mpHost(){const name=($('#mpName').value||'').trim()||'You';LS.set('tksim_name',name);const b=$('#mpGo');b.disabled=true;b.textContent='Creating…';
 try{if(S&&!ON())saveLocal();const code=newCode(6),key=newCode(8);
  LMP={code,me:'host',key};MP_HOLD=true;newGame(name,'Waiting for a friend','normal',{});
  await TKO.create(code,{names:{host:name,guest:''},turn:'host',rev:1,state:JSON.stringify(S),msg:'',week:1,season:1,phase:S.phase,appUrl:location.href.split(/[?#]/)[0]},key);
  MP_HOLD=false;S.online.rev=1;saveLocal();LS.set('tksim_active',JSON.stringify(LMP));mpRemember();tab='home';ANIM=true;render();mpConnect();mpInvite(true)}
 catch(e){console.warn(e);MP_HOLD=false;LMP=null;S=load();b.disabled=false;b.textContent='Create league';toast(navigator.onLine?"Couldn't create the league — check your Firebase setup.":'You need a connection to create a league.')}}
function mpJoinForm(){if(!mpAvail())return mpNeedSetup();openModal(`<div class="h mhd">Join a league</div><p class="muted">Enter the 6-letter code your friend sent you. Moving your own seat to a new device? Enter your seat code (it has a dash) instead.</p>
 <label>Your GM name</label><input id="mpName" maxlength="24" value="${esc(LS.get('tksim_name')||(S&&!ON()?S.gm:''))}" placeholder="Your name">
 <label>League code</label><input id="mpCode" maxlength="20" autocapitalize="characters" placeholder="ABC123" style="text-transform:uppercase;letter-spacing:3px">
 <button class="btn mt" id="mpGo" onclick="mpJoin()">Join</button><button class="btn ghost" onclick="closeModal()">Cancel</button>`)}
async function mpJoin(){const name=($('#mpName').value||'').trim()||'Friend';LS.set('tksim_name',name);const raw=($('#mpCode').value||'').trim().toUpperCase().replace(/\s+/g,'');
 const [code,claim]=raw.split('-');if(!/^[A-Z0-9]{6}$/.test(code||''))return toast('Codes look like ABC123.');const b=$('#mpGo');b.disabled=true;b.textContent='Joining…';
 try{const key=claim||newCode(8);const r=claim?await TKO.claim(code,claim):await TKO.join(code,name,key);
  if(S&&!ON())saveLocal();const old=mpGames().find(x=>x.code===code);LMP={code,me:r.seat,key:claim||r.key||(old&&old.key)||key};let st=JSON.parse(r.data.state);if(r.seat==='guest')flipState(st);S=st;dataUpdate(S);ensureTraits(S);feudInit(S);mpApplyNames(r.data.names);
  saveLocal();LS.set('tksim_active',JSON.stringify(LMP));mpRemember();closeModal();tab='home';ANIM=true;render();mpConnect();
  toast(r.seat==='host'?'Welcome back, commissioner.':`You're in! You book ${showNames().p}.`);if(!claim&&mpAvail()&&TKO.canAlert())setTimeout(()=>mpAlertsPrompt(),600)}
 catch(e){console.warn(e);b.disabled=false;b.textContent='Join';const m=String(e&&e.message||e);toast(m.includes('nogame')?'No league with that code.':m.includes('full')?'That league already has two GMs.':navigator.onLine?"Couldn't join — double-check the code.":'You need a connection to join.')}}
function mpInviteText(){return `Join my Tony Khan Simulator league! Open ${location.href.split(/[?#]/)[0]} (add it to your home screen), tap "Join a league" and enter code ${LMP.code}.`}
function mpInvite(first){openModal(`<div class="h mhd">${first?'League created!':'Invite a friend'}</div><p>Send your friend this code. They open the game, tap <b>Join a league</b>, and enter it.</p><div class="mpcode">${LMP.code}</div>
 <button class="btn" onclick="mpShare()">Share invite</button>${first&&TKO.canAlert()?`<button class="btn sec" onclick="mpAlerts()">🔔 Turn on turn alerts</button>`:''}<button class="btn ghost" onclick="closeModal()">${first?'Start creating wrestlers':'Done'}</button>`)}
async function mpShare(){const t=mpInviteText();try{if(navigator.share){await navigator.share({text:t});return}}catch(e){return}try{await navigator.clipboard.writeText(t);toast('Invite copied — paste it in a text.')}catch(e){toast('Code: '+LMP.code)}}
function mpAlertsPrompt(){openModal(`<div class="h mhd">Get a ping on your turn?</div><p>Turn alerts send a notification when ${esc(S.rival)} finishes and it's your move.</p>${/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone?'<p class="muted">On iPhone, add the game to your Home Screen first (Share → Add to Home Screen), then turn alerts on from there.</p>':''}<button class="btn" onclick="mpAlerts()">🔔 Turn on turn alerts</button><button class="btn ghost" onclick="closeModal()">Not now</button>`)}
async function mpAlerts(){if(!mpAvail())return mpNeedSetup();
 if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)return toast('Add the game to your Home Screen first, then turn alerts on from the installed app.');
 try{await TKO.enableAlerts(LMP.code);toast("🔔 Turn alerts are on for this device.");closeModal();render()}
 catch(e){console.warn(e);const m=String(e&&e.message||e);toast(m.includes('denied')?'Notifications are blocked — allow them in your settings.':m.includes('unsupported')?"This browser can't do push notifications.":"Couldn't turn on alerts — try again online.")}}
function mpSeatCode(){openModal(`<div class="h mhd">Play on another device</div><p>On the new device, open the game, tap <b>Join a league</b> and enter this seat code. It moves your seat there (this device stops syncing).</p><div class="mpcode" style="font-size:22px">${LMP.code}-${LMP.key}</div><p class="muted">Keep it private — anyone with it can take over your seat.</p><button class="btn" onclick="closeModal()">Done</button>`)}

/* ---- UI bits ---- */
function mpBanner(){if(!ON())return '';const o=S.online;const joined=S.rival&&S.rival!=='Waiting for a friend';const alerts=mpAvail()&&TKO.alertsOn(LMP.code);
 const inv=!joined?`<br><a href="#" onclick="mpInvite();return false" style="color:var(--gold2)">Invite code ${LMP.code}</a>`:'';
 if(myTurn()){let what='Your turn';if(S.phase==='rookies')what='Your turn — create wrestlers, then continue';else if(S.phase==='draft')what="You're on the clock";else if(S.phase==='season')what=o.booked.ai?`Your turn — ${esc(S.rival)} has booked. Your show airs the week.`:'Your turn — book your show';else if(S.phase==='over')what='Your turn — start the next season';return `<div class="mpbar on">🟡 <span><b>${what}</b>${inv}</span></div>`}
 return `<div class="mpbar">⏳ <span>${o.booked.p?'Your card is locked in. ':''}Waiting on <b>${esc(joined?S.rival:'a friend to join')}</b>${alerts?' · 🔔 you\'ll be pinged':` · <a href="#" onclick="mpAlerts();return false" style="color:var(--gold2)">turn on alerts</a>`}${inv}</span></div>`}
function mpSetupCard(){const g=mpGames();return `<div class="card"><div class="h small">Online league</div><p class="muted" style="margin-top:0">Play head-to-head with a friend: you book one brand, they book the other, and you take turns whenever you like. Works offline too — turns sync when you're back online.</p>
 ${g.map(x=>`<button class="btn sec" onclick="mpOpen('${x.code}')">▶ ${esc(x.gm||'You')} vs ${esc(x.rival||'?')} <span class="muted tiny">${x.code}</span></button>`).join('')}
 <div class="row"><button class="btn sec" onclick="mpHostForm()">Host a league</button><button class="btn sec" onclick="mpJoinForm()">Join a league</button></div></div>`}
function mpOfficeCard(){if(!ON())return mpSetupCard();const alerts=mpAvail()&&TKO.alertsOn(LMP.code);const others=mpGames().filter(g=>g.code!==LMP.code);
 return `<div class="card"><div class="h small">Online league · ${LMP.code}</div><p class="muted" style="margin-top:0">${esc(S.gm)} (${esc(showNames().p)}) vs ${esc(S.rival)} (${esc(showNames().ai)}). You're the ${LMP.me==='host'?'host':'guest'} GM.</p>
 <button class="btn ${alerts?'sec':''}" onclick="mpAlerts()">${alerts?'🔔 Turn alerts on — refresh':'🔔 Turn on turn alerts'}</button>
 <div class="row"><button class="btn sec" onclick="mpInvite()">Invite code</button><button class="btn sec" onclick="mpSeatCode()">Other device</button></div>
 ${others.map(x=>`<button class="btn sec" onclick="mpOpen('${x.code}')">▶ Switch to ${esc(x.gm||'You')} vs ${esc(x.rival||'?')}</button>`).join('')}
 <button class="btn sec" onclick="mpSolo()">Switch to my solo game</button><button class="btn ghost danger" onclick="mpLeave()">Remove this league from this device</button></div>`}

if(typeof document!=='undefined'&&document.getElementById('app')){
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
 {const q=new URLSearchParams(location.search).get('game');if(q&&mpGames().some(g=>g.code===q))LS.set('tksim_active',JSON.stringify(mpGames().find(g=>g.code===q)));
  if(q)history.replaceState(null,'',location.pathname);
  try{const a=JSON.parse(LS.get('tksim_active')||'null');const g=a&&LS.get('tksim_game_'+a.code);if(g){LMP={code:a.code,me:a.me,key:a.key};S=JSON.parse(g)}}catch(e){LMP=null}}
 if(!LMP)S=load();if(S&&(!S.w||!S.phase))S=null;dataUpdate(S);ensureTraits(S);feudInit(S);if(!ON())showMigrate();if(S)saveLocal();loadImg();
 window.addEventListener('tko-ready',()=>{mpConnect();render()});if(window.TKO)setTimeout(mpConnect,0);
 if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{const c=e.data&&e.data.tksim==='open'&&e.data.code;if(c&&(!LMP||LMP.code!==c))mpOpen(c)});
 $('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!PS&&!ME)closeModal()});
 document.addEventListener('paste',async e=>{if(!QP||!S)return;const f=[...(e.clipboardData&&e.clipboardData.items||[])].find(x=>x.type.startsWith('image/'));if(!f)return;e.preventDefault();const id=QP.ids[QP.i];try{if(await setPhotoFrom(id,{blob:f.getAsFile()})){toast(`📸 Photo added for ${S.w[id].name}.`);quickOk()}}catch(err){toast("That picture couldn't be opened.")}});
 loadRepoPhotos();
 render();
}
</script>
<script type="module" src="online.js"></script>
</body>
