name: Prepare wrestler photos
on:
  push:
    branches: [main]
    paths: ['photos/**', '!photos/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow pillow-heif
      - run: python .github/scripts/photos.py
      - name: Commit optimized photos
        run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add -A photos
          git diff --cached --quiet || (git commit -m "Optimize photos and update photo list" && git push)
