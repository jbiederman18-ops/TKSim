name: Check the tutorial
on:
  push:
    branches: [main]
    paths: ['index.html', '*.js', '*.css', 'tools/check-tutorial.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tutorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/check-tutorial.py
